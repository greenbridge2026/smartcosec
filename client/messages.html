<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Workspace | Globalisor Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <style>
        body { 
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden; 
        }
        .top-nav { height: 60px; background: #ffffff; backdrop-filter: blur(20px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1.5rem; z-index: 9999; gap: 0.5rem; justify-content: space-between; }
        .main-container { padding: 1.5rem; max-width: 1800px; margin-left: 240px !important; margin-right: auto; }
        .module-nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; width: 100% !important; box-sizing: border-box !important; }
        .module-nav-btn:hover { color: #0f172a; background: #ffffff; }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .top-nav > div:nth-child(2), #module-switcher {
            position: fixed !important;
            top: 60px !important;
            left: 0 !important;
            width: 240px !important;
            height: calc(100vh - 60px) !important;
            background: #ffffff !important;
            backdrop-filter: blur(20px) !important;
            border-right: 1px solid #e2e8f0 !important;
            border-top: none !important;
            border-left: none !important;
            border-bottom: none !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 1.5rem 1rem !important;
            gap: 0.5rem !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
            z-index: 9998 !important;
            box-shadow: none !important;
        }
        .ws-filter-btn.active {
            background: #eff6ff !important;
            color: #1d4ed8 !important;
        }
        .ws-filter-btn.active i {
            color: #1d4ed8 !important;
        }
        .reaction-popover {
            display: none !important;
        }
        .message-bubble:hover .reaction-popover {
            display: flex !important;
        }
    </style>
    <script src="/messages-enhancements.js"></script>
    <script>
        const authString = localStorage.getItem('client_auth');
        if (!authString) {
            window.location.href = '/login.html';
        } else {
            (async function() {
                try {
                    const token = localStorage.getItem('token');
                    const reqRes = await fetch('/api/requirements', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (reqRes.ok) {
                        const reqData = await reqRes.json();
                        if (reqData.status !== 'approved') {
                            window.location.href = '/requirements.html';
                        }
                    } else {
                        window.location.href = '/requirements.html';
                    }
                } catch (e) {
                    window.location.href = '/requirements.html';
                }
            })();
        }
        const auth = authString ? JSON.parse(authString) : null;
    </script>
</head>
<body>
    <nav class="top-nav">
        <div class="flex items-center gap-4">
            <div class="flex flex-col leading-none cursor-pointer" onclick="window.location.href='portal.html'">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Client</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Portal</span>
            </div>
        </div>
        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="window.location.href='portal.html?tab=home'" class="module-nav-btn" id="nav-home"><i data-lucide="layout-grid" class="w-4 h-4 shrink-0"></i> Dashboard</button>
            <button onclick="window.location.href='portal.html?tab=billing'" class="module-nav-btn" id="nav-billing"><i data-lucide="credit-card" class="w-4 h-4 shrink-0"></i> Billing</button>
            <button onclick="window.location.href='portal.html?tab=updates'" class="module-nav-btn" id="nav-updates"><i data-lucide="zap" class="w-4 h-4 shrink-0"></i> Blogs</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn active" id="nav-messages"><i data-lucide="message-square" class="w-4 h-4 shrink-0"></i> Messages</button>
        </div>
        <div class="flex items-center justify-end gap-3 relative">
            <div id="client-presence-selector" class="relative mr-4">
                <button onclick="togglePresenceMenu()" class="flex items-center gap-1.5 px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100 transition-colors">
                    <span id="current-presence-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    <span id="current-presence-text">Online</span>
                </button>
                <div id="presence-menu" class="hidden absolute top-8 right-0 bg-white border border-slate-150 rounded-xl shadow-xl w-32 p-1.5 z-[99999] flex flex-col gap-0.5">
                    <button onclick="changePresence('online')" class="flex items-center gap-2 px-2 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-50 rounded-lg text-left border-0 bg-transparent cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Online</button>
                    <button onclick="changePresence('away')" class="flex items-center gap-2 px-2 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-50 rounded-lg text-left border-0 bg-transparent cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Away</button>
                    <button onclick="changePresence('busy')" class="flex items-center gap-2 px-2 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-50 rounded-lg text-left border-0 bg-transparent cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> Busy</button>
                    <button onclick="changePresence('offline')" class="flex items-center gap-2 px-2 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-50 rounded-lg text-left border-0 bg-transparent cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> Offline</button>
                </div>
            </div>
            <button id="bell-btn" class="p-2 text-slate-600 hover:bg-white/60 rounded-full transition-colors relative border-0 bg-transparent cursor-pointer" onclick="toggleNotifs(event)" title="Notifications">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span id="notif-badge" class="absolute top-1 right-1 min-w-[16px] h-4 px-1 bg-red-500 rounded-full border-2 border-white text-[9px] font-bold text-white flex items-center justify-center hidden" style="line-height:12px;"></span>
            </button>
            <div id="notif-dropdown" class="absolute top-14 right-0 w-80 bg-white rounded-2xl border border-slate-100 shadow-2xl overflow-hidden hidden z-50 transition-all duration-200 transform origin-top-right scale-95 opacity-0">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <span class="text-xs font-bold text-slate-900 font-outfit">Notifications Center</span>
                    <button onclick="markAllNotificationsAsRead(event)" class="text-[10px] text-blue-600 font-bold hover:underline border-0 bg-transparent cursor-pointer">Mark all read</button>
                </div>
                <div id="notif-list" class="max-h-[300px] overflow-y-auto divide-y divide-slate-50 font-outfit text-left">
                    <div class="p-6 text-center text-slate-400 text-xs">No notifications yet</div>
                </div>
            </div>
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs" id="user-avatar-text">MA</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800" id="user-name">Client User</div>
                    <button onclick="localStorage.removeItem('client_auth'); localStorage.removeItem('token'); window.location.href='/login.html'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none border-0 bg-transparent cursor-pointer">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div id="view-messages">
            <div class="grid grid-cols-12 gap-6 h-[calc(100vh-140px)]">
                <!-- Panel 1: Left Navigation & Filters (col-span-2) -->
                <div class="col-span-2 bg-white border border-slate-200/80 rounded-3xl p-4 flex flex-col gap-1 shadow-sm shrink-0 overflow-y-auto">
                    <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2 mb-2">Workspace</div>
                    <button onclick="setWorkspaceFilter('all')" id="ws-all" class="ws-filter-btn active flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all text-left border-0 bg-transparent cursor-pointer">
                        <i data-lucide="message-square" class="w-4 h-4 text-slate-400 shrink-0"></i> All Support Channels
                    </button>
                    <button onclick="setWorkspaceFilter('dms')" id="ws-dms" class="ws-filter-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all text-left border-0 bg-transparent cursor-pointer">
                        <i data-lucide="user" class="w-4 h-4 text-slate-400 shrink-0"></i> Direct Support
                    </button>
                    <div id="ws-groups" class="ws-filter-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all text-left cursor-pointer" onclick="setWorkspaceFilter('groups')">
                        <i data-lucide="users" class="w-4 h-4 text-slate-400 shrink-0"></i> Team Channels
                    </div>
                    <button onclick="setWorkspaceFilter('unread')" id="ws-unread" class="ws-filter-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all text-left justify-between border-0 bg-transparent cursor-pointer">
                        <span class="flex items-center gap-3"><i data-lucide="mail" class="w-4 h-4 text-slate-400 shrink-0"></i> Unread</span>
                        <span id="unread-total-badge" class="bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
                    </button>
                    <button onclick="setWorkspaceFilter('starred')" id="ws-starred" class="ws-filter-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all text-left border-0 bg-transparent cursor-pointer">
                        <i data-lucide="star" class="w-4 h-4 text-slate-400 shrink-0"></i> Starred Messages
                    </button>

                    <button onclick="setWorkspaceFilter('files')" id="ws-files" class="ws-filter-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all text-left border-0 bg-transparent cursor-pointer">
                        <i data-lucide="file-text" class="w-4 h-4 text-slate-400 shrink-0"></i> Vault Sharing
                    </button>
                    <button onclick="setWorkspaceFilter('archive')" id="ws-archive" class="ws-filter-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all text-left border-0 bg-transparent cursor-pointer">
                        <i data-lucide="archive" class="w-4 h-4 text-slate-400 shrink-0"></i> Archive
                    </button>
                    <button onclick="setWorkspaceFilter('drafts')" id="ws-drafts" class="ws-filter-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all text-left border-0 bg-transparent cursor-pointer">
                        <i data-lucide="edit" class="w-4 h-4 text-slate-400 shrink-0"></i> Drafts
                    </button>
                </div>

                <!-- Panel 2: Center Conversation List (col-span-3) -->
                <div class="col-span-3 bg-white border border-slate-200/80 rounded-3xl overflow-hidden flex flex-col shadow-sm">
                    <!-- Search & Filter Area -->
                    <div class="p-3 border-b border-slate-100 bg-slate-50/30 flex flex-col gap-2 shrink-0">
                        <div class="relative">
                            <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="chat-search" oninput="handleSearch(this.value)" placeholder="Search workspace..." class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10">
                        </div>
                        <div class="flex gap-2 justify-between">
                            <select id="filter-role" onchange="handleRoleFilter(this.value)" class="text-[10px] font-bold text-slate-500 bg-white border border-slate-200 rounded px-1.5 py-1 focus:outline-none">
                                <option value="all">All Channels</option>
                                <option value="staff">Staff Assigned</option>
                                <option value="admin">Support Team</option>
                            </select>
                            <select id="sort-by" onchange="handleSortChange(this.value)" class="text-[10px] font-bold text-slate-500 bg-white border border-slate-200 rounded px-1.5 py-1 focus:outline-none font-outfit">
                                <option value="recent">Recent Active</option>
                                <option value="name">Name A-Z</option>
                            </select>
                        </div>
                    </div>
                    <!-- Queue list -->
                    <div id="conversation-list" class="flex-1 overflow-y-auto">
                        <div class="p-10 text-center text-slate-400 text-xs">Loading support channels...</div>
                    </div>
                </div>

                <!-- Panel 3: Right Active Chat & Details (col-span-7) -->
                <div class="col-span-7 bg-white border border-slate-200/80 rounded-3xl overflow-hidden flex shadow-sm relative">
                    <!-- Main Chat Window Area -->
                    <div id="chat-window-content" class="flex-1 flex flex-col h-full overflow-hidden">
                        <div class="flex-1 flex flex-col items-center justify-center p-12 text-center text-slate-400">
                            <div class="w-20 h-20 bg-blue-50 text-blue-300 rounded-3xl flex items-center justify-center mb-6">
                                <i data-lucide="message-square" class="w-10 h-10"></i>
                            </div>
                            <h4 class="font-bold text-slate-900 text-lg font-outfit">Client Collaboration Hub</h4>
                            <p class="text-sm mt-2 max-w-xs font-outfit">Select a support contact or group channel on the left to start real-time messaging.</p>
                        </div>
                    </div>

                    <!-- Right Information Panel (Inspect Drawer) -->
                    <div id="right-info-panel" class="w-80 h-full border-l border-slate-100 bg-slate-50/40 flex flex-col hidden transition-all duration-300 overflow-y-auto">
                        <!-- Content injected dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Attachment sharing modal / Integrations list -->
    <div id="integration-share-modal" class="fixed inset-0 z-[99999] bg-slate-950/60 backdrop-blur-sm flex items-center justify-center font-outfit hidden">
        <div class="bg-white border border-slate-150 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl p-6 relative flex flex-col">
            <h3 class="text-lg font-bold text-slate-900 mb-4 font-outfit">Share Vault Document</h3>
            <div id="share-list" class="max-h-60 overflow-y-auto divide-y divide-slate-50 mb-6 bg-slate-50/30 border border-slate-100 rounded-xl p-2 font-outfit">
                <!-- Injected dynamically -->
            </div>
            <div class="flex gap-3 justify-end">
                <button onclick="document.getElementById('integration-share-modal').classList.add('hidden')" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50 border-0 bg-transparent cursor-pointer font-outfit">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Hidden native file input -->
    <input type="file" id="chat-file-input" style="display:none" onchange="handleFileSelected(event)">

    <script>
        let messagePollInterval = null;
        let selectedClientId = null;
        let selectedTeamChatId = null;
        let selectedTeamChatName = '';
        let socket = null;
        let typingTimeout = null;
        
        let currentWorkspace = 'all'; // 'all', 'dms', 'groups', 'unread', 'starred', 'calls', 'files', 'archive', 'drafts'
        let chatSearchQuery = '';
        let roleFilter = 'all';
        let sortBy = 'recent';
        let localAttachments = [];
        let typingUsers = {};
        
        let allApplications = [];
        let allUsersList = [];
        let allDocumentsList = [];
        let allConversationsList = [];
        let presenceStatusMap = {}; 
        let lastSeenMap = {};
        let currentPresenceStatus = 'online';

        // Local Storage Lists
        const myId = auth ? auth.id : 'client-user';
        const myName = auth ? auth.name : 'Client User';
        const myRole = 'client';

        // Starred, Archive, Pinned, Favorites, Notes Lists
        let replyToMsg = null;
        let editingMessageId = null;
        let isDetailsPanelOpen = true;

        let activeRecordState = false;
        let recordTickInterval = null;
        let selectedFileCategory = 'Images';

        // Workspace selection
        window.setWorkspaceFilter = function(filter) {
            currentWorkspace = filter;
            document.querySelectorAll('.ws-filter-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('ws-' + filter);
            if (activeBtn) activeBtn.classList.add('active');
            
            // Clean up details panel and selected state if we switch to non-chat workspaces
            if (filter === 'files' || filter === 'calls') {
                selectedClientId = null;
                selectedTeamChatId = null;
                document.getElementById('right-info-panel').classList.add('hidden');
            }
            
            refreshWorkspace();
        }

        function refreshWorkspace() {
            if (currentWorkspace === 'calls') {
                loadCallHistoryWorkspace();
            } else if (currentWorkspace === 'files') {
                loadFileWorkspaceSidebar();
            } else {
                fetchConversations();
            }
        }

        window.handleSearch = function(query) {
            chatSearchQuery = query.toLowerCase().trim();
            refreshWorkspace();
        }

        window.handleRoleFilter = function(val) {
            roleFilter = val;
            refreshWorkspace();
        }

        window.handleSortChange = function(val) {
            sortBy = val;
            refreshWorkspace();
        }

        // --- Fetch initial data from APIs ---
        async function fetchApplications() {
            try {
                const res = await fetch('/api/applications');
                if (res.ok) allApplications = await res.json();
            } catch(e){}
        }

        async function fetchUsers() {
            try {
                const res = await fetch('/api/messages/users');
                if (res.ok) allUsersList = await res.json();
            } catch(e){}
        }

        async function fetchDocuments() {
            try {
                const res = await fetch('/api/documents');
                if (res.ok) allDocumentsList = await res.json();
            } catch(e){}
        }

        // --- Fetch & render DMs / Channels lists ---
        async function fetchConversations() {
            if (currentWorkspace === 'calls' || currentWorkspace === 'files') return;
            try {
                // Fetch group chats client is in
                let dynamicGroups = [];
                try {
                    const grpRes = await fetch(`/api/messages/groups?userId=${myId}`);
                    if (grpRes.ok) dynamicGroups = await grpRes.json();
                } catch(e){}

                // Build a combined conversation model mapping
                let list = [];

                // 1. Support Operations Chat (Direct channel representing myId)
                const userNotes = localStorage.getItem(`notes_${myId}_${myId}`) || '';
                const hasDraft = localStorage.getItem(`draft_${myId}_${myId}`);
                const opsOnline = presenceStatusMap['staff-admin'] === 'online' || presenceStatusMap['admin'] === 'online';
                
                list.push({
                    id: myId,
                    name: 'Support Operations',
                    role: 'admin',
                    companyName: 'Globalisor Helpdesk',
                    applicationId: 'General',
                    lastMessage: 'Direct chat with Support Desk',
                    lastMessageTime: 0,
                    unreadCount: 0,
                    isOnline: opsOnline,
                    presenceStatus: presenceStatusMap['staff-admin'] || 'offline',
                    lastSeen: null,
                    priority: 'Normal',
                    notes: userNotes,
                    hasDraft: !!hasDraft,
                    isGroup: false
                });

                // 2. Map group chats/channels
                dynamicGroups.forEach(g => {
                    const userNotes = localStorage.getItem(`notes_${myId}_${g.id}`) || '';
                    const hasDraft = localStorage.getItem(`draft_${myId}_${g.id}`);
                    
                    list.push({
                        id: g.id,
                        name: `# ${g.name}`,
                        role: 'group',
                        companyName: g.description || 'Channel Chat',
                        applicationId: 'Group',
                        lastMessage: 'Group Chat Workspace',
                        lastMessageTime: g.createdTime || 0,
                        unreadCount: 0,
                        isOnline: false,
                        lastSeen: null,
                        priority: 'Normal',
                        notes: userNotes,
                        hasDraft: !!hasDraft,
                        isGroup: true,
                        icon: g.icon || '💬',
                        createdBy: g.createdBy,
                        memberIds: g.memberIds
                    });
                });

                // 3. Map Assigned Staff Contact
                let clientServiceRes = await fetch(`/api/clients/${myId}/services`);
                if (clientServiceRes.ok) {
                    const servData = await clientServiceRes.json();
                    const activeServ = servData.services?.[0];
                    const rawStaff = activeServ ? activeServ.staff : null;
                    if (rawStaff && rawStaff !== 'Unassigned') {
                        // Locate staff user id
                        const staffUser = allUsersList.find(u => u.name.toLowerCase() === rawStaff.toLowerCase());
                        if (staffUser) {
                            const chatId = getOneToOneChatId(myId, staffUser.id);
                            const userNotes = localStorage.getItem(`notes_${myId}_${chatId}`) || '';
                            const hasDraft = localStorage.getItem(`draft_${myId}_${chatId}`);
                            const onlineStatus = presenceStatusMap[staffUser.id] || 'offline';
                            
                            list.push({
                                id: chatId,
                                realUserId: staffUser.id,
                                name: staffUser.name,
                                role: 'staff',
                                companyName: staffUser.email,
                                applicationId: 'Assigned Specialist',
                                lastMessage: 'Direct specialist channel',
                                lastMessageTime: 0,
                                unreadCount: 0,
                                isOnline: onlineStatus === 'online',
                                presenceStatus: onlineStatus,
                                lastSeen: null,
                                priority: 'High',
                                notes: userNotes,
                                hasDraft: !!hasDraft,
                                isGroup: false
                            });
                        }
                    }
                }
                // 4. Map all staff and admin contacts by default
                allUsersList.forEach(u => {
                    if (u.id === myId) return;
                    const isClient = u.role === 'CLIENT' || u.role === 'USER';
                    if (isClient) return; // Clients do not see other clients by default
                    
                    const chatId = getOneToOneChatId(myId, u.id);
                    const exists = list.some(item => item.id === chatId);
                    if (!exists) {
                        const userNotes = localStorage.getItem(`notes_${myId}_${chatId}`) || '';
                        const hasDraft = localStorage.getItem(`draft_${myId}_${chatId}`);
                        const onlineStatus = presenceStatusMap[u.id] || 'offline';
                        
                        list.push({
                            id: chatId,
                            realUserId: u.id,
                            name: u.name,
                            role: u.role.toLowerCase(),
                            companyName: u.email || 'Staff/Admin Contact',
                            applicationId: 'Internal Specialist',
                            lastMessage: 'No messages yet - Click to start conversation',
                            lastMessageTime: 0,
                            unreadCount: 0,
                            isOnline: onlineStatus === 'online',
                            presenceStatus: onlineStatus,
                            lastSeen: null,
                            priority: 'Normal',
                            notes: userNotes,
                            hasDraft: !!hasDraft,
                            isGroup: false
                        });
                    }
                });

                // Fetch latest messages from DB for channels and DMs to populate last message metadata accurately
                for (let item of list) {
                    try {
                        const msgRes = await fetch(`/api/messages?clientId=${item.id}`);
                        if (msgRes.ok) {
                            const messages = await msgRes.json();
                            if (messages.length > 0) {
                                const last = messages[messages.length - 1];
                                item.lastMessage = parseMessageTextOnly(last.text);
                                item.lastMessageTime = last.timestamp;
                                
                                // Parse attachment
                                const payload = parseMessageText(last.text);
                                item.hasAttachment = payload.attachments && payload.attachments.length > 0;
                                
                                // Calculate unread counts
                                item.unreadCount = messages.filter(m => m.senderId !== myId && !m.isRead).length;
                            }
                        }
                    } catch(e){}
                }

                // --- Apply Workspace Filters ---
                const archivedList = JSON.parse(localStorage.getItem('archived_' + myId) || '[]');
                const favoriteList = JSON.parse(localStorage.getItem('favorites_' + myId) || '[]');
                const pinnedList = JSON.parse(localStorage.getItem('pinned_' + myId) || '[]');

                if (currentWorkspace === 'archive') {
                    list = list.filter(item => archivedList.includes(item.id));
                } else {
                    list = list.filter(item => !archivedList.includes(item.id));
                }

                if (currentWorkspace === 'dms') {
                    list = list.filter(item => !item.isGroup && item.role !== 'group');
                } else if (currentWorkspace === 'groups') {
                    list = list.filter(item => item.isGroup);
                } else if (currentWorkspace === 'unread') {
                    list = list.filter(item => item.unreadCount > 0);
                } else if (currentWorkspace === 'drafts') {
                    list = list.filter(item => item.hasDraft);
                } else if (currentWorkspace === 'starred') {
                    // Handled separately
                }

                // --- Apply Search Filters ---
                if (chatSearchQuery) {
                    list = list.filter(item => 
                        item.name.toLowerCase().includes(chatSearchQuery) ||
                        item.companyName.toLowerCase().includes(chatSearchQuery) ||
                        item.lastMessage.toLowerCase().includes(chatSearchQuery) ||
                        item.applicationId.toLowerCase().includes(chatSearchQuery)
                    );
                }

                // --- Apply Role Filter ---
                if (roleFilter !== 'all') {
                    list = list.filter(item => item.role === roleFilter);
                }

                // --- Apply Sorting ---
                list.sort((a, b) => {
                    // Pinned always first
                    const aPinned = pinnedList.includes(a.id);
                    const bPinned = pinnedList.includes(b.id);
                    if (aPinned && !bPinned) return -1;
                    if (!aPinned && bPinned) return 1;

                    // Favorites second
                    const aFav = favoriteList.includes(a.id);
                    const bFav = favoriteList.includes(b.id);
                    if (aFav && !bFav) return -1;
                    if (!aFav && bFav) return 1;

                    return b.lastMessageTime - a.lastMessageTime;
                });

                // Update unread badge counter in left nav
                const totalUnread = list.reduce((sum, item) => sum + (item.unreadCount || 0), 0);
                const totalUnreadBadge = document.getElementById('unread-total-badge');
                if (totalUnreadBadge) {
                    if (totalUnread > 0) {
                        totalUnreadBadge.innerText = totalUnread;
                        totalUnreadBadge.classList.remove('hidden');
                    } else {
                        totalUnreadBadge.classList.add('hidden');
                    }
                }

                allConversationsList = list;

                if (currentWorkspace === 'starred') {
                    loadStarredWorkspaceMessages();
                } else {
                    renderConversationList(list);
                }

            } catch (e) {
                console.error("fetchConversations error:", e);
            }
        }

        // --- Drag and Drop File Upload ---
        function setupDragAndDrop() {
            const container = document.getElementById('chat-messages-container');
            const overlay = document.getElementById('drag-drop-overlay');
            if (!container || !overlay) return;

            container.addEventListener('dragenter', (e) => {
                e.preventDefault();
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            });

            container.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            container.addEventListener('dragleave', (e) => {
                const rect = container.getBoundingClientRect();
                if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
                    overlay.classList.add('opacity-0', 'pointer-events-none');
                }
            });

            container.addEventListener('drop', (e) => {
                e.preventDefault();
                overlay.classList.add('opacity-0', 'pointer-events-none');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleUploadedFile(files[0]);
                }
            });
        }

        function handleUploadedFile(file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                localAttachments.push({
                    name: file.name,
                    type: file.type,
                    size: file.size,
                    url: evt.target.result
                });
                renderAttachmentPreviews();
            };
            reader.readAsDataURL(file);
        }

        // --- Voice Recording Logic ---
        window.toggleVoiceRecording = async function() {
            const micBtn = document.getElementById('btn-voice-mic');
            const widget = document.getElementById('voice-record-widget');
            const input = document.getElementById('chat-input');
            const timer = document.getElementById('voice-record-timer');

            if (!activeRecordState) {
                // Start
                activeRecordState = true;
                if (micBtn) micBtn.classList.add('text-red-500', 'bg-red-50');
                if (widget) widget.classList.remove('hidden');
                if (input) input.classList.add('hidden');

                window.VoiceRecorder.startRecording(
                    (sec) => {
                        const m = Math.floor(sec / 60).toString().padStart(2, '0');
                        const s = (sec % 60).toString().padStart(2, '0');
                        if (timer) timer.innerText = `${m}:${s}`;
                    },
                    (err) => {
                        alert('Audio recording blocked: ' + err.message);
                        cancelVoiceRecording();
                    }
                );
            } else {
                // Stop and Send
                activeRecordState = false;
                if (micBtn) micBtn.classList.remove('text-red-500', 'bg-red-50');
                if (widget) widget.classList.add('hidden');
                if (input) input.classList.remove('hidden');

                const voiceNote = await window.VoiceRecorder.stopRecording();
                if (voiceNote) {
                    localAttachments.push(voiceNote);

        // --- Message list render helper ---
        async function fetchMessages(clientId) {
            try {
                const activeId = clientId || selectedClientId || myId;
                const res = await fetch(`/api/messages?clientId=${activeId}`);
                const messages = await res.json();
                const container = document.getElementById('chat-messages');
                if (!container) return;

                const isMe = (m) => m.senderId === myId;
                let starredList = JSON.parse(localStorage.getItem('starred_messages_' + myId) || '[]');

                // Derive partnerId from conversation id
                let partnerId = null;
                if (activeId) {
                    const parts = activeId.replace('team_chat_','').replace('chat_','').split('_');
                    partnerId = parts.find(p => p && p !== myId) || null;
                }

                // Fetch call history and filter to this conversation's partner
                let callEntries = [];
                try {
                    const cRes = await fetch(`/api/messages/calls/history?userId=${myId}`);
                    const allCalls = await cRes.json();
                    if (partnerId) {
                        callEntries = allCalls.filter(c =>
                            (c.callerId === myId && c.receiverId === partnerId) ||
                            (c.receiverId === myId && c.callerId === partnerId)
                        ).map(c => ({ ...c, _type: 'call' }));
                    }
                } catch(e) {}

                // Merge messages + call entries sorted by timestamp
                const merged = [...messages.map(m => ({ ...m, _type: 'msg' })), ...callEntries]
                    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                if (merged.filter(e => e._type === 'msg').length === 0) {
                    container.innerHTML = `<div class="p-10 text-center text-slate-400 text-xs font-outfit">No messages yet. Send a message to get assistance.</div>`;
                    if (callEntries.length === 0) return;
                }

                const renderCallEntry = (c) => {
                    const isCaller = c.callerId === myId;
                    const partnerName = isCaller ? c.receiverName : c.callerName;
                    const partnerId2 = isCaller ? c.receiverId : c.callerId;
                    const timeStr = new Date(c.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateStr = new Date(c.timestamp).toLocaleDateString([], { month: 'short', day: 'numeric' });
                    const isVideo = c.mediaType === 'video';
                    const durStr = c.duration > 0 ? `${Math.floor(c.duration/60)}m ${c.duration%60}s` : '';
                    const statusColor = c.status === 'completed' ? 'text-emerald-500' : c.status === 'declined' ? 'text-red-500' : 'text-amber-500';
                    const statusLabel = c.status === 'completed' ? 'Completed' : c.status === 'declined' ? 'Declined' : 'Missed';
                    const dirArrow = isCaller ? '↗' : '↙';
                    const phoneIcon = isVideo
                        ? `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>`
                        : `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.21 13.91a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.11 3h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 10.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
                    return `
                    <div class="flex justify-center my-2">
                        <div class="inline-flex items-center gap-2.5 bg-white border border-slate-200 rounded-2xl px-4 py-2.5 shadow-sm text-xs font-outfit">
                            <span class="w-7 h-7 rounded-full ${c.status === 'completed' ? 'bg-emerald-50 text-emerald-500' : c.status === 'declined' ? 'bg-red-50 text-red-400' : 'bg-amber-50 text-amber-500'} flex items-center justify-center shrink-0">${phoneIcon}</span>
                            <div class="flex flex-col leading-tight">
                                <span class="font-bold text-slate-700">${dirArrow} ${isVideo ? 'Video' : 'Voice'} Call</span>
                                <span class="${statusColor} font-semibold text-[10px]">${statusLabel}${durStr ? ' · ' + durStr : ''} · ${dateStr} ${timeStr}</span>
                            </div>
                            <button onclick="window.Calling && window.Calling.makeCall('${partnerId2}','${partnerName}','${c.mediaType}')" class="ml-1 p-1.5 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 transition-colors border-0 cursor-pointer" title="Call back">${phoneIcon}</button>
                        </div>
                    </div>`;
                };

                const html = merged.map(m => {
                    if (m._type === 'call') return renderCallEntry(m);
                    const payload = parseMessageText(m.text);
                    const isStarred = starredList.includes(m.id);
                    const pinnedMap = JSON.parse(localStorage.getItem('pinned_messages_map_' + myId) || '{}');
                    const isMsgPinned = pinnedMap[activeId] && pinnedMap[activeId].id === m.id;
                    
                    let ticks = '';
                    if (isMe(m)) {
                        ticks = m.isRead ? 
                            `<i data-lucide="check-check" class="w-3 h-3 text-blue-200 ml-1.5 animate-pulse"></i>` : 
                            `<i data-lucide="check" class="w-3 h-3 text-blue-100 ml-1.5"></i>`;
                    }
                    
                    let quoteHtml = '';
                    if (payload.replyTo) {
                        quoteHtml = `
                            <div class="border-l-2 border-slate-300 pl-2 py-1 mb-1 bg-slate-50/50 rounded text-[10px] text-slate-500 flex flex-col font-medium max-w-xs">
                                <span class="font-bold text-blue-600">@${payload.replyTo.senderName}</span>
                                <span class="truncate">${payload.replyTo.text}</span>
                            </div>
                        `;
                    }

                    let attachHtml = '';
                    if (payload.attachments && payload.attachments.length > 0) {
                        attachHtml = `
                            <div class="mt-2 space-y-2 select-none font-outfit">
                                ${payload.attachments.map(att => {
                                    if (att.type.startsWith('image/')) {
                                        return `<div class="relative rounded-lg overflow-hidden border border-slate-100 max-w-xs"><img src="${att.url}" class="max-h-40 object-cover cursor-zoom-in" onclick="zoomImage('${att.url}')"></div>`;
                                    } else if (att.type === 'audio/webm') {
                                        return `<div class="flex items-center gap-2 bg-slate-50 p-2 border border-slate-200 rounded-xl max-w-xs"><i data-lucide="play" class="w-4 h-4 text-blue-600 shrink-0"></i><audio src="${att.url}" controls class="w-full h-8 text-xs shrink-0 select-none"></audio></div>`;
                                    } else {
                                        return `<a href="${att.url}" download="${att.name}" class="flex items-center gap-2 p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-xs text-blue-600 font-bold border border-slate-200 truncate max-w-xs"><i data-lucide="file" class="w-4 h-4 shrink-0"></i> <span>${att.name}</span></a>`;
                                    }
                                }).join('')}
                            </div>
                        `;
                    }

                    // Reactions row
                    let reactionsHtml = '';
                    const rKeys = Object.keys(payload.reactions || {});
                    let hasReactions = false;
                    rKeys.forEach(k => {
                        if (payload.reactions[k] && payload.reactions[k].length > 0) hasReactions = true;
                    });
                    
                    if (hasReactions) {
                        reactionsHtml = `
                            <div class="flex flex-wrap gap-1 mt-1.5 font-outfit">
                                ${rKeys.map(emoji => {
                                    const users = payload.reactions[emoji] || [];
                                    if (users.length === 0) return '';
                                    const reacted = users.includes(myId);
                                    return `
                                        <button onclick="toggleReaction('${m.id}', '${emoji}')" class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${reacted ? 'bg-blue-50 border-blue-200 text-blue-600' : 'bg-slate-50 border-slate-200 text-slate-500'} hover:bg-slate-100 transition-colors border-0 bg-transparent cursor-pointer">
                                            ${emoji} ${users.length}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        `;
                    }

                    const isDeleted = payload.isDeleted;

                    return `
                    <div class="flex ${isMe(m) ? 'justify-end' : 'justify-start'} group message-bubble" id="msg-${m.id}">
                        <div class="max-w-[70%] relative font-sans">
                            <div class="flex items-center gap-2 mb-1 ${isMe(m) ? 'justify-end' : 'justify-start'}">
                                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${m.senderName}</span>
                                <span class="text-[9px] text-slate-300 font-medium">${new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                            <div class="px-4 py-2.5 rounded-2xl text-sm ${isMe(m) ? 'bg-blue-600 text-white rounded-tr-none shadow-md shadow-blue-500/10' : 'bg-white text-slate-700 border border-slate-250 rounded-tl-none shadow-sm'}">
                                ${quoteHtml}
                                <div class="flex items-end gap-3 justify-between font-outfit">
                                    <span class="break-words ${isDeleted ? 'italic text-slate-400' : ''}" style="white-space: pre-wrap;">${isDeleted ? '[Message Deleted]' : payload.text}</span>
                                    <span class="flex items-center select-none shrink-0">${ticks}</span>
                                </div>
                                ${attachHtml}
                                ${reactionsHtml}
                            </div>
                            
                            <!-- Action overlays -->
                            ${isDeleted ? '' : `
                            <div class="reaction-popover absolute top-1/2 -translate-y-1/2 ${isMe(m) ? '-left-44' : '-right-44'} bg-white border border-slate-150 rounded-xl px-2 py-1 shadow-xl flex items-center gap-1.5 z-50">
                                <button onclick="toggleReaction('${m.id}', '👍')" class="p-0.5 hover:scale-125 text-xs transition-transform border-0 bg-transparent cursor-pointer">👍</button>
                                <button onclick="toggleReaction('${m.id}', '❤️')" class="p-0.5 hover:scale-125 text-xs transition-transform border-0 bg-transparent cursor-pointer">❤️</button>
                                <button onclick="toggleReaction('${m.id}', '😂')" class="p-0.5 hover:scale-125 text-xs transition-transform border-0 bg-transparent cursor-pointer">😂</button>
                                <button onclick="toggleStarMessage('${m.id}')" class="p-1 text-slate-400 hover:text-amber-500 border-0 bg-transparent cursor-pointer" title="Star message"><i data-lucide="star" class="w-3.5 h-3.5 ${isStarred ? 'text-amber-500 fill-amber-500' : ''}"></i></button>

                await fetch(`/api/messages/${msgId}`, {

                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: JSON.stringify(payload) })
                });

            let color = 'bg-emerald-500';
            if (status === 'away') color = 'bg-amber-500';
            if (status === 'busy') color = 'bg-red-500';
            if (status === 'offline') color = 'bg-slate-400';
            
            if (dot) {

            }
            if (text) {

            }
            
            // Broadcast via socket
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'status_change',
                    userId: myId,
                    status: status
                }));
            }

        function updateHeaderPresenceStatus() {
            const statusEl = document.getElementById('chat-header-status');
            if (!statusEl) return;
            
            const activeId = selectedClientId || selectedTeamChatId || myId;
            if (selectedTeamChatId) {
                statusEl.innerText = 'Shared Channel';
                return;
            }

            let targetUserId = activeId;
            if (activeId.startsWith('team_chat_')) {
                targetUserId = activeId.replace('team_chat_', '').replace(myId, '').replace('_', '');
            } else if (activeId.startsWith('chat_')) {
                targetUserId = activeId.replace('chat_', '').replace(myId, '').replace('_', '');
            } else if (activeId === myId) {
                targetUserId = 'staff-admin';
            }

            const presence = presenceStatusMap[targetUserId] || 'offline';
            if (presence === 'online') {
                statusEl.innerText = 'Online';
                statusEl.className = 'text-[9px] text-emerald-500 font-bold uppercase tracking-widest';
            } else if (presence === 'away') {
                statusEl.innerText = 'Away';
                statusEl.className = 'text-[9px] text-amber-500 font-bold uppercase tracking-widest';
            } else if (presence === 'busy') {
                statusEl.innerText = 'Busy';
                statusEl.className = 'text-[9px] text-red-500 font-bold uppercase tracking-widest';
            } else {
                const lastSeenTime = lastSeenMap[targetUserId];
                if (lastSeenTime) {
                    const date = new Date(lastSeenTime);
                    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateStr = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
                    statusEl.innerText = `Offline (Last seen: ${dateStr} ${timeStr})`;
                } else {
                    statusEl.innerText = 'Offline';
                }
                statusEl.className = 'text-[9px] text-slate-400 font-bold uppercase tracking-widest';
            }
        }

        // --- WebSocket connection setup ---
        function connectWebSocket() {
            let wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            let wsHost = window.location.host;
            if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && window.location.hostname !== '[::1]') {
                wsHost = 'globalisor-77d7da9fe8c7.herokuapp.com';
                wsProtocol = 'wss:';
            }
            socket = new WebSocket(`${wsProtocol}//${wsHost}/api/ws/chat?userId=${myId}&role=client`);

            socket.onmessage = async function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'presence' || data.type === 'status_change') {
                        presenceStatusMap[data.userId] = data.status;
                        if (data.lastSeen) {
                            lastSeenMap[data.userId] = data.lastSeen;
                        }
                        await fetchConversations();
                        if (selectedClientId === data.userId || (selectedClientId && selectedClientId.includes(data.userId))) {
                            updateHeaderPresenceStatus();
                        }
                    } else if (data.type === 'new_user') {
                        const newUser = data.user;
                        if (newUser && !allUsersList.some(u => u.id === newUser.id)) {
                            allUsersList.push(newUser);
                            await fetchConversations();
                        }
                    } else if (data.type === 'message') {
                        const m = data.message;
                        const isGroup = m.clientId && (m.clientId.startsWith('group-') || m.clientId.startsWith('team_group_'));

                        if (selectedTeamChatId === m.clientId || selectedClientId === m.clientId || (!selectedTeamChatId && !selectedClientId && m.clientId === myId)) {
                            if (isGroup) fetchTeamMessages(m.clientId);
                            else fetchMessages(m.clientId);
                            await markAsRead(m.clientId);
                        }
                        await fetchConversations();
                    } else if (data.type === 'message_deleted') {
                        const activeId = selectedClientId || selectedTeamChatId || myId;
                        if (activeId === data.clientId) {
                            if (selectedTeamChatId) fetchTeamMessages(activeId);
                            else fetchMessages(activeId);
                        }
                    } else if (data.type === 'group_update') {
                        await fetchConversations();
                    } else if (data.type === 'notification') {
                        const notif = data.notification;
                        const isMessageFromMe = notif.type === 'message' && notif.message.startsWith(myName + ':');
                        if (!isMessageFromMe && (notif.clientId === 'all' || notif.clientId === 'client' || notif.clientId === myId || 
                            (notif.clientId.startsWith('team_group_')) ||
                            (notif.clientId.startsWith('chat_') && notif.clientId.includes(myId)) ||
                            (notif.clientId.startsWith('team_chat_') && notif.clientId.includes(myId)))) {
                            const exists = state.notifications.some(n => n.id === notif.id);
                            if (!exists) {
                                state.notifications.unshift(notif);
                                updateNotificationUI();
                                showToastNotification(notif);
                            }
                        }
                    } else if (data.type === 'typing') {
                        const activeId = selectedClientId || selectedTeamChatId || myId;
                        if (activeId === data.clientId && data.senderId !== myId) {
                            const statusEl = document.getElementById('chat-header-status');
                            if (statusEl) {
                                if (data.isTyping) {
                                    statusEl.innerText = `${data.senderName} is typing...`;
                                    statusEl.className = 'text-[9px] text-emerald-500 font-bold uppercase tracking-widest';
                                } else {
                                    updateHeaderPresenceStatus();
                                }
                            }
                        }
                    } else if (data.type === 'read_receipt') {
                        const activeId = selectedClientId || selectedTeamChatId || myId;
                        if (activeId === data.clientId) {
                            fetchMessages(activeId);
                        }
                    } else if (data.type === 'call_signal') {
                        window.Calling.handleSignal(data);
                    }
                } catch(e){}
            };

            socket.onclose = function() {
                setTimeout(connectWebSocket, 5000);
            };
        }

        // --- Typing Indicators helper ---
        function setupTypingListeners() {
            const input = document.getElementById('chat-input');
            if (!input) return;

            input.addEventListener('input', () => {
                sendTyping(true);
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => sendTyping(false), 2500);
            });
        }

        function sendTyping(isTyping) {
            const activeId = selectedClientId || selectedTeamChatId || myId;
            if (socket && socket.readyState === WebSocket.OPEN && activeId) {
                socket.send(JSON.stringify({
                    type: 'typing',
                    clientId: activeId,
                    senderId: myId,
                    senderName: myName,
                    senderRole: 'client',
                    isTyping: isTyping
                }));
            }
        }

        // --- Utility JSON parsers ---
        function parseMessageText(text) {
            if (text && text.startsWith('{') && text.endsWith('}')) {
                try { return JSON.parse(text); } catch(e){}
            }
            return { text: text, reactions: {}, attachments: [] };
        }

        function parseMessageTextOnly(text) {
            return parseMessageText(text).text;
        }

        function getOneToOneChatId(idA, idB) {
            const list = [idA, idB].sort();
            return `team_chat_${list[0]}_${list[1]}`;
        }

        window.zoomImage = function(url) {
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.95);z-index:99999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;backdrop-filter:blur(8px);';
            modal.innerHTML = `<img src="${url}" class="max-w-[90%] max-h-[90%] object-contain rounded-2xl shadow-2xl">`;
            modal.onclick = () => modal.remove();
            document.body.appendChild(modal);
        }

        // --- Notifications dropdown triggers ---
        window.toggleNotifs = function(event) {
            if (event) event.stopPropagation();
            const dropdown = document.getElementById('notif-dropdown');
            if (!dropdown) return;
            const isHidden = dropdown.classList.contains('hidden');
            if (isHidden) {
                dropdown.classList.remove('hidden');
                dropdown.offsetHeight; // force reflow
                dropdown.classList.remove('scale-95', 'opacity-0');
                dropdown.classList.add('scale-100', 'opacity-100');
                fetchNotifications();
            } else {
                dropdown.classList.remove('scale-100', 'opacity-100');
                dropdown.classList.add('scale-95', 'opacity-0');
                setTimeout(() => dropdown.classList.add('hidden'), 200);
            }
        }

        window.markAllNotificationsAsRead = async function(event) {
            if (event) event.stopPropagation();
            try {
                const res = await fetch(`/api/notifications/read-all?clientId=${myId}`, {
                    method: 'POST'
                });
                if (res.ok) {
                    state.notifications.forEach(n => {
                        if (!n.readBy.includes(myId)) n.readBy.push(myId);
                    });
                    updateNotificationUI();
                }
            } catch(e){}
        }

        window.handleNotifClick = async function(notifId, type, relatedId) {
            try {
                await fetch('/api/notifications/read', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notifId, clientId: myId })
                });
            } catch (e) {
                console.error("Failed to mark read:", e);
            }
            
            const notif = state.notifications.find(n => n.id === notifId);
            if (notif && !notif.readBy.includes(myId)) {
                notif.readBy.push(myId);
            }
            updateNotificationUI();
            
            const dropdown = document.getElementById('notif-dropdown');
            if (dropdown) {
                dropdown.classList.remove('scale-100', 'opacity-100');
                dropdown.classList.add('scale-95', 'opacity-0');
                setTimeout(() => dropdown.classList.add('hidden'), 200);
            }
            
            if (type === 'message') {
                setWorkspaceFilter('all');
                handleSelectConversation(myId, 'Support Operations', false);
            } else if (type === 'blog') {
                window.location.href = `portal.html?tab=updates&blogId=${relatedId}`;
            } else if (type === 'status_update' || type === 'assignment') {
                window.location.href = 'portal.html?tab=services';
            } else if (type === 'document_request') {
                window.location.href = 'portal.html?tab=documents';
            }
        }

        // --- Pinned Messages functions ---
        window.togglePinMessage = function(msgId, senderName, text) {
            const activeId = selectedClientId || selectedTeamChatId || myId;
            if (!activeId) return;
            
            let pinnedMap = JSON.parse(localStorage.getItem('pinned_messages_map_' + myId) || '{}');
            if (pinnedMap[activeId] && pinnedMap[activeId].id === msgId) {
                delete pinnedMap[activeId];
            } else {
                pinnedMap[activeId] = { id: msgId, senderName, text };
            }
            localStorage.setItem('pinned_messages_map_' + myId, JSON.stringify(pinnedMap));
            
            renderPinnedMessageBanner();
            if (selectedTeamChatId) fetchTeamMessages(selectedTeamChatId);
            else fetchMessages(selectedClientId);
        }

        window.renderPinnedMessageBanner = function() {
            const banner = document.getElementById('pinned-message-banner');
            if (!banner) return;
            
            const activeId = selectedClientId || selectedTeamChatId || myId;
            if (!activeId) {
                banner.classList.add('hidden');
                return;
            }
            
            const pinnedMap = JSON.parse(localStorage.getItem('pinned_messages_map_' + myId) || '{}');
            const pinData = pinnedMap[activeId];
            
            if (pinData) {
                banner.innerHTML = `
                    <div class="bg-blue-50 border-b border-blue-100 px-4 py-2 flex justify-between items-center text-xs font-semibold text-blue-800 shrink-0 font-outfit">
                        <div class="flex items-center gap-2 truncate">
                            <i data-lucide="pin" class="w-3.5 h-3.5 text-blue-600 rotate-45 shrink-0"></i>
                            <span class="truncate">Pinned: <b class="text-blue-700">${pinData.senderName}:</b> <span class="font-normal text-slate-700 italic font-sans">${pinData.text}</span></span>
                        </div>
                        <button onclick="unpinCurrentMessage()" class="text-[10px] text-blue-600 font-bold hover:underline shrink-0 ml-4 border-0 bg-transparent cursor-pointer font-outfit">Unpin</button>
                    </div>
                `;
                banner.classList.remove('hidden');
                if (window.lucide) window.lucide.createIcons();
            } else {
                banner.classList.add('hidden');
            }
        }

        window.unpinCurrentMessage = function() {
            const activeId = selectedClientId || selectedTeamChatId || myId;
            if (!activeId) return;
            
            let pinnedMap = JSON.parse(localStorage.getItem('pinned_messages_map_' + myId) || '{}');
            delete pinnedMap[activeId];
            localStorage.setItem('pinned_messages_map_' + myId, JSON.stringify(pinnedMap));
            
            renderPinnedMessageBanner();
            if (selectedTeamChatId) fetchTeamMessages(selectedTeamChatId);
            else fetchMessages(selectedClientId);
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('user-name').innerText = myName;
            document.getElementById('user-avatar-text').innerText = myName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) || 'MA';
            
            await fetchApplications();
            await fetchUsers();
            await fetchDocuments();
            connectWebSocket();
            refreshWorkspace();
            fetchNotifications();
            window.Calling.init('client');

            // Set up polling fallback for safety
            setInterval(async () => {
                await fetchApplications();
                await fetchDocuments();
                refreshWorkspace();
                fetchNotifications();
            }, 6000);
        });
    </script>
</body>
</html>
