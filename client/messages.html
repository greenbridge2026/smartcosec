<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Desk | Globalisor Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/tailwind.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="portal-style.css">
    <script src="client-sidebar.js"></script>
    <script>
        const authString = localStorage.getItem('client_auth');
        if (!authString) {
            window.location.href = '/auth.html';
        } else {
            (async function() {
                try {
                    const token = localStorage.getItem('token');
                    const reqRes = await fetch('/api/requirements', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (reqRes.ok) {
                        const reqData = await reqRes.json();
                        if (reqData.status !== 'approved') {
                            window.location.href = '/requirements.html';
                        }
                    } else {
                        window.location.href = '/requirements.html';
                    }
                } catch (e) {
                    window.location.href = '/requirements.html';
                }
            })();
        }
        const auth = authString ? JSON.parse(authString) : null;
    </script>
</head>
<body>

    <nav class="top-nav">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='portal.html'">
            <div class="flex flex-col leading-none">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Client</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Portal</span>
            </div>
        </div>

        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="window.location.href='portal.html?tab=home'" class="module-nav-btn" id="nav-home"><i data-lucide="layout-grid" class="w-4 h-4"></i> <span>Dashboard</span></button>
            <button onclick="window.location.href='portal.html?tab=services'" class="module-nav-btn" id="nav-services"><i data-lucide="activity" class="w-4 h-4"></i> <span>Workflows</span></button>
            <button onclick="window.location.href='portal.html?tab=documents'" class="module-nav-btn" id="nav-documents"><i data-lucide="shield-check" class="w-4 h-4"></i> <span>Vault</span></button>
            <button onclick="window.location.href='portal.html?tab=billing'" class="module-nav-btn" id="nav-billing"><i data-lucide="credit-card" class="w-4 h-4"></i> <span>Billing</span></button>
            <button onclick="window.location.href='portal.html?tab=guidance'" class="module-nav-btn" id="nav-guidance"><i data-lucide="book-open" class="w-4 h-4"></i> <span>Guidance</span></button>
            <button onclick="window.location.href='portal.html?tab=updates'" class="module-nav-btn" id="nav-updates"><i data-lucide="zap" class="w-4 h-4"></i> <span>Blogs</span></button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn active" id="nav-messages"><i data-lucide="message-square" class="w-4 h-4"></i> <span>Messages</span></button>
        </div>

        <div class="flex items-center justify-end gap-3 relative">
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white font-bold text-xs shadow-lg shadow-slate-200">MA</div>
                <div class="flex flex-col">
                    <span id="user-name" class="text-xs font-bold text-slate-900 leading-none mb-1">Mohammad Asif</span>
                    <button onclick="localStorage.removeItem('client_auth'); localStorage.removeItem('token'); localStorage.removeItem('globalisor_master_v3'); window.location.href='/auth.html'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div id="view-messages" class="grid grid-cols-12 gap-8 h-[calc(100vh-150px)]">
            <!-- Sidebar: Conversation Context -->
            <div class="col-span-4 bg-white/60 backdrop-blur-xl border border-white/80 rounded-3xl overflow-hidden flex flex-col shadow-sm">
                <div class="p-8 border-b border-white/60">
                    <h3 class="text-xl font-bold text-slate-900 tracking-tight mb-2">Support Desk</h3>
                    <p class="text-sm text-slate-500 leading-relaxed">Direct communication with your dedicated account management team.</p>
                </div>
                <div class="flex-1 p-6 space-y-6">
                    <div class="p-4 bg-blue-50/50 rounded-2xl border border-blue-100/50">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                <i data-lucide="shield-check" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-900 leading-none">Security Verified</h4>
                                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">End-to-End Encrypted</span>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h5 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-2">Assigned Staff</h5>
                        <div class="flex items-center gap-4 p-2">
                            <div id="staff-avatar" class="w-10 h-10 rounded-full bg-slate-100 border-2 border-white flex items-center justify-center text-slate-600 font-bold text-xs">U</div>
                            <div>
                                <div id="staff-name" class="text-sm font-bold text-slate-800">Unassigned</div>
                                <div class="text-[10px] text-slate-500">Corporate Secretary</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="col-span-8 bg-white/60 backdrop-blur-xl border border-white/80 rounded-3xl overflow-hidden flex flex-col shadow-sm">
                <div class="p-6 border-b border-white/60 flex items-center justify-between bg-white/40">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold shadow-inner">G</div>
                        <div>
                            <h3 class="font-bold text-slate-900">Globalisor Operations</h3>
                            <div class="flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Active Now</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="chat-messages" class="flex-1 overflow-y-auto p-8 space-y-6 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:20px_20px]">
                    <div class="text-center py-20">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-200 mx-auto"></i>
                    </div>
                </div>

                <div class="p-6 border-t border-white/60 bg-white/80 backdrop-blur-md">
                    <form id="chat-form" class="flex gap-4">
                        <input type="text" id="chat-input" placeholder="Type your message..." 
                            class="flex-1 px-6 py-4 bg-white/50 border border-white/60 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all shadow-inner">
                        <button type="submit" class="px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold text-sm shadow-xl shadow-blue-500/20 hover:scale-105 transition-all flex items-center gap-2">
                            <span>Send</span> <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const state = {
            user: auth,
            messages: []
        };

        async function fetchMessages() {
            try {
                const res = await fetch(`/api/messages?clientId=${state.user.id}`);
                const messages = await res.json();
                renderChatMessages(messages);
            } catch (e) { console.error('Fetch Failed:', e); }
        }

        async function sendMessage(text) {
            try {
                await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clientId: state.user.id,
                        senderId: state.user.id,
                        senderName: state.user.name,
                        senderRole: 'client',
                        text: text
                    })
                });
                fetchMessages();
            } catch (e) { console.error('Send Failed:', e); }
        }

        function renderChatMessages(messages) {
            const container = document.getElementById('chat-messages');
            if (!container) return;

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <div class="w-16 h-16 bg-blue-50 text-blue-200 rounded-2xl flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="message-square" class="w-8 h-8"></i>
                        </div>
                        <h4 class="font-bold text-slate-900">Start a Conversation</h4>
                        <p class="text-slate-500 text-sm mt-2">Send a message to our operations desk for assistance.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const html = messages.map(m => {
                const isMe = m.senderId === state.user.id;
                return `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[70%]">
                            <div class="flex items-center gap-2 mb-1 ${isMe ? 'justify-end' : 'justify-start'}">
                                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${m.senderName}</span>
                                <span class="text-[9px] text-slate-300 font-medium">${new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                            <div class="px-5 py-3 rounded-[24px] text-sm ${isMe ? 'bg-blue-600 text-white rounded-tr-none shadow-lg shadow-blue-200' : 'bg-white text-slate-700 border border-white/80 rounded-tl-none shadow-sm'}">
                                ${m.text}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const shouldScroll = container.scrollTop + container.clientHeight >= container.scrollHeight - 100;
            container.innerHTML = html;
            if (shouldScroll || container.innerHTML.length < 1000) {
                container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            }
        }

        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                sendMessage(text);
                input.value = '';
            }
        });

        async function fetchAssignedStaff() {
            try {
                const sRes = await fetch(`/api/clients/${state.user.id}/services`);
                if (sRes.ok) {
                    const sData = await sRes.json();
                    const activeService = sData.services?.[0];
                    const rawStaff = activeService ? (activeService.staff || 'Unassigned') : 'Unassigned';
                    const staffName = (!rawStaff || rawStaff.toLowerCase() === 'sarah lim' || rawStaff.toLowerCase() === 'unassigned') ? 'Unassigned' : rawStaff;
                    const staffInitial = staffName.charAt(0).toUpperCase();
                    
                    const nameEl = document.getElementById('staff-name');
                    const avatarEl = document.getElementById('staff-avatar');
                    if (nameEl) nameEl.innerText = staffName;
                    if (avatarEl) avatarEl.innerText = staffInitial;
                }
            } catch (e) {
                console.error('Failed to fetch assigned staff:', e);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-name').innerText = state.user.name;
            fetchMessages();
            fetchAssignedStaff();
            setInterval(fetchMessages, 3000);
            lucide.createIcons();
        });
    </script>
</body>
</html>
