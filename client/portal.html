<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Portal | Globalisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/tailwind.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="portal-style.css">
    <script type="module" src="client-sidebar.js"></script>
</head>
<body>

    <nav class="top-nav">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('home')">
            <div class="flex flex-col leading-none">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Client</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Portal</span>
            </div>
        </div>

        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="switchTab('home')" class="module-nav-btn active" id="nav-home"><i data-lucide="layout-grid" class="w-4 h-4"></i> <span>Dashboard</span></button>
            <button onclick="switchTab('services')" class="module-nav-btn" id="nav-services"><i data-lucide="activity" class="w-4 h-4"></i> <span>Workflows</span></button>
            <button onclick="switchTab('documents')" class="module-nav-btn" id="nav-documents"><i data-lucide="shield-check" class="w-4 h-4"></i> <span>Vault</span></button>
            <button onclick="switchTab('billing')" class="module-nav-btn" id="nav-billing"><i data-lucide="credit-card" class="w-4 h-4"></i> <span>Billing</span></button>
            <button onclick="switchTab('guidance')" class="module-nav-btn" id="nav-guidance"><i data-lucide="book-open" class="w-4 h-4"></i> <span>Guidance</span></button>
            <button onclick="switchTab('updates')" class="module-nav-btn" id="nav-updates"><i data-lucide="zap" class="w-4 h-4"></i> <span>Blogs</span></button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="nav-messages"><i data-lucide="message-square" class="w-4 h-4"></i> <span>Messages</span></button>
        </div>

        <div class="flex items-center justify-end gap-3 relative">
            <button id="bell-btn" class="p-2 text-slate-600 hover:bg-white/60 rounded-full transition-colors relative" onclick="toggleNotifs(event)" title="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <span id="notif-badge" class="absolute top-1 right-1 min-w-[16px] h-4 px-1 bg-red-500 rounded-full border-2 border-white text-[9px] font-bold text-white flex items-center justify-center hidden" style="line-height:12px;"></span>
            </button>

            <!-- Notification Dropdown -->
            <div id="notif-dropdown" class="absolute top-14 right-24 w-80 bg-white rounded-2xl border border-slate-100 shadow-2xl overflow-hidden hidden z-50 transition-all duration-200 transform origin-top-right scale-95 opacity-0">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <span class="text-xs font-bold text-slate-900 font-outfit">Notifications Center</span>
                    <button onclick="markAllNotificationsAsRead(event)" class="text-[10px] text-blue-600 font-bold hover:underline">Mark all read</button>
                </div>
                <div id="notif-list" class="max-h-[300px] overflow-y-auto divide-y divide-slate-50 font-outfit">
                    <div class="p-6 text-center text-slate-400 text-xs">No notifications yet</div>
                </div>
            </div>
            
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white font-bold text-xs shadow-lg shadow-slate-200">MA</div>
                <div class="hidden sm:flex flex-col">
                    <span id="user-name" class="text-xs font-bold text-slate-900 leading-none mb-1">Mohammad Asif</span>
                    <button onclick="logout()" class="text-[10px] text-red-500 font-bold hover:underline text-left">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="main-container">
        <header id="global-header" class="mb-10 flex justify-between items-center">
            <h1 id="page-title" class="text-3xl font-extrabold text-slate-900 tracking-tight">Executive Hub</h1>
        </header>

        <div id="main-view" class="view-fade-in">
            <!-- Content will be injected by portal-main.js -->
        </div>
    </main>

    <!-- Globalisor AI Assistant Window (Floating) -->
    <div id="ai-assistant-window" class="fixed bottom-10 right-10 w-[400px] bg-white/95 backdrop-blur-2xl border border-white/60 rounded-[32px] overflow-hidden hidden translate-y-10 opacity-0 transition-all duration-500 flex flex-col h-[600px] z-[2000]">
        <div class="p-6 bg-slate-900 text-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white"><i data-lucide="sparkles"></i></div>
                <div>
                    <h3 class="font-bold text-sm">Globalisor AI</h3>
                    <p class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Operational AI</p>
                </div>
            </div>
            <button onclick="toggleAIAssistant()" class="p-2 hover:bg-white/10 rounded-xl transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div id="ai-chat-body" class="flex-1 p-6 overflow-y-auto space-y-6 bg-slate-50/50 flex flex-col">
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center shrink-0"><i data-lucide="sparkles" class="w-4 h-4"></i></div>
                <div class="bg-white/60 p-4 rounded-2xl rounded-tl-none text-sm text-slate-700 border border-white/60 shadow-sm">
                    Hello Mohammad. I'm your Globalisor Operational Assistant. How can I assist with your Singapore entity today?
                </div>
            </div>
        </div>
        <div class="p-6 bg-white border-t border-slate-100 flex gap-3">
            <input type="text" id="ai-input" placeholder="Ask about compliance..." class="flex-1 bg-slate-50 border-none rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/10 transition-all">
            <button onclick="handleAISend()" class="w-12 h-12 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20"><i data-lucide="send" class="w-5 h-5"></i></button>
        </div>
    </div>

    <!-- AI Trigger -->
    <button onclick="toggleAIAssistant()" class="fixed bottom-10 right-10 w-16 h-16 bg-slate-900 text-white rounded-[24px] flex items-center justify-center shadow-2xl hover:scale-110 transition-all group z-[1001]">
        <i data-lucide="message-square" class="w-6 h-6 group-hover:hidden"></i>
        <i data-lucide="sparkles" class="w-6 h-6 hidden group-hover:block animate-pulse"></i>
    </button>

    <!-- Global Modal Overlay -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/10 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 z-[2000]">
        <div id="modal-content" class="bg-white/95 backdrop-blur-2xl rounded-[32px] p-10 w-full max-w-4xl shadow-2xl border border-white/60 scale-95 transition-all duration-300">
            <!-- Modal content injected by JS -->
        </div>
    </div>

    <script type="module" src="portal-main.js"></script>
</body>
</html>
