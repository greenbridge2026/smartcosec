<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Portal | Globalisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/src/tailwind.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="portal-style.css">
    <script type="module" src="client-sidebar.js"></script>
</head>
<body>

    <nav class="top-nav">
        <!-- Logo & Client Company Context Header -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('home')" title="Go to Dashboard">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white font-extrabold text-base shadow-lg shadow-blue-500/20">
                G
            </div>
            <div class="flex flex-col leading-tight">
                <span id="header-company-name" class="font-outfit font-extrabold text-slate-900 text-sm tracking-tight truncate max-w-[180px] sm:max-w-[260px] lg:max-w-[320px]">Globalisor Entity</span>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <span id="header-client-id" class="font-mono text-[10px] font-bold text-blue-600 bg-blue-50 border border-blue-100 px-1.5 py-0.5 rounded">C-CLIENT</span>
                    <span id="header-status-badge" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-100">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        Active
                    </span>
                </div>
            </div>
        </div>

        <!-- Module Navigation Tabs -->
        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80 shadow-sm overflow-x-auto">
            <button onclick="switchTab('home')" class="module-nav-btn active" id="nav-home"><i data-lucide="home" class="w-4 h-4"></i> <span>Dashboard</span></button>
            <button onclick="switchTab('profile')" class="module-nav-btn" id="nav-profile"><i data-lucide="building" class="w-4 h-4"></i> <span>Company Profile</span></button>
            <button onclick="switchTab('compliance')" class="module-nav-btn" id="nav-compliance"><i data-lucide="shield-check" class="w-4 h-4"></i> <span>Compliance</span></button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="nav-messages"><i data-lucide="message-square" class="w-4 h-4"></i> <span>Messages & Chat</span></button>
            <button onclick="switchTab('onboarding')" class="module-nav-btn" id="nav-onboarding"><i data-lucide="clipboard-list" class="w-4 h-4"></i> <span>Onboarding</span></button>
            <button onclick="switchTab('documents')" class="module-nav-btn" id="nav-documents"><i data-lucide="file-text" class="w-4 h-4"></i> <span>Documents</span></button>
            <button onclick="switchTab('directors')" class="module-nav-btn" id="nav-directors"><i data-lucide="users" class="w-4 h-4"></i> <span>Directors & Shareholders</span></button>
            <button onclick="switchTab('tasks')" class="module-nav-btn" id="nav-tasks"><i data-lucide="check-square" class="w-4 h-4"></i> <span>Tasks</span></button>
            <button onclick="switchTab('billing')" class="module-nav-btn" id="nav-billing"><i data-lucide="credit-card" class="w-4 h-4"></i> <span>Billing & Invoices</span></button>
            <button onclick="switchTab('blogs')" class="module-nav-btn" id="nav-blogs"><i data-lucide="rss" class="w-4 h-4"></i> <span>Blogs</span></button>
            <button onclick="switchTab('settings')" class="module-nav-btn" id="nav-settings"><i data-lucide="settings" class="w-4 h-4"></i> <span>Settings</span></button>
        </div>

        <!-- Right Utilities & User Profile -->
        <div class="flex items-center justify-end gap-3 relative">

            <button id="bell-btn" class="p-2 text-slate-600 hover:bg-white/60 rounded-full transition-colors relative" onclick="toggleNotifs(event)" title="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <span id="notif-badge" class="absolute top-1 right-1 min-w-[16px] h-4 px-1 bg-red-500 rounded-full border-2 border-white text-[9px] font-bold text-white flex items-center justify-center hidden" style="line-height:12px;"></span>
            </button>

            <!-- Notification Dropdown -->
            <div id="notif-dropdown" class="absolute top-14 right-24 w-80 bg-white rounded-2xl border border-slate-100 shadow-2xl overflow-hidden hidden z-50 transition-all duration-200 transform origin-top-right scale-95 opacity-0">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <span class="text-xs font-bold text-slate-900 font-outfit">Notifications Center</span>
                    <button onclick="markAllNotificationsAsRead(event)" class="text-[10px] text-blue-600 font-bold hover:underline">Mark all read</button>
                </div>
                <div id="notif-list" class="max-h-[300px] overflow-y-auto divide-y divide-slate-50 font-outfit">
                    <div class="p-6 text-center text-slate-400 text-xs">No notifications yet</div>
                </div>
            </div>
            
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div id="user-avatar" class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white font-bold text-xs shadow-lg shadow-slate-200 uppercase">CL</div>
                <div class="hidden sm:flex flex-col">
                    <span id="user-name" class="text-xs font-extrabold text-slate-900 leading-none mb-1">Client User</span>
                    <span id="user-email" class="text-[10px] text-slate-400 font-semibold leading-none mb-1 truncate max-w-[150px]">client@globalisor.com</span>
                    <button onclick="logout()" class="text-[10px] text-red-500 font-bold hover:underline text-left">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="main-container">
        <header id="global-header" class="mb-5 flex justify-between items-center">
            <h1 id="page-title" class="text-2xl font-extrabold text-slate-900 tracking-tight">Executive Hub</h1>
        </header>

        <div id="main-view" class="view-fade-in">
            <!-- Content will be injected by portal-main.js -->
        </div>
    </main>

    <!-- Globalisor AI Assistant Window (Floating) -->
    <div id="ai-assistant-window" class="fixed bottom-10 right-10 w-[400px] bg-white/95 backdrop-blur-2xl border border-white/60 rounded-[32px] overflow-hidden hidden translate-y-10 opacity-0 transition-all duration-500 flex flex-col h-[600px] z-[2000]">
        <div class="p-6 bg-slate-900 text-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div>
                    <h3 class="font-bold text-sm">Globalisor AI</h3>
                    <p class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Operational AI</p>
                </div>
            </div>
            <button onclick="toggleAIAssistant()" class="p-2 hover:bg-white/10 rounded-xl transition-all" title="Close AI Assistant">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div id="ai-chat-body" class="flex-1 p-6 overflow-y-auto space-y-6 bg-slate-50/50 flex flex-col">
            <div class="flex gap-3">
                <div class="bg-white/60 p-4 rounded-2xl rounded-tl-none text-sm text-slate-700 border border-white/60 shadow-sm">
                    Hello Mohammad. I'm your Globalisor Operational Assistant. How can I assist with your Singapore entity today?
                </div>
            </div>
        </div>
        <div class="p-6 bg-white border-t border-slate-100 flex gap-3">
            <input type="text" id="ai-input" placeholder="Ask about compliance..." onkeydown="if(event.key === 'Enter') handleAISend()" class="flex-1 bg-slate-50 border-none rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/10 transition-all">
            <button onclick="handleAISend()" class="w-12 h-12 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20" title="Send Message">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>

    <!-- Floating AI Assistant Trigger Button (Bottom Right) -->
    <button onclick="toggleAIAssistant()" class="fixed bottom-8 right-8 w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center shadow-2xl hover:scale-105 hover:bg-blue-600 transition-all z-[1900] group" title="Globalisor Operational AI Assistant">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400 group-hover:text-white transition-colors animate-pulse"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    </button>

    <!-- Global Modal Overlay -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/10 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 z-[2000]">
        <div id="modal-content" class="bg-white/95 backdrop-blur-2xl rounded-[32px] p-10 w-full max-w-4xl shadow-2xl border border-white/60 scale-95 transition-all duration-300">
            <!-- Modal content injected by JS -->
        </div>
    </div>

    <script type="module" src="portal-main.js"></script>
</body>
</html>
