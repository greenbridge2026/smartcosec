<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incorporate your company | SmartCosec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Color+Emoji&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root {
  --navy: #060E1A;
  --navy-card: #0B192C;
  --navy-border: rgba(255, 255, 255, 0.1);
  --navy-line: rgba(255, 255, 255, 0.12);
  --em: #10B981;
  --em-deep: #059669;
  --em-soft: #D1FAE5;
  --em-glow: rgba(16, 185, 129, 0.25);
  --amber: #F59E0B;
  --amber-soft: #FEF3C7;
  --amber-f: #92400E;
  --red: #EF4444;
  --red-soft: #FEE2E2;
  --paper: #F8FAFC;
  --card: #FFFFFF;
  --ink: #0F172A;
  --slate: #475569;
  --muted: #64748B;
  --line: #E2E8F0;
  --line-2: #F1F5F9;
  --on-navy: #F8FAFC;
  --on-navy-muted: #94A3B8;
  --display: "Bricolage Grotesque", Georgia, sans-serif;
  --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "IBM Plex Mono", monospace;
  --r: 10px;
  --r-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 20px 25px -5px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #060E1A;
    --card: #0B192C;
    --ink: #F8FAFC;
    --slate: #94A3B8;
    --muted: #64748B;
    --line: #1E293B;
    --line-2: #0F172A;
    --em-soft: rgba(16, 185, 129, 0.18);
    --amber-soft: #451A03;
    --amber-f: #FCD34D;
    --red-soft: #450A0A;
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* SMARTCOSEC HEADER */
.nav-header {
  background: var(--navy);
  border-bottom: 1px solid var(--navy-line);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.nav-inner {
  max-width: 1140px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.25rem;
  color: #fff;
  text-decoration: none;
  letter-spacing: -.02em;
}
.logo-mark {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--em) 0%, var(--em-deep) 100%);
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px var(--em-glow);
}
.logo-mark svg { width: 18px; height: 18px; }
.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn-back-home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--r);
  color: #94A3B8;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--navy-line);
  transition: all 0.2s ease;
}
.btn-back-home:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-1px);
}

/* MAIN LAYOUT */
.wrap {
  max-width: 1140px;
  margin: 0 auto;
  padding: clamp(24px, 4vw, 44px) 20px 64px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
}
h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(28px, 3.4vw, 38px);
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin-bottom: 6px;
}
.lead {
  color: var(--slate);
  font-size: 15px;
  max-width: 640px;
}
.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 350px;
  gap: 24px;
  align-items: start;
}
@media (max-width: 880px) {
  .grid { grid-template-columns: 1fr; }
  .est { position: static; }
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: clamp(20px, 3.2vw, 34px);
  box-shadow: var(--shadow);
}
.steps {
  display: flex;
  gap: 7px;
  margin-bottom: 26px;
}
.steps i {
  flex: 1;
  height: 5px;
  border-radius: 8px;
  background: var(--line);
  transition: background 0.25s ease;
}
.steps i.on {
  background: var(--em);
  box-shadow: 0 0 10px var(--em-glow);
}
h2 {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 4px;
}
.sub {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.55;
  margin-bottom: 20px;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin: 18px 0 7px;
}
.opts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.opt {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  padding: 10px 15px;
  border-radius: var(--r);
  font: 500 13px/1.3 var(--body);
  cursor: pointer;
  transition: all 0.18s ease;
  min-height: 42px;
}
.opt:hover {
  border-color: var(--em);
  transform: translateY(-1px);
}
.opt.on {
  border-color: var(--em);
  background: var(--em-soft);
  color: #065F46;
  font-weight: 600;
  box-shadow: 0 0 0 1px var(--em);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .opt.on {
    color: #34D399;
  }
}
input, select, textarea {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--card);
  color: var(--ink);
  font: 14px var(--body);
  min-height: 44px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--em);
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}
textarea { resize: vertical; }

.note {
  background: var(--amber-soft);
  color: var(--amber-f);
  border-radius: var(--r);
  padding: 12px 14px;
  font-size: 12.5px;
  line-height: 1.5;
  margin-top: 12px;
  border: 1px solid rgba(245, 158, 11, 0.2);
}
.hint {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 8px;
}
.why {
  font-size: 12px;
  color: var(--muted);
  margin: -3px 0 8px;
}
.optl {
  font-weight: 400;
  color: var(--muted);
  font-size: 12px;
  margin-left: 6px;
}

/* NAVIGATION BUTTONS */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  gap: 12px;
}
.btn {
  padding: 11px 22px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: 600 13.5px var(--body);
  cursor: pointer;
  transition: all 0.18s ease;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn:hover:not(:disabled) {
  border-color: #CBD5E1;
  background: var(--line-2);
  transform: translateY(-1px);
}
.btn.p {
  background: var(--em);
  border-color: var(--em);
  color: #042F2E;
  font-weight: 700;
  box-shadow: 0 4px 14px var(--em-glow);
}
.btn.p:hover:not(:disabled) {
  background: #34D399;
  border-color: #34D399;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
  transform: translateY(-1px);
}
.btn.s {
  padding: 9px 16px;
  font-size: 13px;
  border-color: var(--em);
  color: var(--em);
  background: transparent;
}
.btn.s:hover {
  background: var(--em-soft);
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* ESTIMATE SECTION (ON RIGHT SIDE) */
.est {
  position: sticky;
  top: 90px;
  background: var(--navy-card);
  color: #F8FAFC;
  border: 1px solid var(--navy-border);
  border-radius: var(--r-lg);
  padding: 24px;
  box-shadow: 0 16px 36px rgba(6, 14, 26, 0.2);
}
.est small {
  display: inline-block;
  color: #34D399;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.big {
  font-family: var(--display);
  font-weight: 800;
  font-size: 34px;
  line-height: 1.1;
  letter-spacing: -0.03em;
  color: #FFFFFF;
  margin: 6px 0 14px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  font-size: 12.5px;
  padding: 8px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  line-height: 1.45;
}
.row span:first-child { max-width: 68%; color: #E2E8F0; }
.row span:last-child { text-align: right; white-space: nowrap; font-weight: 600; color: #FFFFFF; }
.row .u { font-size: 11px; color: #94A3B8; margin-left: 3px; font-weight: 400; }
.fine {
  font-size: 11.5px;
  color: #94A3B8;
  margin-top: 12px;
  line-height: 1.55;
}

.annual-summary {
  margin-top: 20px;
  margin-bottom: 6px;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
}
.annual-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #94A3B8;
}
.annual-total {
  font-family: var(--display);
  font-weight: 800;
  font-size: 28px;
  line-height: 1.2;
  margin-top: 6px;
  color: #FFFFFF;
  letter-spacing: -0.025em;
}
.annual-total span {
  font-family: var(--body);
  font-weight: 500;
  font-size: 12px;
  color: #94A3B8;
  letter-spacing: 0;
}
.annual-caption {
  font-size: 11px;
  color: #94A3B8;
  margin-top: 4px;
}

.human {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 12.5px;
  color: #CBD5E1;
  line-height: 1.55;
}
.human button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border-radius: var(--r);
  border: 1px solid rgba(16, 185, 129, 0.35);
  background: rgba(16, 185, 129, 0.12);
  color: #34D399;
  font: 600 13px var(--body);
  cursor: pointer;
  transition: all 0.2s ease;
}
.human button:hover {
  background: var(--em);
  color: #042F2E;
  box-shadow: 0 4px 14px var(--em-glow);
}

/* PATHS & INTERNAL VIEW */
.paths {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}
.paths.one { grid-template-columns: 1fr; }
.path {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 12px;
  padding: 18px;
}
.path b { display: block; margin-bottom: 4px; font-size: 14px; color: var(--ink); }
.path span { font-size: 12.5px; color: var(--slate); display: block; margin-bottom: 14px; line-height: 1.5; }
.path button { width: 100%; }

.int {
  margin-top: 22px;
  border: 1px dashed var(--line);
  background: var(--line-2);
  border-radius: 12px;
  padding: 16px;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.int li { margin: 8px 0 0 18px; }
.int li span { color: var(--slate); font-size: 12.5px; }
.tag {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
}
.tag.g { background: var(--em-soft); color: #065F46; }
.tag.a { background: var(--amber-soft); color: var(--amber-f); }
.tag.r { background: var(--red-soft); color: var(--red); }

.link {
  background: none;
  border: 0;
  color: var(--em-deep);
  font: 600 12.5px var(--body);
  cursor: pointer;
  margin-top: 18px;
  display: inline-block;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.link:hover { color: var(--em); }

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(6, 14, 26, 0.7);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}
.modal[hidden] { display: none; }
.mbox {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px;
  max-width: 440px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 60px rgba(6, 14, 26, 0.35);
}
.mbox input[type=date] { display: block; min-height: 44px; }
.err {
  color: var(--red);
  background: var(--red-soft);
  border: 1px solid rgba(239, 68, 68, 0.2);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  margin-top: 10px;
}

/* Stepper styles for directors and shareholders */
.stepper-wrap {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 4px 8px;
  margin-top: 6px;
}
.stepper-btn {
  width: 34px;
  height: 34px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--line-2);
  color: var(--ink);
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.18s ease;
}
.stepper-btn:hover:not(:disabled) {
  border-color: var(--em);
  background: var(--em-soft);
  color: var(--em-deep);
}
.stepper-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.stepper-val {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 800;
  min-width: 28px;
  text-align: center;
}
.stepper-hint {
  font-size: 12.5px;
  color: var(--muted);
  margin-left: 6px;
}
.stepper-hint.has-fee {
  color: var(--em-deep);
  font-weight: 600;
}

/* Welcome screen grid (Step 0) */
.grid.welcome {
  grid-template-columns: 1fr;
}
.grid.welcome > .card {
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 0;
}
.grid.welcome .est,
.grid.welcome .steps {
  display: none !important;
}
.start {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 32px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
}
.box h2 {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--ink);
}
.box .sub {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 20px;
}
.box ul {
  margin: 0 0 24px 20px;
  color: var(--slate);
  font-size: 13.5px;
  line-height: 1.8;
}
.box li { margin: 6px 0; }
.box .btn {
  margin-top: auto;
  text-align: center;
  text-decoration: none;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn.wa {
  background: #25D366;
  border-color: #25D366;
  color: #064E26;
  font-weight: 700;
}
.btn.wa:hover {
  background: #20BA5A;
  border-color: #20BA5A;
}

@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .est { position: static; margin-top: 10px; }
  .paths { grid-template-columns: 1fr; }
  .top { flex-direction: column; align-items: flex-start; }
  .start { grid-template-columns: 1fr; }
  .card { padding: 22px; }
}
@media (max-width: 480px) {
  .wrap { padding: 20px 14px 44px; }
  .card { padding: 18px; border-radius: 12px; }
  .opts { display: grid; grid-template-columns: 1fr; }
  .opt { text-align: left; }
  .nav .btn { padding: 10px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

<!-- SMARTCOSEC BRAND NAVIGATION -->
<header class="nav-header">

      </span>

    </a>
    <div class="nav-actions">

        Back to Home
      </a>
    </div>

</header>

<div class="wrap">

      <div class="steps" id="steps"></div>
      <div id="form"></div>

    <aside class="est" id="est"></aside>
  </div>
</div>

<div class="modal" id="modal" hidden onclick="if(event.target===this)closeHelp()"><div class="mbox" id="mbox"></div></div>

<script>

  phone:'',
  contact:'',
  time:'09:00–11:00',
  err:false,
  internal:false,
  lead:null
};

const STORAGE_KEY = 'incorporate_form_state';

function loadPersistedState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return Object.assign({}, S_DEFAULT, parsed);
    }
  } catch(e) {
    console.warn('Could not load saved state:', e);
  }
  return Object.assign({}, S_DEFAULT);
}

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
  } catch(e) {

function canStep1(){
  return !!(S.country && S.cname && S.cname.trim());
}

function canStep2(){
  if(!S.model) return false;
  if(S.model === 'other'){
    return !!((S.otherModel && S.otherModel.trim()) || (S.activity && S.activity.trim()) || S.industry);
  }
  if(S.industry === 'Other (describe below)'){
    return !!((S.otherIndustry && S.otherIndustry.trim()) || (S.activity && S.activity.trim()) || S.industry);
  }
  return !!S.industry;
}

function canStep3(){
  if(!S.markets || !S.markets.length || !S.addr) return false;
  return true;
}

function set(k,v){
  S[k]=v;
  if(k==='model'){
    if(v==='other'){
      S.industry='Other (describe below)';
    } else {
      S.industry='';
      S.otherModel='';
    }
    S.otherIndustry='';
    if(v==='products') S.funds='';
  }
  if(k==='industry'&&v!=='Other (describe below)'){
    S.otherIndustry='';
  }
  if(k==='resident'){
    if(v==='yes') S.nominee=false;
    else if(v==='no') S.nominee=true;
  }
  if(k==='hire'&&v==='no'){
    S.emp='';
    S.passes=[];
  }
  if(k==='country'&&v!=='OT'){
    S.otherCountry='';
  }
  if(k==='market'&&v!=='multiple'){
    S.otherMarket='';
  }
  draw();
}

function changeCount(k, delta, maxVal = 9, minVal = 1){
  let val = parseInt(S[k] !== undefined && S[k] !== '' ? S[k] : minVal, 10) + delta;
  if(val < minVal) val = minVal;
  if(val > maxVal) val = maxVal;
  S[k] = val;
  draw();
}

function tog(v){
  const i=S.passes.indexOf(v);
  if(i>=0){
    S.passes.splice(i,1);
  } else if(v==='unsure'){
    S.passes=[v];
  } else {
    S.passes=S.passes.filter(x=>x!=='unsure').concat(v);
  }
  draw();
}

function togMarket(v){
  const i=S.markets.indexOf(v);
  if(i>=0) S.markets.splice(i,1);
  else S.markets.push(v);
  draw();
}

function calc(){
  const c=C[S.country];
  if(!c||!c[3]||S.type!=='pte') return null;

  const one=[
    ['Government Registration and Name Application fees',315]
  ];

  if(S.resident==='no'){
    one.push(['Refundable Nominee Director Deposit', 2000]);
  }

  if(S.dirs > 2){
    const extraDirs = S.dirs - 2;
    one.push(['Additional Director Fee (' + extraDirs + ' director' + (extraDirs > 1 ? 's' : '') + ')', extraDirs * 100]);
  }

  if(S.sh > 2){
    const extraSh = S.sh - 2;
    one.push(['Additional Shareholder Fee (' + extraSh + ' shareholder' + (extraSh > 1 ? 's' : '') + ')', extraSh * 100]);
  }

  if(S.bank==='yes') one.push(['Business bank account assistance',500]);
  if(S.passes.some(x=>x!=='loc') || S.epChoice==='yes' || S.epChoice==='unsure') one.push(['Employment Pass (EP) service','Discussed separately']);

  const yr=[
    ['Government Annual Filing Fee',60],
    ['Corporate secretary',440]
  ];
  if(S.corp==='entity') yr.push(['XBRL preparation',1000]);
  if(S.addr==='need') yr.push(['Registered office address',200]);
  if(S.resident==='no' || S.nominee) yr.push(['Nominee director',1500]);
  if(S.plan&&S.plan!=='unsure'&&S.exp!=='mid'&&S.exp!=='large'&&AP[S.plan]) yr.push(['Accounting: '+AP[S.plan][0],AP[S.plan][1]]);

  const cpf=S.passes.includes('loc')||S.passes.includes('unsure');
  if(S.hire==='yes'&&PY[S.emp]&&!cpf){
    yr.push(['Payroll service ('+PY[S.emp]+' employee'+(PY[S.emp]===1?'':'s')+')',PY[S.emp]*50*12]);
  }

  const sum=a=>a.reduce((s,l)=>s+(typeof l[1]==='number'?l[1]:0),0);
  return {
    one,
    yr,
    now:sum(one),
    yearly:sum(yr),
    sym:c[1],
    quote:(!!S.plan&&S.plan!=='unsure'&&(S.exp==='mid'||S.exp==='large'))||(S.hire==='yes'&&S.emp==='11+'),
    cpf:S.hire==='yes'&&cpf,
    pass:S.passes.some(x=>x!=='loc')
  };
}

function risk(){
  const fl=[];
  let p=0;
  const it=(L[S.model]||[]).find(x=>x[0]===S.industry);
  if(it&&it[1]){ p+=it[1]; fl.push([S.otherIndustry?`Other (${S.otherIndustry})`:it[0],it[2]]); }
  if(S.markets&&S.markets.length>1){ fl.push(['Multiple trading countries/regions','Run sanctions & licensing checks']); }
  if(S.funds==='yes'){ p+=2; fl.push(['Holds or moves customer money','Confirm the licence it needs before accepting']); }
  if(S.passes.some(x=>x!=='loc')) fl.push(['Work passes needed (EP or unsure)','Check eligibility and quota; refer to the work pass team']);
  if(S.bank==='yes') fl.push(['Business bank account assistance requested','Check the bank’s appetite for this industry and ownership before introducing']);
  if(S.addr==='own') fl.push(['Client-supplied registered address','Confirm the address can be used as a registered office']);
  if(S.resident==='no'){ p+=1; fl.push(['No locally resident director','Confirm nominee terms and sign a nominee agreement']); }
  if(S.nominee){ p+=1; fl.push(['Nominee director requested','Require an accounting package alongside']); }
  if(S.corp==='entity'){ p+=1; fl.push(['Corporate shareholder','Get the full ownership chain and ultimate owners']); }
  if(S.sh >= 5){ p+=1; fl.push(['Five or more shareholders','Collect ID and percentage held for each']); }
  return p>=3?['r','Senior review before onboarding',fl]:p>=1?['a','Proceed with enhanced checks',fl]:['g','Standard onboarding',fl];
}

function pct(){
  const f=[S.country,S.model,S.industry,S.activity.trim(),(S.markets&&S.markets.length?S.markets[0]:''),S.model==='products'?'n':S.funds,S.addr,S.dirs,S.resident,S.sh,S.corp,S.name.trim(),(S.email||S.phone||S.contact).trim()];
  return Math.round(f.filter(Boolean).length/f.length*100);
}

  } else {
    const allItems = [...e.one.map(l=>[l[0], l[1], 'one time']), ...e.yr.map(l=>[l[0], l[1], '/ year'])];
    if(allItems.length > 0){
      h+='<div style="margin-top:12px;">';
      h+=allItems.map(([item, cost, period])=>'<div class="row"><span>'+item+'</span><span>'+(typeof cost==='number'?money(e.sym,cost)+'<span class="u"> '+period+'</span>':cost)+'</span></div>').join('');

    const total = e.now + e.yearly;
    h+='<div style="margin-top:20px; padding-top:16px; border-top:2px solid rgba(255,255,255,0.12);">';

    h+='</div>';

  h+='<div class="human">Prefer a person? A company secretary can guide you at any step.<button onclick="openHelp()">Talk to an expert</button></div>';
  $('est').innerHTML=h;
  $('steps').innerHTML=[1,2,3,4,5,6,7].map(n=>'<i class="'+(n<=S.step?'on':'')+'"></i>').join('');

function openHelp(){$('modal').hidden=false;drawHelp()}
function closeHelp(){$('modal').hidden=true}
function drawHelp(){
  const today=new Date();
  const minDate=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  $('mbox').innerHTML=S.lead&&S.lead.sent?`<h2>Thank you</h2><p class="sub">Your enquiry has been prepared in this preview. Once the website is connected to your CRM or email service, your team can receive and manage the request.</p><button class="btn p" onclick="closeHelp()">Back to my estimate</button><p class="note" role="status">Preview mode: this request has not been sent.</p>`
  :`<h2>Talk to an expert</h2><p class="sub">Tell us what you need and choose a preferred call date and time.</p>
    <label>How can we help?</label><select onchange="S.enquiry=this.value"><option ${S.enquiry==='General enquiry'?'selected':''}>General enquiry</option><option ${S.enquiry==='Incorporation'?'selected':''}>Incorporation</option><option ${S.enquiry==='Transfer'?'selected':''}>Transfer</option><option ${S.enquiry==='Company secretary'?'selected':''}>Company secretary</option><option ${S.enquiry==='Accounting and Tax'?'selected':''}>Accounting and Tax</option><option ${S.enquiry==='GST'?'selected':''}>GST</option><option ${S.enquiry==='Employment Pass / Work Pass'?'selected':''}>Employment Pass / Work Pass</option></select>
    <label>Full name</label><input value="${esc(S.name)}" oninput="S.name=this.value">
    <label>Phone or email</label><input value="${esc(S.phone ? (S.dialCode + ' ' + S.phone) : (S.contact||S.email))}" oninput="S.contact=this.value" placeholder="Your phone number or email">
    <label>Preferred call date</label><input type="date" min="${minDate}" value="${esc(S.callDate)}" onchange="S.callDate=this.value">
    <label>Preferred time slot (Singapore time)</label><select onchange="S.time=this.value"><option ${S.time==='09:00–11:00'?'selected':''}>09:00–11:00</option><option ${S.time==='11:00–13:00'?'selected':''}>11:00–13:00</option><option ${S.time==='14:00–16:00'?'selected':''}>14:00–16:00</option><option ${S.time==='16:00–18:00'?'selected':''}>16:00–18:00</option></select>
    ${S.err?'<p class="err">Please enter your name, phone or email, preferred date and time slot.</p>':''}
    <div class="nav"><button class="btn" onclick="closeHelp()">Cancel</button><button class="btn p" onclick="sendLead()">Request a call</button></div>`;
}

function sendLead(){
  const contactVal = (S.contact || (S.phone ? (S.dialCode + ' ' + S.phone) : S.email) || '').trim();
  if(!S.name.trim()||!contactVal||!S.callDate||!S.time){S.err=true;drawHelp();return}
  S.err=false;S.lead={sent:true,step:S.step,enquiry:S.enquiry,date:S.callDate,time:S.time};drawHelp();draw();
  $('mbox').insertAdjacentHTML('beforeend','<p class="note" role="status">Preview mode: this request has not been sent. Connect your website form to your CRM or email service before publishing.</p>');
}

function submitFinalEstimate(){
  const errDiv = $('step6-error') || $('step7-error');
  const country = getSelectedCountry();
  const digitsOnly = (S.phone || '').replace(/\D/g, '');
  if(!S.name || !S.name.trim() || !S.email || !S.email.trim() || !digitsOnly){
    if(errDiv){
      errDiv.textContent = 'Please enter your full name, email, and contact number to proceed.';
      errDiv.style.display = 'block';
    }
    if(!S.name || !S.name.trim()){ const el=$('ep-fullname-input'); if(el) el.focus(); }
    else if(!S.email || !S.email.trim()){ const el=$('ep-email-input'); if(el) el.focus(); }
    else if(!digitsOnly){ const el=$('client-phone-input'); if(el) el.focus(); }
    return;
  }
  if(digitsOnly.length < country.digits){
    if(errDiv){
      errDiv.textContent = `Please enter a valid ${country.digits}-digit phone number for ${country.name}.`;
      errDiv.style.display = 'block';
    }
    const el=$('client-phone-input'); if(el) el.focus();
    return;
  }
  if(errDiv) errDiv.style.display = 'none';
  drawConfirmationModal();
  $('modal').hidden = false;
}

function openConfirmationModal(){
  submitFinalEstimate();
}

      📄 <strong>Full Summary PDF (Payment & Services)</strong> will be generated and sent to:
      <ul style="margin:6px 0 0 16px;font-weight:600;">
        <li>Client Email: ${esc(S.email)}</li>
        <li>SmartCosec Team: team@smartcosec.com</li>
      </ul>
    </div>
    <div id="confirm-modal-error" class="err" style="display:none;margin-bottom:12px;"></div>
    <div class="nav">
      <button class="btn" onclick="closeHelp()">Cancel</button>
      <button class="btn p" id="btn-confirm-send" onclick="confirmAndSendPDF()">Confirm & Send Summary PDF</button>
    </div>
  `;
}

let lastGeneratedDoc = null;
function generateSummaryPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const e = calc();
  const total = e ? (e.now + e.yearly) : 0;
  const sym = e ? e.sym : 'S$';

  const primaryColor = [6, 14, 26];
  const emeraldColor = [16, 185, 129];
  const slateColor = [71, 85, 105];

  // 1. Header Banner
  doc.setFillColor(...primaryColor);
  doc.rect(0, 0, 595, 75, 'F');

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.setTextColor(255, 255, 255);
  doc.text('SmartCosec', 40, 42);

  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...emeraldColor);
  doc.text('CORPORATE SECRETARIAL & INCORPORATION PLATFORM', 40, 58);

  const refNum = 'SC-' + Math.floor(100000 + Math.random() * 900000);
  doc.setTextColor(203, 213, 225);
  doc.setFontSize(9);
  doc.text('REF: ' + refNum, 555, 42, { align: 'right' });
  doc.text('Date: ' + new Date().toLocaleDateString('en-SG', { day: '2-digit', month: 'short', year: 'numeric' }), 555, 58, { align: 'right' });

  // 2. Title
  doc.setFontSize(15);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(...primaryColor);
  doc.text('Summary of Payment & Services', 40, 104);

  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...slateColor);
  doc.text('Official client confirmation and complete breakdown of incorporation package, compliance, and recurring services.', 40, 118);

  // 3. Configuration & Specifications
  const dirText = (S.dirs || 1) + ' Director(s) (' + (S.resident === 'yes' ? 'Local Resident' : 'Nominee Director Required') + ')';
  const shText = (S.sh || 1) + ' Shareholder(s) (' + (S.corp === 'entity' ? 'Corporate Shareholder - XBRL Required' : 'All Individuals') + ')';
  const addrText = S.addr === 'need' ? 'SmartCosec Registered Office' : 'Client-Provided Address';
  const acctText = S.plan && AP[S.plan] ? AP[S.plan][0] : (S.plan === 'unsure' ? 'To be confirmed with expert' : 'No accounting selected');
  const hireText = S.hire === 'yes' ? (S.emp || '1') + ' Employee(s)' + (S.passes && S.passes.length ? ' (' + S.passes.map(p => p === 'ep' ? 'EP' : 'Unsure').join(', ') + ')' : '') : 'No initial hires';
  const bankText = S.bank === 'yes' ? 'Requested (S$500)' : 'None';
  const fullPhone = (S.dialCode || '+65') + ' ' + (S.phone || '—');
  const mktText = S.markets && S.markets.length ? S.markets.map(k=>MKT[k]||k).join(', ') : '—';

  doc.autoTable({
    startY: 132,
    margin: { left: 40, right: 40 },
    head: [['Client & Entity Profile', 'Structure & Operational Setup']],
    body: [
      ['Client Name: ' + (S.name || 'Valued Client'), 'Preferred Name: ' + (S.cname || 'Pending Review')],
      ['Client Email: ' + (S.email || '—'), 'Entity Type: Private Limited (Pte Ltd)'],
      ['Contact Number: ' + fullPhone, 'Main Activity: ' + (MODEL[S.model] || '—') + (S.industry ? ' (' + S.industry + ')' : '')],
      ['Jurisdiction: ' + (C[S.country] ? C[S.country][0] : 'Singapore'), 'Operating Markets: ' + mktText],
      ['Directors: ' + dirText, 'Accounting: ' + acctText],
      ['Shareholders: ' + shText, 'Hiring & Passes: ' + hireText],
      ['Registered Address: ' + addrText, 'Banking: ' + bankText]
    ],
    theme: 'grid',
    headStyles: {
      fillColor: [241, 245, 249],
      textColor: primaryColor,
      fontSize: 8.5,
      fontStyle: 'bold',
      cellPadding: { top: 4, bottom: 4, left: 6, right: 6 }
    },
    bodyStyles: {
      fontSize: 7.5,
      textColor: slateColor,
      cellPadding: { top: 3.5, bottom: 3.5, left: 6, right: 6 },
      overflow: 'linebreak',
      lineColor: [226, 232, 240],
      lineWidth: 0.5
    },
    columnStyles: {
      0: { cellWidth: 257 },
      1: { cellWidth: 258 }
    }
  });

  function getServiceScope(name){
    if(name.includes('Government Registration')) return 'Official ACRA name application & company incorporation statutory fee';
    if(name.includes('Refundable Nominee Director Deposit')) return 'Security deposit for local nominee director, fully refundable upon transfer or liquidation';
    if(name.includes('Additional Director Fee')) return 'Statutory KYC verification and compliance review for additional directors';
    if(name.includes('Additional Shareholder Fee')) return 'Statutory KYC verification and allotment processing for additional shareholders';
    if(name.includes('bank account')) return 'Corporate multi-currency bank account application & banker introduction';
    if(name.includes('Work pass') || name.includes('EP')) return 'Employment Pass eligibility review, dossier preparation & MOM submission';
    if(name.includes('Government Annual Filing Fee')) return 'ACRA statutory annual return lodgement fee';
    if(name.includes('Corporate secretary')) return 'Named qualified secretary, AGM preparation & statutory register maintenance';
    if(name.includes('XBRL')) return 'Financial statements conversion & filing in ACRA-compliant XBRL format';
    if(name.includes('Registered office')) return 'Prestigious commercial Singapore registered address & mail notifications';
    if(name.includes('Nominee director')) return 'Singapore resident nominee director fulfilling Companies Act statutory requirement';
    if(name.includes('Accounting:')) {
      if(name.includes('Regular')) return 'Ongoing routine bookkeeping, balance sheet/P&L & annual tax lodgement';
      if(name.includes('Full')) return 'Comprehensive management accounts, financial statements & annual tax filing';
      return 'Annual unaudited financial statement preparation & basic bookkeeping';
    }
    if(name.includes('Payroll service')) return 'Monthly payroll processing, electronic itemized payslips & IR8A filing';
    if(name.includes('SDL')) return 'Mandatory Skills Development Levy contribution remitted to CPF Board';
    return 'Standard statutory compliance and corporate administrative service';
  }

  const tableRows = [];
  if (e) {
    e.one.forEach(item => {
      const scope = getServiceScope(item[0]);
      const fee = typeof item[1] === 'number' ? (money(sym, item[1]) + ' (One-time)') : item[1];
      tableRows.push([item[0], scope, fee]);
    });
    e.yr.forEach(item => {
      const scope = getServiceScope(item[0]);
      const fee = typeof item[1] === 'number' ? (money(sym, item[1]) + ' / yr') : item[1];
      tableRows.push([item[0], scope, fee]);
    });
  }

  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 12,
    margin: { left: 40, right: 40 },
    head: [['Selected Services & Government Fees', 'Service Scope & Description', 'Amount']],
    body: tableRows,
    theme: 'grid',
    headStyles: {
      fillColor: primaryColor,
      textColor: [255, 255, 255],
      fontSize: 8.5,
      fontStyle: 'bold',
      cellPadding: 5
    },
    bodyStyles: {
      fontSize: 7.8,
      textColor: [15, 23, 42],
      cellPadding: 4.5,
      overflow: 'linebreak'
    },
    columnStyles: {
      0: { cellWidth: 175 },
      1: { cellWidth: 240 },
      2: { cellWidth: 100, halign: 'right', fontStyle: 'bold' }
    },
    foot: [[
      { content: 'Total Payment & Service Fee:', colSpan: 2, styles: { halign: 'right', fontStyle: 'bold', fontSize: 9.5, textColor: primaryColor } },
      { content: money(sym, total), styles: { halign: 'right', fontStyle: 'bold', fontSize: 10.5, textColor: emeraldColor } }
    ]],
    footStyles: {
      fillColor: [241, 245, 249]
    }
  });

  let finalY = doc.lastAutoTable.finalY + 12;

  doc.setFontSize(7.5);
  doc.setFont('helvetica', 'italic');
  doc.setTextColor(...slateColor);

  const disclaimers = [
    '* Company name availability subject to final confirmation from regulating authority.',
    '* Automated copy sent to Client (' + (S.email || '—') + ') and SmartCosec Team (team@smartcosec.com).'
  ];

  disclaimers.forEach(line => {
    const wrapped = doc.splitTextToSize(line, 515);
    doc.text(wrapped, 40, finalY);
    finalY += (wrapped.length * 9) + 2;
  });

  doc.setDrawColor(226, 232, 240);
  doc.line(40, 790, 555, 790);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.setTextColor(148, 163, 184);
  doc.text('SmartCosec Pte. Ltd. • 10 Anson Road #16-04 International Plaza Singapore 079903 • team@smartcosec.com • www.smartcosec.com', 40, 802);
  doc.text('Page 1 of 1', 555, 802, { align: 'right' });

  return doc;
}

async function confirmAndSendPDF(){
  const btn = $('btn-confirm-send');
  const errEl = $('confirm-modal-error');
  if(errEl) errEl.style.display = 'none';

  if(btn){
    btn.disabled = true;
    btn.innerHTML = 'Processing & Dispatching...';
  }

  try {
    const doc = generateSummaryPDF();
    lastGeneratedDoc = doc;
    const pdfBase64 = doc.output('datauristring');
    const e = calc();
    const total = e ? (e.now + e.yearly) : 0;
    const sym = e ? e.sym : 'S$';

    const sanitizedName = (S.cname || 'Company').replace(/[^a-zA-Z0-9]/g, '_');
    doc.save('SmartCosec_Summary_' + sanitizedName + '.pdf');

    const payload = {
      clientName: S.name,
      clientEmail: S.email,
      clientPhone: (S.dialCode || '+65') + ' ' + (S.phone || ''),
      companyName: S.cname,
      country: C[S.country] ? C[S.country][0] : 'Singapore',
      totalAmount: total,
      currency: sym,
      items: e ? [
        ...e.one.map(x => ({ name: x[0], cost: x[1], type: 'one-time' })),
        ...e.yr.map(x => ({ name: x[0], cost: x[1], type: 'annual' }))
      ] : [],
      pdfBase64: pdfBase64
    };

    try {
      await fetch('/api/onboarding/confirm-incorporation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch(fetchErr) {
      console.warn('Backend confirmation dispatch notice:', fetchErr);
    }

    clearPersistedState();

    $('mbox').innerHTML = `
      <div style="text-align:center;padding:12px 0;">
        <div style="width:56px;height:56px;background:var(--em-soft);color:var(--em-deep);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 14px var(--em-glow);">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>Confirmation Successful!</h2>
        <p class="sub" style="margin-top:6px;">Your incorporation request and full PDF summary have been confirmed.</p>
        <div style="background:var(--line-2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:18px 0;text-align:left;font-size:13px;line-height:1.65;">
          <div>📬 <strong>Sent to Client:</strong> ${esc(S.email)}</div>
          <div style="margin-top:6px;">📞 <strong>Contact Phone:</strong> ${esc(payload.clientPhone)}</div>
          <div style="margin-top:6px;">🏢 <strong>Sent to SmartCosec Team:</strong> team@smartcosec.com</div>
          <div style="margin-top:6px;">📄 <strong>Attachment:</strong> Full Summary of Payment & Services (PDF)</div>
        </div>
        <p style="font-size:12.5px;color:var(--slate);margin-bottom:20px;">The PDF summary has also been saved to your device. Our corporate secretary team will review and contact you shortly.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="btn s" onclick="if(lastGeneratedDoc) lastGeneratedDoc.save('SmartCosec_Summary_${sanitizedName}.pdf');">Download PDF Again</button>
          <button class="btn p" onclick="window.location.href='/'">Go to Home</button>
        </div>
      </div>
    `;
    setTimeout(() => {
      window.location.href = '/';
    }, 4000);
  } catch(err) {
    console.error('Error during confirmation:', err);
    if(errEl) {
      errEl.textContent = 'Error processing confirmation: ' + err.message;
      errEl.style.display = 'block';
    }
    if(btn){
      btn.disabled = false;
      btn.innerHTML = 'Confirm & Send Summary PDF';
    }
  }
}

draw();
</script>
