<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incorporate your company | SmartCosec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --navy: #060E1A;
  --navy-card: #0B192C;
  --navy-border: rgba(255, 255, 255, 0.1);
  --navy-line: rgba(255, 255, 255, 0.12);
  --em: #10B981;
  --em-deep: #059669;
  --em-soft: #D1FAE5;
  --em-glow: rgba(16, 185, 129, 0.25);
  --amber: #F59E0B;
  --amber-soft: #FEF3C7;
  --amber-f: #92400E;
  --red: #EF4444;
  --red-soft: #FEE2E2;
  --paper: #F8FAFC;
  --card: #FFFFFF;
  --ink: #0F172A;
  --slate: #475569;
  --muted: #64748B;
  --line: #E2E8F0;
  --line-2: #F1F5F9;
  --on-navy: #F8FAFC;
  --on-navy-muted: #94A3B8;
  --display: "Bricolage Grotesque", Georgia, sans-serif;
  --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "IBM Plex Mono", monospace;
  --r: 10px;
  --r-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 20px 25px -5px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #060E1A;
    --card: #0B192C;
    --ink: #F8FAFC;
    --slate: #94A3B8;
    --muted: #64748B;
    --line: #1E293B;
    --line-2: #0F172A;
    --em-soft: rgba(16, 185, 129, 0.18);
    --amber-soft: #451A03;
    --amber-f: #FCD34D;
    --red-soft: #450A0A;
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* SMARTCOSEC HEADER */
.nav-header {
  background: var(--navy);
  border-bottom: 1px solid var(--navy-line);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.nav-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.25rem;
  color: #fff;
  text-decoration: none;
  letter-spacing: -.02em;
}
.logo-mark {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--em) 0%, var(--em-deep) 100%);
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px var(--em-glow);
}
.logo-mark svg { width: 18px; height: 18px; }
.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn-back-home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--r);
  color: #94A3B8;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--navy-line);
  transition: all 0.2s ease;
}
.btn-back-home:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-1px);
}
.btn-expert {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--r);
  font-size: 13px;
  font-weight: 600;
  color: var(--em);
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.3);
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-expert:hover {
  background: var(--em);
  color: #042F2E;
  box-shadow: 0 4px 14px var(--em-glow);
  transform: translateY(-1px);
}

/* MAIN LAYOUT */
.wrap {
  max-width: 1140px;
  margin: 0 auto;
  padding: clamp(24px, 4vw, 44px) 20px 64px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
}
h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(28px, 3.4vw, 38px);
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin-bottom: 6px;
}
.lead {
  color: var(--slate);
  font-size: 15px;
  max-width: 640px;
}
.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 350px;
  gap: 24px;
  align-items: start;
}
@media (max-width: 880px) {
  .grid { grid-template-columns: 1fr; }
  .est { position: static; }
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: clamp(20px, 3.2vw, 34px);
  box-shadow: var(--shadow);
}
.steps {
  display: flex;
  gap: 7px;
  margin-bottom: 26px;
}
.steps i {
  flex: 1;
  height: 5px;
  border-radius: 8px;
  background: var(--line);
  transition: background 0.25s ease;
}
.steps i.on {
  background: var(--em);
  box-shadow: 0 0 10px var(--em-glow);
}
h2 {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 4px;
}
.sub {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.55;
  margin-bottom: 20px;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin: 18px 0 7px;
}
.opts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.opt {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  padding: 10px 15px;
  border-radius: var(--r);
  font: 500 13px/1.3 var(--body);
  cursor: pointer;
  transition: all 0.18s ease;
  min-height: 42px;
}
.opt:hover {
  border-color: var(--em);
  transform: translateY(-1px);
}
.opt.on {
  border-color: var(--em);
  background: var(--em-soft);
  color: #065F46;
  font-weight: 600;
  box-shadow: 0 0 0 1px var(--em);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .opt.on {
    color: #34D399;
  }
}
input, select, textarea {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--card);
  color: var(--ink);
  font: 14px var(--body);
  min-height: 44px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--em);
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}
textarea { resize: vertical; }

.note {
  background: var(--amber-soft);
  color: var(--amber-f);
  border-radius: var(--r);
  padding: 12px 14px;
  font-size: 12.5px;
  line-height: 1.5;
  margin-top: 12px;
  border: 1px solid rgba(245, 158, 11, 0.2);
}
.hint {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 8px;
}
.why {
  font-size: 12px;
  color: var(--muted);
  margin: -3px 0 8px;
}
.optl {
  font-weight: 400;
  color: var(--muted);
  font-size: 12px;
  margin-left: 6px;
}

/* NAVIGATION BUTTONS */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  gap: 12px;
}
.btn {
  padding: 11px 22px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: 600 13.5px var(--body);
  cursor: pointer;
  transition: all 0.18s ease;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn:hover:not(:disabled) {
  border-color: #CBD5E1;
  background: var(--line-2);
  transform: translateY(-1px);
}
.btn.p {
  background: var(--em);
  border-color: var(--em);
  color: #042F2E;
  font-weight: 700;
  box-shadow: 0 4px 14px var(--em-glow);
}
.btn.p:hover:not(:disabled) {
  background: #34D399;
  border-color: #34D399;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
  transform: translateY(-1px);
}
.btn.s {
  padding: 9px 16px;
  font-size: 13px;
  border-color: var(--em);
  color: var(--em);
  background: transparent;
}
.btn.s:hover {
  background: var(--em-soft);
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* ESTIMATE SECTION (ON RIGHT SIDE) */
.est {
  position: sticky;
  top: 90px;
  background: var(--navy-card);
  color: #F8FAFC;
  border: 1px solid var(--navy-border);
  border-radius: var(--r-lg);
  padding: 24px;
  box-shadow: 0 16px 36px rgba(6, 14, 26, 0.2);
}
.est small {
  display: inline-block;
  color: #34D399;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.big {
  font-family: var(--display);
  font-weight: 800;
  font-size: 34px;
  line-height: 1.1;
  letter-spacing: -0.03em;
  color: #FFFFFF;
  margin: 6px 0 14px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  font-size: 12.5px;
  padding: 8px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  line-height: 1.45;
}
.row span:first-child { max-width: 68%; color: #E2E8F0; }
.row span:last-child { text-align: right; white-space: nowrap; font-weight: 600; color: #FFFFFF; }
.row .u { font-size: 11px; color: #94A3B8; margin-left: 3px; font-weight: 400; }
.fine {
  font-size: 11.5px;
  color: #94A3B8;
  margin-top: 12px;
  line-height: 1.55;
}

.annual-summary {
  margin-top: 20px;
  margin-bottom: 6px;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
}
.annual-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #94A3B8;
}
.annual-total {
  font-family: var(--display);
  font-weight: 800;
  font-size: 28px;
  line-height: 1.2;
  margin-top: 6px;
  color: #FFFFFF;
  letter-spacing: -0.025em;
}
.annual-total span {
  font-family: var(--body);
  font-weight: 500;
  font-size: 12px;
  color: #94A3B8;
  letter-spacing: 0;
}
.annual-caption {
  font-size: 11px;
  color: #94A3B8;
  margin-top: 4px;
}

.human {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 12.5px;
  color: #CBD5E1;
  line-height: 1.55;
}
.human button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border-radius: var(--r);
  border: 1px solid rgba(16, 185, 129, 0.35);
  background: rgba(16, 185, 129, 0.12);
  color: #34D399;
  font: 600 13px var(--body);
  cursor: pointer;
  transition: all 0.2s ease;
}
.human button:hover {
  background: var(--em);
  color: #042F2E;
  box-shadow: 0 4px 14px var(--em-glow);
}

/* PATHS & INTERNAL VIEW */
.paths {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}
.paths.one { grid-template-columns: 1fr; }
.path {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 12px;
  padding: 18px;
}
.path b { display: block; margin-bottom: 4px; font-size: 14px; color: var(--ink); }
.path span { font-size: 12.5px; color: var(--slate); display: block; margin-bottom: 14px; line-height: 1.5; }
.path button { width: 100%; }

.int {
  margin-top: 22px;
  border: 1px dashed var(--line);
  background: var(--line-2);
  border-radius: 12px;
  padding: 16px;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.int li { margin: 8px 0 0 18px; }
.int li span { color: var(--slate); font-size: 12.5px; }
.tag {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
}
.tag.g { background: var(--em-soft); color: #065F46; }
.tag.a { background: var(--amber-soft); color: var(--amber-f); }
.tag.r { background: var(--red-soft); color: var(--red); }

.link {
  background: none;
  border: 0;
  color: var(--em-deep);
  font: 600 12.5px var(--body);
  cursor: pointer;
  margin-top: 18px;
  display: inline-block;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.link:hover { color: var(--em); }

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(6, 14, 26, 0.7);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}
.modal[hidden] { display: none; }
.mbox {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px;
  max-width: 440px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 60px rgba(6, 14, 26, 0.35);
}
.mbox input[type=date] { display: block; min-height: 44px; }
.err {
  color: var(--red);
  background: var(--red-soft);
  border: 1px solid rgba(239, 68, 68, 0.2);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  margin-top: 10px;
}

@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .est { position: static; margin-top: 10px; }
  .paths { grid-template-columns: 1fr; }
  .top { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 480px) {
  .wrap { padding: 20px 14px 44px; }
  .card { padding: 18px; border-radius: 12px; }
  .opts { display: grid; grid-template-columns: 1fr; }
  .opt { text-align: left; }
  .nav .btn { padding: 10px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

  <div class="nav-inner">

<div class="wrap">

      <h1>Let’s get your company started</h1>
      <p class="lead">Answer a few quick questions for an instant estimate. No documents needed yet.</p>

</div>

<script>
const S={step:1,enquiry:'General enquiry',callDate:'',country:'',otherCountry:'',type:'pte',cname:'',model:'',otherModel:'',industry:'',otherIndustry:'',activity:'',cust:'',market:'',funds:'',addr:'',exp:'',plan:'',hire:'',emp:'',passes:[],bank:'',dirs:'',resident:'',nominee:false,sh:'',corp:'',name:'',email:'',contact:'',time:'09:00–11:00',err:false,internal:false,lead:null};
const C={SG:['Singapore','S$',1,1],US:['United States of America','US$',0.75,0],OT:['Others','',0,0]};
const MODEL={products:'Products',services:'Services',both:'Products and services',holding:'Investment holdings',fund:'Fund management',other:'Others'};
const H={products:'Physical goods you buy, make or sell.',services:'Advice, software, labour or access you provide.',both:'You sell goods and also provide services.',holding:'No trading. The company only owns shares, investments or assets.',fund:'Managing money or investments for other people or funds.',other:'Something else. Tell us about it in one sentence.'};
const CUST={b2b:'Businesses',b2c:'Individuals',both:'Both'};
const MKT={sg:'Singapore',sea:'Southeast Asia',asia:'Wider Asia',west:'Europe, US and others',risk:'Includes high-risk or sanctioned countries'};
const TYPES=[['pte','Private limited company (Pte Ltd)'],['llp','Limited liability partnership (LLP)'],['sole','Sole proprietorship'],['partner','Partnership'],['guar','Company limited by guarantee'],['public','Public company limited by shares'],['branch','Branch of a foreign company']];
const PY={'1':1,'2':2,'3-5':3,'6-10':6};
const AP={basic:['Filing & basic bookkeeping',900],reg:['Regular accounting',1080],full:['Full accounting & reporting',3000]};
const PH={basic:'Annual filing plus simple bookkeeping. For early-stage companies.',reg:'Regular tracking through the year. For growing companies.',full:'Full visibility and reporting. For scaling companies.'};
const X=['Other (describe below)',1,'Read the activity description and confirm any licence needed'];
const P=[['Consumer goods & retail',0,''],['Food & beverage',0,''],['Electronics & hardware',0,''],['Commodities & raw materials',1,'Ask for supplier and buyer names and shipping routes'],['Pharma & medical devices',1,'Check import and health-authority licences'],['Precious metals & stones',3,'Check licensing and source of goods'],['Arms, defence & dual-use items',3,'Senior review before any contact'],X];
const V=[['Consulting & professional services',0,''],['Technology & software',0,''],['Marketing & media',0,''],['Education & training',0,''],['Logistics & shipping',1,'Ask for main routes and cargo types'],['Real estate & property',1,'Ask for source of funds and property location'],['Crypto & digital assets',3,'Confirm licence position with MAS'],['Payments & money transfer',3,'Confirm payment licence before accepting'],['Gambling & gaming',3,'Check legality in target markets'],X];
const L={products:P,services:V,both:[...P.slice(0,-1),...V],holding:[['Investment holdings',1,'Ask for source of funds and the investments held'],['Holding group shares',0,''],['Holding IP or licences',0,''],X],fund:[['Fund management company',3,'Confirm MAS licence or exemption before accepting'],['Family office',1,'Ask for source of wealth and the structure'],['Venture capital or private equity',1,'Ask for source of funds and investors'],X],other:[X]};
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const opts=(k,list)=>'<div class="opts">'+list.map(([v,t])=>`<button class="opt ${S[k]===v?'on':''}" onclick="set('${k}','${v}')">${t}</button>`).join('')+'</div>';
function canStep2(){
  if(!S.model) return false;
  if(S.model === 'other'){
    return !!((S.otherModel && S.otherModel.trim()) || (S.otherIndustry && S.otherIndustry.trim()) || (S.activity && S.activity.trim()) || S.industry);
  }
  if(S.industry === 'Other (describe below)'){
    return !!((S.otherIndustry && S.otherIndustry.trim()) || (S.activity && S.activity.trim()) || S.industry);
  }
  return !!S.industry;
}
function set(k,v){
  S[k]=v;
  if(k==='model'){
    if(v==='other'){
      S.industry='Other (describe below)';
    } else {
      S.industry='';
      S.otherModel='';
    }
    S.otherIndustry='';
    if(v==='products')S.funds='';
  }
  if(k==='industry'&&v!=='Other (describe below)'){
    S.otherIndustry='';
  }
  if(k==='resident'&&v==='yes')S.nominee=false;
  if(k==='hire'&&v==='no'){S.emp='';S.passes=[]}
  if(k==='country'&&v!=='OT'){S.otherCountry=''}
  draw();
}
function tog(v){const i=S.passes.indexOf(v);if(i>=0)S.passes.splice(i,1);else if(v==='loc'||v==='unsure')S.passes=[v];else S.passes=S.passes.filter(x=>x!=='loc'&&x!=='unsure').concat(v);draw()}
function go(n){S.step=n;if(n===5&&S.nominee&&!S.plan)S.plan='basic';draw()}
function calc(){
  const c=C[S.country];if(!c||!c[3]||S.type!=='pte')return null;
  const one=[['Government Registration and Name Application fees',315]];
  if(S.bank==='yes')one.push(['Business bank account assistance',500]);
  if(S.passes.some(x=>x!=='loc'))one.push(['Work pass (EP/WP) service','Discussed separately']);
  const yr=[['Government Annual Filing Fee',60],[S.corp==='yes'?'Corporate secretary (corporate shareholder)':'Corporate secretary',S.corp==='yes'?1440:440]];
  if(S.addr==='need')yr.push(['Registered office address',200]);
  if(S.nominee)yr.push(['Nominee director',1500]);
  if(S.plan&&S.exp!=='mid'&&S.exp!=='large')yr.push(['Accounting: '+AP[S.plan][0],AP[S.plan][1]]);
  const cpf=S.passes.includes('loc')||S.passes.includes('unsure');
  if(S.hire==='yes'&&PY[S.emp]&&!cpf){
    yr.push(['Payroll service ('+PY[S.emp]+' employee'+(PY[S.emp]===1?'':'s')+')',PY[S.emp]*50*12]);
    yr.push(['SDL ('+PY[S.emp]+' employee'+(PY[S.emp]===1?'':'s')+')',PY[S.emp]*11*12]);
  }
  const sum=a=>a.reduce((s,l)=>s+(typeof l[1]==='number'?l[1]:0),0);
  return{one,yr,now:sum(one),yearly:sum(yr),sym:c[1],quote:(!!S.plan&&(S.exp==='mid'||S.exp==='large'))||(S.hire==='yes'&&S.emp==='11+'),cpf:S.hire==='yes'&&cpf,pass:S.passes.some(x=>x!=='loc')}
}
function risk(){
  const fl=[];let p=0;const it=(L[S.model]||[]).find(x=>x[0]===S.industry);
  if(it&&it[1]){p+=it[1];fl.push([S.otherIndustry?`Other (${S.otherIndustry})`:it[0],it[2]])}
  if(S.market==='risk'){p+=3;fl.push(['Trades with sanctioned or high-risk countries','Run sanctions screening on counterparties'])}
  if(S.funds==='yes'){p+=2;fl.push(['Holds or moves customer money','Confirm the licence it needs before accepting'])}
  if(S.passes.some(x=>x!=='loc'))fl.push(['Work passes needed (EP, WP or unsure)','Check eligibility and quota; refer to the work pass team']);
  if(S.bank==='yes')fl.push(['Business bank account assistance requested','Check the bank’s appetite for this industry and ownership before introducing']);
  if(S.addr==='own')fl.push(['Client-supplied registered address','Confirm the address can be used as a registered office']);
  if(S.resident==='no'){p+=1;fl.push(['No locally resident director','Confirm nominee terms and sign a nominee agreement'])}
  if(S.nominee){p+=1;fl.push(['Nominee director requested','Require an accounting package alongside'])}
  if(S.corp==='yes'){p+=1;fl.push(['Corporate shareholder','Get the full ownership chain and ultimate owners'])}
  if(S.sh==='5+'){p+=1;fl.push(['Five or more shareholders','Collect ID and percentage held for each'])}
  return p>=3?['r','Senior review before onboarding',fl]:p>=1?['a','Proceed with enhanced checks',fl]:['g','Standard onboarding',fl];
}
function pct(){const f=[S.country,S.model,S.industry,S.activity.trim(),S.market,S.model==='products'?'n':S.funds,S.addr,S.dirs,S.resident,S.sh,S.corp,S.name.trim(),(S.email||S.contact).trim()];return Math.round(f.filter(Boolean).length/f.length*100)}
const money=(s,n)=>s+n.toLocaleString('en-US');
function drawEst(){
  const e=calc();
  let h='<small>YOUR ESTIMATE</small>';
  
  if(!S.country){
    h+='<div class="big">—</div><div class="fine">Choose a country to begin.</div>';
  } else if(!e){
    h+='<div class="big" style="font-size:24px;">Quoted by an expert</div><div class="fine">We’ll confirm pricing for ' + (S.country==='OT'?(S.otherCountry||'this country'):(C[S.country]?C[S.country][0]:'this country')) + ' or company type with you directly.</div>';
  } else {
    const row=u=>l=>'<div class="row"><span>'+l[0]+'</span><span>'+(typeof l[1]==='number'?money(e.sym,l[1])+'<span class="u"> '+u+'</span>':l[1])+'</span></div>';
    
    // 1. ALL ITEM COSTS COME FIRST
    h+='<div style="margin-top:12px;">';
    if(e.one.length > 0){
      h+='<div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#94A3B8; margin-bottom:6px;">One-time items</div>';
      h+=e.one.map(row('one time')).join('');
    }
    if(e.yr.length > 0){
      h+='<div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#94A3B8; margin-top:14px; margin-bottom:6px;">Annual recurring items</div>';
      h+=e.yr.map(row('/ year')).join('');
    }
    h+='</div>';

    // 2. BOTH TOTALS COME BELOW OF ALL COST
    h+='<div style="margin-top:20px; padding-top:16px; border-top:2px solid rgba(255,255,255,0.12);">';
    


    // Annual Recurring Total: Estimated annual recurring costs S$500 / year
    h+='<div class="annual-summary" style="margin-top:0;">';
    h+='<div class="annual-label">Estimated annual recurring costs</div>';
    h+='<div class="annual-total">'+money(e.sym,e.yearly)+'<span> / year</span></div>';
    h+='<div class="annual-caption">Based on the services selected below</div>';
    h+='</div>';

    h+='</div>';

    if(e.cpf) h+='<div class="fine" style="margin-top:12px;">Payroll for local hires is quoted separately. It needs CPF calculations.</div>';
    if(e.quote) h+='<div class="fine" style="margin-top:6px;">Some items will be quoted by an expert.</div>';
    h+='<div class="fine" style="margin-top:8px;">Illustrative figures. Final fees confirmed after review.</div>';
  }

  h+='<div class="human">Prefer a person? A company secretary can guide you at any step.<button onclick="openHelp()">Talk to an expert</button></div>';
  $('est').innerHTML=h;
  $('steps').innerHTML=[1,2,3,4,5,6,7].map(n=>'<i class="'+(n<=S.step?'on':'')+'"></i>').join('');
}
const help='<button class="link" onclick="openHelp()">Not sure about something? Talk to an expert</button>';
function draw(){
  let h='';
  if(S.step===1){
    const canContinue = S.country && (S.country !== 'OT' || (S.otherCountry && S.otherCountry.trim()));
    h=`<h2>Let’s start with the basics</h2><p class="sub">This sets the process and fees.</p><label>Country</label><select onchange="set('country',this.value)"><option value="">Select country</option>${Object.entries(C).map(([k,v])=>`<option value="${k}" ${S.country===k?'selected':''}>${v[0]}</option>`).join('')}</select>
    ${S.country==='OT'?`<label>Country name</label><input placeholder="e.g. Australia, Germany, Canada, United Kingdom" value="${esc(S.otherCountry||'')}" oninput="S.otherCountry=this.value; drawEst(); const btn=document.getElementById('step1-btn'); if(btn) btn.disabled=!this.value.trim();"><p class="why">Please enter the country where you wish to incorporate.</p>`:''}
    <label>Company type</label><select onchange="set('type',this.value)">${TYPES.map(x=>`<option value="${x[0]}" ${S.type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>
    <label>Company name <span class="optl">Optional</span></label><input placeholder="e.g. Bright Skin Pte. Ltd." value="${esc(S.cname)}" oninput="S.cname=this.value"><p class="why">You can skip this for now. We’ll check the name is available for you.</p>
    <div class="nav"><span></span><button id="step1-btn" class="btn p" ${canContinue?'':'disabled'} onclick="go(2)">Continue</button></div>`+help;
  }else if(S.step===2){
    const canContinue = canStep2();
    h=`<h2>What will the company do?</h2><p class="sub">This tells us what checks apply.</p><label>Main activity</label>`+opts('model',Object.entries(MODEL))+(S.model?`<p class="hint">${H[S.model]}</p>
    ${S.model==='other'?`<label>Main activity details</label><input id="other-model-input" placeholder="e.g. Space exploration, Clean tech, AI robotics" value="${esc(S.otherModel||'')}" oninput="S.otherModel=this.value; if(!S.activity.trim())S.activity=this.value; drawEst(); const btn=document.getElementById('step2-btn'); if(btn) btn.disabled=!canStep2();"><p class="why">Please describe your main business activity.</p>`:''}
    <label>Closest industry</label><select onchange="set('industry',this.value)"><option value="">Select industry</option>${L[S.model].map(i=>`<option value="${i[0]}" ${S.industry===i[0]?'selected':''}>${i[0]}</option>`).join('')}</select>
    ${S.industry==='Other (describe below)'?`<label>Industry details</label><input id="other-ind-input" placeholder="e.g. Artificial Intelligence, Space tech, Clean energy" value="${esc(S.otherIndustry||'')}" oninput="S.otherIndustry=this.value; if(!S.activity.trim())S.activity=this.value; drawEst(); const btn=document.getElementById('step2-btn'); if(btn) btn.disabled=!canStep2();"><p class="why">Please enter details describing your specific business activity or industry.</p>`:''}
    <label>In one sentence, what will you ${S.model==='services'?'offer':S.model==='holding'?'hold':S.model==='fund'?'manage':S.model==='other'?'do':'sell or offer'}? <span class="optl">Optional</span></label><textarea rows="3" placeholder="e.g. Sell skincare products online to customers in Asia" oninput="S.activity=this.value;drawEst(); const btn=document.getElementById('step2-btn'); if(btn) btn.disabled=!canStep2();">${esc(S.activity)}</textarea>`:'')+
    `<div class="nav"><button class="btn" onclick="go(1)">Back</button><button id="step2-btn" class="btn p" ${canContinue?'':'disabled'} onclick="go(3)">Continue</button></div>`+help;
  }else if(S.step===3){
    const cn=S.country&&S.country!=='OT'?C[S.country][0]:(S.otherCountry?S.otherCountry.trim():'the country of incorporation');
    h=`<h2>How will it operate?</h2><p class="sub">A few quick questions. Anything marked optional can be skipped.</p>`+
    `<label>Where are most customers or suppliers?</label><p class="why">We screen the countries a company trades with.</p>`+opts('market',Object.entries(MKT))+
    (S.model==='products'?'':`<label>Will the company hold or move money for customers?</label><p class="why">Payment or escrow activity can need a licence.</p>`+opts('funds',[['no','No'],['yes','Yes']]))+
    `<label>Do you have a registered office address in ${cn}?</label><p class="why">Every company needs a local address for official mail. We can provide one.</p>`+opts('addr',[['own','Yes, I have one'],['need','No, I need one from you'],['unsure','Not sure yet']])+
    `<div class="nav"><button class="btn" onclick="go(2)">Back</button><button class="btn p" ${S.market&&S.addr&&(S.model==='products'||S.funds)?'':'disabled'} onclick="go(4)">Continue</button></div>`+help;
  }else if(S.step===4){
    const cnDir = S.country&&S.country!=='OT'?C[S.country][0]:(S.otherCountry?S.otherCountry.trim():'the country of incorporation');
    h=`<h2>Directors and shareholders</h2><p class="sub">Just the headline numbers for now.</p><label>Number of directors</label>`+opts('dirs',[['1','1'],['2','2'],['3+','3 or more']])+
    `<label>Is at least one director resident in ${cnDir}?</label>`+opts('resident',[['yes','Yes'],['no','No']])+
    (S.resident==='no'?`<div class="note">A locally resident director is usually required. We can provide a nominee director.<br><label style="margin:10px 0 0"><input type="checkbox" style="width:auto;margin-right:6px" ${S.nominee?'checked':''} onchange="set('nominee',this.checked)">I’d like a nominee director service</label></div>`:'')+
    `<label>Number of shareholders</label>`+opts('sh',[['1','1'],['2','2'],['3-4','3–4'],['5+','5 or more']])+
    `<label>Is any shareholder a company?</label>`+opts('corp',[['no','No, all individuals'],['yes','Yes']])+
    `<div class="nav"><button class="btn" onclick="go(3)">Back</button><button class="btn p" ${S.dirs&&S.resident&&S.sh&&S.corp?'':'disabled'} onclick="go(5)">Continue</button></div>`+help;
  }else if(S.step===5){
    const ok0=C[S.country]&&C[S.country][3],f=ok0?C[S.country][2]:1,sym=ok0?C[S.country][1]:'S$',small=S.exp!=='mid'&&S.exp!=='large';
    const pl=Object.entries(AP).map(([k,v])=>[k,v[0]+(S.exp&&small?' · '+money(sym,Math.round(v[1]*f)):'')]);
    h=`<h2>Do you need accounting too?</h2><p class="sub">Optional. You can add it now or later.</p><label>Expected yearly expenses</label><p class="why">Accounting is priced by how much the company spends. If unsure, start with the lowest.</p>`+opts('exp',[['small','Up to '+sym+'30,000'],['mid',sym+'30,000 to '+sym+'100,000'],['large','Over '+sym+'100,000'],['unsure','Not sure yet']])+
    ((S.exp||S.nominee)?`<label>Choose a plan</label>`+opts('plan',(S.nominee?[]:[['','No accounting for now']]).concat(pl))+(S.plan?`<p class="hint">${PH[S.plan]}</p>`:'')+(S.exp&&!small?'<div class="note">For this expense level, an expert will quote the accounting fee. It won’t be added to the estimate yet.</div>':''):'')+
    (S.nominee?'<div class="note">We provide nominee directors only to clients who also use our accounting service, so please choose a plan.</div>':'')+
    `<div class="nav"><button class="btn" onclick="go(4)">Back</button><button class="btn p" ${S.nominee&&!S.plan?'disabled':''} onclick="go(6)">Continue</button></div>`+help;
  }else if(S.step===6){
    const sg=S.country==='SG',pb=[['ep','Employment Pass (EP)'],['wp','Work Permit (WP)'],['loc','Local hires only'],['unsure','Not sure']];
    h=`<h2>Hiring and banking</h2><p class="sub">Optional. Skip anything you don’t need yet.</p><label>Will you hire employees?</label><p class="why">Payroll service is S$50 per employee per month, plus S$11 SDL per employee per month. Local hires may need separate CPF calculations.</p>`+opts('hire',[['no','No, not yet'],['yes','Yes']])+
    (S.hire==='yes'?`<label>How many employees to start?</label>`+opts('emp',[['1','1 employee'],['2','2 employees'],['3-5','3–5 employees'],['6-10','6–10 employees'],['11+','11 or more']])+
    (sg?`<label>Will any need a work pass?</label><p class="why">Choose all that apply.</p><div class="opts">${pb.map(([v,x])=>`<button class="opt ${S.passes.includes(v)?'on':''}" onclick="tog('${v}')">${x}</button>`).join('')}</div>`:'<div class="note">Work visa support for this country is quoted by an expert.</div>')+(S.passes.includes('loc')?'<div class="note">Payroll for local hires is quoted separately. It needs CPF calculations.</div>':(S.emp==='3-5'||S.emp==='6-10'?'<div class="note">For a range, the estimate uses the minimum employee count selected. Final fees depend on the exact headcount.</div>':'')):'')+
    `<label>Would you like help opening a business bank account?</label><p class="why">Optional service. S$500 assistance fee applies only if selected.</p>`+opts('bank',[['yes','Yes'],['no','No'],['unsure','Not sure yet']])+
    `<div class="nav"><button class="btn" onclick="go(5)">Back</button><button class="btn p" ${S.hire==='yes'&&!S.emp?'disabled':''} onclick="go(7)">See my estimate</button></div>`+help;
  }else{
    const r=risk(),ok=S.name.trim()&&S.email.trim();
    h=`<h2>Save your estimate</h2><p class="sub">We’ll email you a copy. Next step is up to you.</p><label>Full name</label><input value="${esc(S.name)}" oninput="S.name=this.value;drawEst()"><label>Email</label><input type="email" value="${esc(S.email)}" oninput="S.email=this.value;drawEst()">`+
    (r[0]==='r'?`<div class="paths one"><div class="path"><b>A company secretary will review your details</b><span>Your set-up needs a closer look. We’ll call you within one business day. No payment is needed yet.</span><button class="btn p" onclick="openHelp()">Request my call</button></div></div>`
    :`<div class="paths"><div class="path"><b>Continue myself</b><span>Continue with a company secretary.</span><button class="btn p" onclick="openHelp()">Continue with an expert</button></div><div class="path"><b>Talk to an expert</b><span>A company secretary will walk you through it.</span><button class="btn" onclick="openHelp()">Request a call</button></div></div>`)+
    `<button class="link" onclick="S.internal=!S.internal;draw()">${S.internal?'Hide':'Preview'} internal view (what our team sees)</button>`+
    (S.internal?`<div class="int"><span class="tag ${r[0]}">${r[1]}</span><p style="margin:10px 0 4px;color:var(--slate)">Profile: <b>${(TYPES.find(x=>x[0]===S.type)||[])[1]||'—'}</b> · name: ${S.cname.trim()||'to be checked'} · <b>${MODEL[S.model]||'—'}</b> · ${S.industry||'—'} · customers: ${CUST[S.cust]||'—'} · markets: ${MKT[S.market]||'—'} · address: ${{own:'own address',need:'our address',unsure:'to confirm'}[S.addr]||'—'} · accounting: ${S.plan?AP[S.plan][0]:'none'} · payroll: ${S.hire==='yes'?(S.emp||'?')+' staff':'no'} · bank help: ${S.bank||'—'}</p><p style="color:var(--slate)">Information captured: <b>${pct()}%</b>${S.lead&&S.lead.sent?` · Expert call: ${S.lead.enquiry||'—'} on ${S.lead.date||'—'} at ${S.lead.time||'—'} (step ${S.lead.step})`:''}</p>${r[2].length?'<ul>'+r[2].map(x=>`<li><b>${x[0]}</b><br><span>Check: ${x[1]}</span></li>`).join('')+'</ul>':'<p style="margin-top:8px">No risk flags raised.</p>'}</div>`:'')+
    `<div class="nav"><button class="btn" onclick="go(6)">Back</button><span></span></div>`;
  }
  $('form').innerHTML=h;drawEst();
}
function openHelp(){$('modal').hidden=false;drawHelp()}
function closeHelp(){$('modal').hidden=true}
function drawHelp(){
  const today=new Date();
  const minDate=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  $('mbox').innerHTML=S.lead&&S.lead.sent?`<h2>Thank you</h2><p class="sub">Your enquiry has been prepared in this preview. Once the website is connected to your CRM or email service, your team can receive and manage the request.</p><button class="btn p" onclick="closeHelp()">Back to my estimate</button><p class="note" role="status">Preview mode: this request has not been sent.</p>`
  :`<h2>Talk to an expert</h2><p class="sub">Tell us what you need and choose a preferred call date and time.</p>
    <label>How can we help?</label><select onchange="S.enquiry=this.value"><option ${S.enquiry==='General enquiry'?'selected':''}>General enquiry</option><option ${S.enquiry==='Incorporation'?'selected':''}>Incorporation</option><option ${S.enquiry==='Transfer'?'selected':''}>Transfer</option><option ${S.enquiry==='Company secretary'?'selected':''}>Company secretary</option><option ${S.enquiry==='Accounting and Tax'?'selected':''}>Accounting and Tax</option><option ${S.enquiry==='GST'?'selected':''}>GST</option><option ${S.enquiry==='Employment Pass / Work Pass'?'selected':''}>Employment Pass / Work Pass</option></select>
    <label>Full name</label><input value="${esc(S.name)}" oninput="S.name=this.value">
    <label>Phone or email</label><input value="${esc(S.contact||S.email)}" oninput="S.contact=this.value" placeholder="Your phone number or email">
    <label>Preferred call date</label><input type="date" min="${minDate}" value="${esc(S.callDate)}" onchange="S.callDate=this.value">
    <label>Preferred time slot (Singapore time)</label><select onchange="S.time=this.value"><option ${S.time==='09:00–11:00'?'selected':''}>09:00–11:00</option><option ${S.time==='11:00–13:00'?'selected':''}>11:00–13:00</option><option ${S.time==='14:00–16:00'?'selected':''}>14:00–16:00</option><option ${S.time==='16:00–18:00'?'selected':''}>16:00–18:00</option></select>
    ${S.err?'<p class="err">Please enter your name, phone or email, preferred date and time slot.</p>':''}
    <div class="nav"><button class="btn" onclick="closeHelp()">Cancel</button><button class="btn p" onclick="sendLead()">Request a call</button></div>`;
}
function sendLead(){
  if(!S.name.trim()||!(S.contact||S.email).trim()||!S.callDate||!S.time){S.err=true;drawHelp();return}
  S.err=false;S.lead={sent:true,step:S.step,enquiry:S.enquiry,date:S.callDate,time:S.time};drawHelp();draw();
  $('mbox').insertAdjacentHTML('beforeend','<p class="note" role="status">Preview mode: this request has not been sent. Connect your website form to your CRM or email service before publishing.</p>');
}
draw();
</script>
