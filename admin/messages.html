<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Inquiries | Globalisor Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/tailwind.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script>
        // Authentication Check
        if (!localStorage.getItem('admin_auth')) {
            window.location.href = '/auth.html';
        }
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { 
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' },
                        primary: '#0f172a', accent: '#3b82f6' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden; 
        }
        .top-nav { height: 60px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1.5rem; z-index: 9999; gap: 0.5rem; justify-content: space-between; }
        .main-container { padding: 1.5rem; max-width: 1600px; margin-left: 240px !important; margin-right: auto; }
        .module-nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; width: 100% !important; box-sizing: border-box !important; }
        .module-nav-btn:hover { color: #0f172a; background: rgba(255,255,255,0.6); }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .top-nav > div:nth-child(2), #module-switcher {
            position: fixed !important;
            top: 60px !important;
            left: 0 !important;
            width: 240px !important;
            height: calc(100vh - 60px) !important;
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(20px) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-top: none !important;
            border-left: none !important;
            border-bottom: none !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 1.5rem 1rem !important;
            gap: 0.5rem !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
            z-index: 9998 !important;
            box-shadow: none !important;
        }

        .submenu-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            transition: all 0.3s ease;
        }
        .submenu-container.hidden {
            display: none !important;
        }
        .submenu-arrow {
            transition: transform 0.2s ease;
        }
        .submenu-open .submenu-arrow {
            transform: rotate(180deg);
        }
    </style>
    <script src="admin-sidebar.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="flex items-center gap-4">
            <div class="flex flex-col leading-none cursor-pointer" onclick="window.location.href='dashboard.html'">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Admin</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Dashboard</span>
            </div>
        </div>
        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="window.location.href='dashboard.html'" class="module-nav-btn" id="btn-clients"><i data-lucide="users" class="w-4 h-4"></i> Clients</button>
            <button onclick="window.location.href='applications.html'" class="module-nav-btn" id="btn-applications"><i data-lucide="file-text" class="w-4 h-4"></i> Applications</button>
            <button onclick="window.location.href='kyc.html'" class="module-nav-btn" id="btn-kyc"><i data-lucide="shield-check" class="w-4 h-4"></i> KYC Review</button>
            <button onclick="window.location.href='compliance.html'" class="module-nav-btn" id="btn-compliance"><i data-lucide="balance-scale" class="w-4 h-4"></i> Compliance</button>
            
            <button onclick="window.location.href='reports.html'" class="module-nav-btn" id="btn-reports"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reports</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn active" id="btn-messages"><i data-lucide="message-square" class="w-4 h-4"></i> Messages</button>
            <button onclick="window.location.href='content.html'" class="module-nav-btn" id="btn-content"><i data-lucide="book-open" class="w-4 h-4"></i> Content</button>

            <!-- Services Accordion Group -->
            <div class="w-full flex flex-col gap-0.5">
                <button onclick="toggleSubmenu('services-submenu')" class="module-nav-btn" id="btn-services">
                    <i data-lucide="briefcase" class="w-4 h-4"></i>
                    <span class="flex-1 text-left">Services</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 submenu-arrow transition-transform"></i>
                </button>
                <div id="services-submenu" class="submenu-container hidden pl-6 flex flex-col gap-0.5 mt-0.5">
                    <button onclick="window.location.href='blogs.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-blogs"><i data-lucide="layout" class="w-3.5 h-3.5"></i> Blogs</button>
                    <button onclick="window.location.href='countries.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-countries"><i data-lucide="globe" class="w-3.5 h-3.5"></i> Countries</button>
                    <button onclick="window.location.href='packages.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-packages"><i data-lucide="package" class="w-3.5 h-3.5"></i> Packages</button>
                    <button onclick="window.location.href='users.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-users"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Users</button>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 relative">
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800">Admin Team</div>
                    <button onclick="localStorage.removeItem('admin_auth'); localStorage.removeItem('token'); window.location.href='/auth.html'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div id="view-messages">
            <div class="grid grid-cols-12 gap-8 h-[calc(100vh-150px)]">
                <!-- Sidebar: Conversations -->
                <div class="col-span-4 bg-white/60 backdrop-blur-xl border border-white/80 rounded-3xl overflow-hidden flex flex-col shadow-sm">
                    <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="font-bold text-slate-900">Support Inquiries</h3>
                        <span class="px-2 py-1 rounded-full bg-blue-100 text-blue-600 text-[10px] font-bold uppercase tracking-widest" id="chat-count">0</span>
                    </div>
                    <div id="conversation-list" class="flex-1 overflow-y-auto">
                        <div class="p-10 text-center text-slate-400 text-xs">Loading conversations...</div>
                    </div>
                </div>

                <!-- Chat Window -->
                <div class="col-span-8 bg-white/60 backdrop-blur-xl border border-white/80 rounded-3xl overflow-hidden flex flex-col shadow-sm">
                    <div id="chat-window-content" class="flex flex-col h-full">
                        <div class="flex-1 flex flex-col items-center justify-center p-12 text-center text-slate-400">
                            <div class="w-20 h-20 bg-blue-50 text-blue-300 rounded-3xl flex items-center justify-center mb-6">
                                <i data-lucide="message-square" class="w-10 h-10"></i>
                            </div>
                            <h4 class="font-bold text-slate-900 text-lg">Select an Inquiry</h4>
                            <p class="text-sm mt-2 max-w-xs">Globalisor Support Desk. Connect with clients across all jurisdictions instantly.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let messagePollInterval = null;
        let selectedClientId = null;

        async function fetchConversations() {
            try {
                const res = await fetch('/api/messages/conversations');
                const conversations = await res.json();
                renderConversationList(conversations);
                const chatCount = document.getElementById('chat-count');
                if (chatCount) chatCount.innerText = conversations.length;
            } catch (e) { console.error(e); }
        }

        function renderConversationList(conversations) {
            const list = document.getElementById('conversation-list');
            if (!list) return;
            
            list.innerHTML = conversations.map(c => `
                <div class="p-6 border-b border-slate-50 hover:bg-blue-50/30 cursor-pointer transition-all ${selectedClientId === c.clientId ? 'bg-blue-50/50 border-l-4 border-l-blue-500' : ''}" 
                    onclick="selectConversation('${c.clientId}', '${c.clientName}')">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-slate-800 text-sm">${c.clientName}</h4>
                        <span class="text-[9px] text-slate-400 font-bold">${new Date(c.lastMessageTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                    <p class="text-xs text-slate-500 line-clamp-1">${c.lastMessage}</p>
                </div>
            `).join('') || '<div class="p-20 text-center text-slate-400 text-xs">No conversations yet</div>';
        }

        window.selectConversation = function(clientId, clientName) {
            selectedClientId = clientId;
            const windowDiv = document.getElementById('chat-window-content');
            windowDiv.innerHTML = `
                <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">${clientName.charAt(0)}</div>
                        <div>
                            <h3 class="font-bold text-slate-900">${clientName}</h3>
                            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${clientId}</div>
                        </div>
                    </div>
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-8 space-y-6">
                    <div class="text-center py-10"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-slate-200 mx-auto"></i></div>
                </div>
                <div class="p-6 border-t border-slate-100 bg-white/80">
                    <form onsubmit="handleSend(event)" class="flex gap-4">
                        <input type="text" id="admin-chat-input" placeholder="Type official response..." 
                            class="flex-1 px-5 py-3 bg-slate-100/50 border-none rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all">
                        <button type="submit" class="bg-blue-600 text-white p-3 rounded-xl hover:bg-blue-700 transition-all">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </form>
                </div>
            `;
            if (window.lucide) window.lucide.createIcons();
            fetchMessages(clientId);
            fetchConversations(); 
        }

        async function fetchMessages(clientId) {
            try {
                const res = await fetch(\`/api/messages?clientId=\${clientId}\`);
                const messages = await res.json();
                const container = document.getElementById('chat-messages');
                if (!container) return;

                const isMe = (m) => m.senderRole === 'staff' || m.senderRole === 'admin';
                
                const html = messages.map(m => \`
                    <div class="flex \${isMe(m) ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[70%]">
                            <div class="flex items-center gap-2 mb-1 \${isMe(m) ? 'justify-end' : 'justify-start'}">
                                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">\${m.senderName}</span>
                                <span class="text-[9px] text-slate-300 font-medium">\${new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                            <div class="px-4 py-2.5 rounded-2xl text-sm \${isMe(m) ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white text-slate-700 border border-slate-100 rounded-tl-none shadow-sm'}">
                                \${m.text}
                            </div>
                        </div>
                    </div>
                \`).join('');

                const shouldScroll = container.scrollTop + container.clientHeight >= container.scrollHeight - 50;
                container.innerHTML = html;
                if (shouldScroll || container.innerHTML.length < 1000) container.scrollTop = container.scrollHeight;
            } catch (e) { console.error(e); }
        }

        window.handleSend = async function(e) {
            e.preventDefault();
            const input = document.getElementById('admin-chat-input');
            const text = input.value.trim();
            if (!text || !selectedClientId) return;

            try {
                await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clientId: selectedClientId,
                        senderId: 'admin-1',
                        senderName: 'Admin Team',
                        senderRole: 'admin',
                        text: text
                    })
                });
                input.value = '';
                fetchMessages(selectedClientId);
            } catch (e) { console.error(e); }
        }

        function startPolling() {
            fetchConversations();
            messagePollInterval = setInterval(() => {
                fetchConversations();
                if (selectedClientId) fetchMessages(selectedClientId);
            }, 3000);
        }

        window.toggleSubmenu = function(id) {
            const submenu = document.getElementById(id);
            const btn = document.getElementById('btn-services');
            if (submenu) {
                const isOpen = !submenu.classList.contains('hidden');
                if (isOpen) {
                    submenu.classList.add('hidden');
                    btn.classList.remove('submenu-open');
                } else {
                    submenu.classList.remove('hidden');
                    btn.classList.add('submenu-open');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            if (path.includes('blogs.html') || path.includes('countries.html') || path.includes('packages.html')) {
                const submenu = document.getElementById('services-submenu');
                const btn = document.getElementById('btn-services');
                if (submenu) submenu.classList.remove('hidden');
                if (btn) btn.classList.add('submenu-open');
            }
            startPolling();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
