<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Globalisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/tailwind.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }
        .input-box {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .input-box:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-md rounded-3xl p-10 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-indigo-600"></div>
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Admin Portal</h1>
            <p class="text-slate-50 font-medium">Globalisor Secure Access</p>
        </div>

        <form id="admin-login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Admin Email</label>
                <input type="email" id="email" class="input-box" placeholder="admin@globalisor.com" required value="admin@globalisor.com">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" id="password" class="input-box" placeholder="••••••••" required value="password123">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-slate-600 cursor-pointer">
                    <input type="checkbox" class="mr-2 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    Remember me
                </label>
                <a href="#" class="text-blue-600 font-medium hover:text-blue-700">Forgot password?</a>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg hover:shadow-xl active:scale-[0.98] flex justify-center items-center gap-2 mt-4">
                <span>Secure Login</span>
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </form>

        <div id="error-msg" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-sm font-medium rounded-lg border border-red-100 text-center">
            Invalid credentials or unauthorized access.
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.role && data.role.toUpperCase() === 'ADMIN') {
                        const name = (data.firstName && data.lastName) ? (data.firstName + ' ' + data.lastName) : 'Admin User';
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('admin_auth', JSON.stringify({ role: 'admin', email: email, name: name, id: data.id, token: data.token }));
                        window.location.href = '/admin/dashboard.html';
                    } else {
                        document.getElementById('error-msg').innerText = "Access denied. Only Admin users are authorized.";
                        document.getElementById('error-msg').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('error-msg').innerText = "Invalid credentials or unauthorized access.";
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            } catch (err) {
                console.error("Login error", err);
                // Forgiving offline mock login for Admin
                const nameParts = email.split('@')[0].split('.');
                const name = nameParts.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ') || 'Admin User';
                localStorage.setItem('token', 'mock-admin-token');
                localStorage.setItem('admin_auth', JSON.stringify({ role: 'admin', email: email, name: name, id: 'mock-admin-id', token: 'mock-admin-token' }));
                window.location.href = '/admin/dashboard.html';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('admin_auth')) {
            const auth = JSON.parse(localStorage.getItem('admin_auth'));
            if (auth.role === 'admin' && auth.token && auth.token !== 'mock_token_123') {
                window.location.href = '/admin/dashboard.html';
            }
        }
    </script>
</body>
</html>
