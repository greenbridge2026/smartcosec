    <script>
        if (!localStorage.getItem('admin_auth')) window.location.href = '/auth.html';
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' } }

    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%); background-attachment: fixed; min-height: 100vh; overflow-x: hidden; }
        .top-nav { height: 60px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1.5rem; z-index: 9999; gap: 0.5rem; justify-content: space-between; }
        .main-container { padding: 2rem; max-width: 1600px; margin-left: 240px !important; margin-right: auto; }
        .module-nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; width: 100% !important; box-sizing: border-box !important; }
        .module-nav-btn:hover { color: #0f172a; background: rgba(255,255,255,0.6); }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .top-nav > div:nth-child(2), #module-switcher {
            position: fixed !important;
            top: 60px !important;
            left: 0 !important;
            width: 240px !important;
            height: calc(100vh - 60px) !important;
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(20px) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-top: none !important;
            border-left: none !important;
            border-bottom: none !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 1.5rem 1rem !important;
            gap: 0.5rem !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
            z-index: 9998 !important;
            box-shadow: none !important;
        }
        
        .submenu-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            transition: all 0.3s ease;
        }
        .submenu-container.hidden {
            display: none !important;
        }
        .submenu-arrow {
            transition: transform 0.2s ease;
        }
        .submenu-open .submenu-arrow {
            transform: rotate(180deg);
        }
        
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th { padding: 1rem 1.5rem; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #f1f5f9; background: rgba(248, 250, 252, 0.5); }
        .admin-table td { padding: 1rem 1.5rem; font-size: 0.85rem; color: #1e293b; border-bottom: 1px solid #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04); }
    </style>
</head>
<body>
    <nav class="top-nav">

        </div>
        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">

            <button onclick="window.location.href='kyc.html'" class="module-nav-btn" id="btn-kyc"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg> KYC Review</button>
            <button onclick="window.location.href='compliance.html'" class="module-nav-btn" id="btn-compliance"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="m16 16 3-8 3 8c-.87.65-2.24.83-3 .83s-2.13-.18-3-.83Z"/><path d="m2 16 3-8 3 8c-.87.65-2.24.83-3 .83s-2.13-.18-3-.83Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h18"/></svg> Compliance</button>
            
            <button onclick="window.location.href='reports.html'" class="module-nav-btn" id="btn-reports"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg> Reports</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="btn-messages"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Messages</button>
            <button onclick="window.location.href='content.html'" class="module-nav-btn" id="btn-content"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> Content</button>

            <!-- Services Accordion Group -->
            <div class="w-full flex flex-col gap-0.5">
                <button onclick="toggleSubmenu('services-submenu')" class="module-nav-btn" id="btn-services">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                    <span class="flex-1 text-left">Services</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 submenu-arrow transition-transform duration-200 shrink-0"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div id="services-submenu" class="submenu-container hidden pl-6 flex flex-col gap-0.5 mt-0.5">
                    <button onclick="window.location.href='blogs.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-blogs"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 shrink-0"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Blogs</button>
                    <button onclick="window.location.href='countries.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-countries"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 shrink-0"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg> Countries</button>
                    <button onclick="window.location.href='users.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-users"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 shrink-0"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg> Users</button>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 relative">
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800">Admin Team</div>
                    <button onclick="localStorage.removeItem('admin_auth'); localStorage.removeItem('token'); window.location.href='/auth.html'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>
 
    <main class="main-container">
        <div class="space-y-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-3xl font-bold font-outfit text-slate-900">Service Packages</h2>
                    <p class="text-slate-500 text-sm">Manage incorporation catalog pricing and parameters.</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Country Hub:</label>
                        <select id="package-country-select" class="px-4 py-2.5 bg-white/60 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500/20 transition-all cursor-pointer">
                            <!-- Dynamic options -->
                        </select>
                    </div>
                    <button onclick="alert('Creating service packages...')" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-6 py-2.5 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add Package
                    </button>
                </div>
            </div>
 
            <!-- Base Packages Section -->
            <div class="glass-card p-6">
                <h3 class="font-bold text-slate-900 text-lg mb-4">Core Incorporation Packages</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="core-packages-container">
                    <!-- Dynamic Core Packages -->
                </div>
            </div>
 
            <!-- Add-on Services Table -->
            <div class="glass-card overflow-hidden">
                <div class="p-6 border-b border-slate-100">
                    <h3 class="font-bold text-slate-900 text-lg">Add-on & Secretarial Services</h3>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr class="text-left">
                            <th class="w-16">No</th>
                            <th>Add-on Name</th>
                            <th>Billing Type</th>
                            <th>Base Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="addons-table-body">
                        <!-- Dynamic Add-ons -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
 
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
 
        window.toggleSubmenu = function(id) {
            const submenu = document.getElementById(id);
            const btn = document.getElementById('btn-services');
            if (submenu) {
                const isOpen = !submenu.classList.contains('hidden');
                if (isOpen) {
                    submenu.classList.add('hidden');
                    btn.classList.remove('submenu-open');
                } else {
                    submenu.classList.remove('hidden');
                    btn.classList.add('submenu-open');
                }
            }
        }
 
        let countries = [];
        const DEFAULT_COUNTRIES = [
            { id: "CNTRY-singapore", name: "Singapore", code: "SG", uen: "9-character alphanumeric", tax: "17% (flat rate)", compliance: "99.5%", status: "ACTIVE", basePrice: 1315, priceSecretary: 900, priceDirector: 3000, priceAddress: 600, priceTax: 1500, priceBank: 500, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-hong-kong", name: "Hong Kong", code: "HK", uen: "8-digit registration no.", tax: "16.5% (two-tier)", compliance: "98.8%", status: "ACTIVE", basePrice: 1650, priceSecretary: 800, priceDirector: 2500, priceAddress: 500, priceTax: 1200, priceBank: 400, services: ["Company Incorporation", "Corporate Secretary", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-united-states", name: "United States", code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%", status: "ACTIVE", basePrice: 1200, priceSecretary: 1000, priceDirector: 3000, priceAddress: 700, priceTax: 1500, priceBank: 500, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-dubai", name: "Dubai", code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%", status: "ACTIVE", basePrice: 2500, priceSecretary: 1200, priceDirector: 4000, priceAddress: 900, priceTax: 1800, priceBank: 600, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-australia", name: "Australia", code: "AUS", uen: "9-digit ACN number", tax: "25% - 30%", compliance: "96.8%", status: "ACTIVE", basePrice: 1400, priceSecretary: 950, priceDirector: 3100, priceAddress: 650, priceTax: 1600, priceBank: 550, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-united-kingdom", name: "United Kingdom", code: "UK", uen: "8-digit CRN number", tax: "19% - 25%", compliance: "98.5%", status: "ACTIVE", basePrice: 1300, priceSecretary: 850, priceDirector: 2800, priceAddress: 550, priceTax: 1400, priceBank: 450, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] }
        ];
 
        async function loadData() {
            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('admin_auth') || '{}').token;
                const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
                const res = await fetch('/api/countries', { headers });
                if (res.ok) {
                    countries = await res.json();
                } else {
                    throw new Error("HTTP error " + res.status);
                }
            } catch (e) {
                console.warn('API error, loading countries from fallback:', e);
                const cached = localStorage.getItem('admin_countries');
                if (cached) {
                    try {
                        countries = JSON.parse(cached);
                    } catch(err) {
                        countries = DEFAULT_COUNTRIES;
                    }
                } else {
                    countries = DEFAULT_COUNTRIES;
                }
            }
            renderCountrySelect();
            renderPackages();
        }
 
        function renderCountrySelect() {
            const select = document.getElementById('package-country-select');
            if (!select) return;
            select.innerHTML = countries.map(c => `<option value="${c.id}">${c.name} (${c.code})</option>`).join('');
            
            // Check for country query parameter
            const urlParams = new URLSearchParams(window.location.search);
            const countryParam = urlParams.get('country');
            if (countryParam && countries.some(c => c.id === countryParam)) {
                select.value = countryParam;
            }
            
            select.addEventListener('change', renderPackages);
        }
 
        const CURRENCY_MAP = {
            "SG": { currency: "SGD", rate: 1.35, isAlreadyLocal: true },
            "HK": { currency: "HKD", rate: 7.8, isAlreadyLocal: true },
            "USA": { currency: "USD", rate: 1.0 },
            "CAN": { currency: "CAD", rate: 1.36 },
            "UK": { currency: "GBP", rate: 0.78 },
            "DE": { currency: "EUR", rate: 0.92 },
            "FR": { currency: "EUR", rate: 0.92 },
            "UAE": { currency: "AED", rate: 3.67 },
            "AUS": { currency: "AUD", rate: 1.50 },
            "ID": { currency: "IDR", rate: 16250 },
            "MY": { currency: "MYR", rate: 4.70 },
            "IN": { currency: "INR", rate: 83.50 },
            "VN": { currency: "VND", rate: 25400 },
            "TH": { currency: "THB", rate: 36.70 },
            "PH": { currency: "PHP", rate: 58.50 },
            "JP": { currency: "JPY", rate: 156.0 }
        };

        function getCurrencyAndPrice(countryCode, usdPrice) {
            const code = (countryCode || '').toUpperCase();
            const info = CURRENCY_MAP[code] || { currency: "USD", rate: 1.0 };
            const price = info.isAlreadyLocal ? usdPrice : Math.round(usdPrice * info.rate);
            return { currency: info.currency, price: price };
        }

        function renderPackages() {
            const select = document.getElementById('package-country-select');
            if (!select) return;
            const cId = select.value;
            const country = countries.find(c => c.id === cId) || countries[0];
            if (!country) return;

            const basePriceRaw = country.basePrice !== undefined && country.basePrice !== null ? country.basePrice : 1200;
            const standardPriceObj = getCurrencyAndPrice(country.code, basePriceRaw);
            const currency = standardPriceObj.currency;
            const standardPrice = standardPriceObj.price;
            const subsidiaryPrice = getCurrencyAndPrice(country.code, basePriceRaw + 335).price;

            // Render Core Packages
            const coreContainer = document.getElementById('core-packages-container');
            
            coreContainer.innerHTML = `
                <div class="bg-white/50 border border-slate-200/80 rounded-2xl p-6 relative flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-slate-900 text-base">${country.name} Standard Package</h4>
                            <span class="bg-blue-50 text-blue-600 font-bold text-[10px] px-2 py-0.5 rounded border border-blue-100">POPULAR</span>
                        </div>
                        <p class="text-xs text-slate-500 mb-6">Complete incorporation for ${country.name} local entities including standard registers and constitutional setup.</p>
                    </div>
                    <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase">FEE (${currency})</span>
                            <div class="text-lg font-bold text-slate-900">${currency} ${standardPrice.toLocaleString()}</div>
                        </div>
                        <button onclick="window.location.href='countries.html?edit=${encodeURIComponent(country.id)}'" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-bold hover:bg-slate-50 transition-all">Edit Pricing</button>
                    </div>
                </div>

                <div class="bg-white/50 border border-slate-200/80 rounded-2xl p-6 relative flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-slate-900 text-base">Subsidiary / Corporate Shareholder Setup</h4>
                            <span class="bg-slate-50 text-slate-500 font-bold text-[10px] px-2 py-0.5 rounded border border-slate-200/80">STANDARD</span>
                        </div>
                        <p class="text-xs text-slate-500 mb-6">Incorporation structure designed for international parent companies setting up ${country.name} subsidiaries.</p>
                    </div>
                    <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase">FEE (${currency})</span>
                            <div class="text-lg font-bold text-slate-900">${currency} ${subsidiaryPrice.toLocaleString()}</div>
                        </div>
                        <button onclick="window.location.href='countries.html?edit=${encodeURIComponent(country.id)}'" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-bold hover:bg-slate-50 transition-all">Edit Pricing</button>
                    </div>
                </div>
            `;

            // Render Add-on table based on services
            const addonsBody = document.getElementById('addons-table-body');
            const mappedServices = country.services || [];
            
            const allAddons = [
                { name: "Corporate Secretary", mapping: "Corporate Secretary", price: country.priceSecretary || 900, type: "Annual recurring" },
                { name: "Nominee Director", mapping: "Nominee Director", price: country.priceDirector || 3000, type: "Annual recurring" },
                { name: "Office Address", mapping: "Office Address", price: country.priceAddress || 600, type: "Annual recurring" },
                { name: "Tax & Compliance (ECI & Form C-S)", mapping: "Tax & Compliance", price: country.priceTax || 1500, type: "Annual recurring" },
                { name: "Bank Account Opening Assistance", mapping: "Bank Account Opening", price: country.priceBank || 500, type: "One-time fee" }
            ];

            const standardMappings = ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance", "Bank Account Opening"];
            const customPrices = country.customPrices || {};

            // Add custom active services
            mappedServices.forEach(svc => {
                if (!standardMappings.includes(svc)) {
                    const price = customPrices[svc] !== undefined ? customPrices[svc] : 0;
                    allAddons.push({
                        name: svc,
                        mapping: svc,
                        price: price,
                        type: "Custom service"
                    });
                }
            });

            // Add custom inactive services that have configured pricing
            Object.keys(customPrices).forEach(svc => {
                if (!standardMappings.includes(svc) && !allAddons.some(a => a.mapping === svc)) {
                    allAddons.push({
                        name: svc,
                        mapping: svc,
                        price: customPrices[svc],
                        type: "Custom service"
                    });
                }
            });

            addonsBody.innerHTML = allAddons.map((addon, index) => {
                const isActive = mappedServices.includes(addon.mapping);
                const badge = isActive 
                    ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-600">ACTIVE</span>`
                    : `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-400">INACTIVE (DISABLED)</span>`;
                
                const addonPrice = getCurrencyAndPrice(country.code, addon.price).price;

                return `
                    <tr class="hover:bg-white/40 transition-colors ${isActive ? '' : 'opacity-60 bg-slate-50/20'}">
                        <td class="font-bold text-blue-600">${index + 1}</td>
                        <td class="font-bold text-slate-800">${addon.name}</td>
                        <td>${addon.type}</td>
                        <td>${currency} ${addonPrice.toLocaleString()}</td>
                        <td>${badge}</td>
                        <td>
                            <button onclick="window.location.href='countries.html?edit=${encodeURIComponent(country.id)}'" class="text-blue-600 hover:underline font-bold text-xs">Edit in Countries</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
 
        // Auto open submenu on load
        document.addEventListener('DOMContentLoaded', () => {
            const submenu = document.getElementById('services-submenu');
            const btn = document.getElementById('btn-services');
            if (submenu) submenu.classList.remove('hidden');
            if (btn) btn.classList.add('submenu-open', 'active');
            
            loadData();
        });
    </script>
</body>
</html>
