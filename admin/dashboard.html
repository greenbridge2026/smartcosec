<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | Globalisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script>
        // Authentication Check
        if (!localStorage.getItem('admin_auth')) {
            window.location.href = '/admin/login.html';
        } else {
            try {
                const auth = JSON.parse(localStorage.getItem('admin_auth'));
                if (auth.role !== 'admin') window.location.href = '/admin/login.html';
            } catch(e) {
                window.location.href = '/admin/login.html';
            }
        }

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { 
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' },
                        primary: '#0f172a', accent: '#3b82f6' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden; 
        }
        
        .top-nav { height: 72px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 2rem; z-index: 100; gap: 2rem; }
        .main-container { margin-top: 72px; padding: 2.5rem; max-width: 1600px; margin-left: auto; margin-right: auto; }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(1, minmax(0, 1fr)); 
            gap: 1rem; 
            margin-bottom: 2rem; 
        }
        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (min-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }
        .stat-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); padding: 1.25rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card.highlight { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border: none; }
        .stat-card.highlight * { color: white !important; }
        
        .module-nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 500; color: #64748b; transition: all 0.2s; cursor: pointer; border: none; background: transparent; }
        .module-nav-btn:hover { color: #0f172a; background: rgba(255,255,255,0.6); }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        .filter-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .filter-tab { padding: 0.75rem 0.5rem; font-size: 0.85rem; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .filter-tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }

        .client-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); padding: 1.5rem; border-radius: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; overflow: hidden; }
        .client-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); background: rgba(255, 255, 255, 0.8); border-color: white; }
        
        .status-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.75rem; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
        .status-pending { background: #eff6ff; color: #2563eb; }
        .status-review { background: #fffbeb; color: #d97706; }
        .status-approved { background: #f0fdf4; color: #16a34a; }
        .status-rejected { background: #fef2f2; color: #dc2626; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .glass-panel { position: fixed; top: 0; right: -100%; width: 600px; height: 100vh; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(30px); box-shadow: -10px 0 50px rgba(0,0,0,0.1); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; display: flex; flex-direction: column; }
        .glass-panel.open { right: 0; }
        .panel-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.1); backdrop-filter: blur(4px); z-index: 1999; display: none; }
        .panel-overlay.open { display: block; }
        
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.4) 25%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0.4) 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: 12px; font-weight: 600; transition: all 0.2s; cursor: pointer; border: none; }
        .btn-primary { background: #0f172a; color: white; }
        .btn-primary:hover { background: #1e293b; transform: scale(1.02); }
        .btn-outline { background: white; border: 1px solid #e2e8f0; color: #64748b; }
        .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; color: #0f172a; }
        
        .detail-section { background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section-title { font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .info-item { display: flex; justify-content: space-between; align-items: center; padding-top: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .info-label { font-size: 0.8rem; color: #94a3b8; }
        .info-value { font-size: 0.85rem; font-weight: 600; color: #334155; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="flex items-center gap-4 flex-1">
            <span class="font-outfit font-bold text-slate-900 tracking-tight text-xl cursor-pointer" onclick="navigateTo('/admin/clients')">Admin Dashboard</span>
            <div class="relative w-64">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" onkeyup="renderClients()" placeholder="Search..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all">
            </div>
        </div>

        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="navigateTo('/admin/clients')" class="module-nav-btn active" id="btn-clients"><i data-lucide="users" class="w-4 h-4"></i> Clients</button>
            <button onclick="navigateTo('/admin/applications')" class="module-nav-btn" id="btn-applications"><i data-lucide="file-text" class="w-4 h-4"></i> Applications</button>
            <button onclick="navigateTo('/admin/kyc')" class="module-nav-btn" id="btn-kyc"><i data-lucide="shield-check" class="w-4 h-4"></i> KYC Review</button>
            <button onclick="navigateTo('/admin/compliance')" class="module-nav-btn" id="btn-compliance"><i data-lucide="balance-scale" class="w-4 h-4"></i> Compliance</button>
            <button onclick="navigateTo('/admin/blogs')" class="module-nav-btn" id="btn-blogs"><i data-lucide="layout" class="w-4 h-4"></i> Blogs</button>
            <button onclick="navigateTo('/admin/reports')" class="module-nav-btn" id="btn-reports"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reports</button>
        </div>

        <div class="flex items-center justify-end gap-4 flex-1 relative">
            <button id="bell-btn" class="p-2 text-slate-600 hover:bg-slate-100/50 rounded-full transition-colors relative" onclick="toggleNotifications(event)">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span id="notification-badge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white hidden"></span>
            </button>
            <div id="notifications-dropdown" class="absolute top-[60px] right-0 w-80 bg-white/95 backdrop-blur-xl border border-white/60 shadow-xl rounded-xl overflow-hidden flex flex-col z-[100] transition-all opacity-0 pointer-events-none scale-95 origin-top-right">
                <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h3 class="font-semibold text-sm text-slate-800">Notifications</h3>
                    <button class="text-xs text-blue-600" onclick="markAllAsRead(event)">Mark all read</button>
                </div>
                <div id="notifications-list" class="max-h-80 overflow-y-auto"></div>
            </div>
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="text-xs font-semibold text-slate-800 cursor-pointer" onclick="logout()">Sign Out</div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="stats-grid">
            <div class="stat-card cursor-pointer hover:bg-white/80 transition-all" onclick="switchModule('clients')">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Total Clients</div>
                <div class="text-2xl font-bold text-slate-900" id="stat-total">0</div>
            </div>
            <div class="stat-card highlight cursor-pointer hover:opacity-90 transition-all" onclick="switchModule('applications')">
                <div class="text-[10px] font-bold text-white/70 uppercase">Total Services</div>
                <div class="text-2xl font-bold text-white" id="stat-services">0</div>
            </div>
            <div class="stat-card cursor-pointer hover:bg-white/80 transition-all" onclick="switchModule('kyc')">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Pending</div>
                <div class="text-2xl font-bold text-blue-600" id="stat-pending">0</div>
            </div>
            <div class="stat-card cursor-pointer hover:bg-white/80 transition-all" onclick="switchModule('compliance')">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Approved</div>
                <div class="text-2xl font-bold text-emerald-600" id="stat-approved">0</div>
            </div>
            <div class="stat-card cursor-pointer hover:bg-white/80 transition-all" onclick="switchModule('reports')">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Rejected</div>
                <div class="text-2xl font-bold text-red-600" id="stat-rejected">0</div>
            </div>
        </div>

        <div id="filter-tabs" class="filter-tabs">
            <div class="filter-tab active" data-filter="all">All Clients</div>
            <div class="filter-tab" data-filter="pending">Pending</div>
            <div class="filter-tab" data-filter="review">Under Review</div>
            <div class="filter-tab" data-filter="approved">Approved</div>
            <div class="filter-tab" data-filter="rejected">Rejected</div>
        </div>

        <div id="module-content">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="clients-grid">
                <!-- Skeletons -->
                <div class="client-card opacity-50"><div class="skeleton h-6 w-24 mb-4"></div><div class="skeleton h-8 w-40 mb-2"></div><div class="skeleton h-4 w-48"></div></div>
                <div class="client-card opacity-50"><div class="skeleton h-6 w-24 mb-4"></div><div class="skeleton h-8 w-40 mb-2"></div><div class="skeleton h-4 w-48"></div></div>
                <div class="client-card opacity-50"><div class="skeleton h-6 w-24 mb-4"></div><div class="skeleton h-8 w-40 mb-2"></div><div class="skeleton h-4 w-48"></div></div>
            </div>
        </div>
    </main>

    <!-- Detail Panel -->
    <div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
    <div class="glass-panel" id="detail-panel">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white/40">
            <div>
                <h2 class="text-2xl font-bold text-slate-900" id="detail-company">Company Name</h2>
                <p class="text-sm text-slate-500" id="detail-date">Client Details</p>
            </div>
            <button class="p-2 hover:bg-slate-100 rounded-full transition-colors" onclick="closePanel()"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6" id="detail-body">
            <!-- Dynamic Content -->
        </div>

        <div class="p-6 bg-white/60 border-t border-slate-100 flex gap-3" id="panel-footer">
            <button class="btn btn-outline flex-1 py-3" onclick="openModal('review')">Mark Review</button>
            <button class="btn btn-outline border-red-200 text-red-600 hover:bg-red-50 flex-1 py-3" onclick="openModal('rejected')">Reject</button>
            <button class="btn btn-primary flex-[2] py-3" onclick="openModal('approved')">Approve Service</button>
        </div>
    </div>

    <!-- Action Modal -->
    <div class="fixed inset-0 z-[3000] flex items-center justify-center pointer-events-none opacity-0 transition-all duration-300" id="action-modal">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto" onclick="closeModal()"></div>
        <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl relative z-10 pointer-events-auto transform scale-90 transition-transform">
            <h3 class="text-xl font-bold mb-2" id="modal-title">Confirm Action</h3>
            <p class="text-slate-600 mb-8" id="modal-desc">Proceed with this update?</p>
            <div class="flex gap-4">
                <button class="btn btn-outline flex-1 py-3" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary flex-1 py-3" id="modal-confirm-btn" onclick="confirmAction()">Proceed</button>
            </div>
        </div>
    </div>

    <script>
        let clientsData = [];
        let statsData = {};
        let currentModule = 'clients';
        let currentFilter = 'all';
        let currentClientId = null;
        let currentServiceId = null;
        let notifications = [];
        let pendingAction = null;

        // Initialization
        async function init() {
            console.log('Dashboard Initializing...');
            lucide.createIcons();
            handleRouting();
            
            // Polling
            setInterval(() => {
                if (!currentClientId) fetchDashboard();
            }, 10000);
        }

        window.navigateTo = function(path) {
            history.pushState(null, null, path);
            handleRouting();
        }

        window.onpopstate = handleRouting;

        function handleRouting() {
            const path = window.location.pathname;
            let module = 'clients';
            if (path.includes('/admin/applications')) module = 'applications';
            else if (path.includes('/admin/kyc')) module = 'kyc';
            else if (path.includes('/admin/compliance')) module = 'compliance';
            else if (path.includes('/admin/blogs')) module = 'blogs';
            else if (path.includes('/admin/reports')) module = 'reports';
            
            switchModule(module);
        }

        function switchModule(module) {
            currentModule = module;
            document.querySelectorAll('.module-nav-btn').forEach(btn => {
                const isMatch = btn.id === 'btn-' + module;
                btn.classList.toggle('active', isMatch);
            });
            
            const filters = document.getElementById('filter-tabs');
            if (filters) filters.style.display = (module === 'clients' || module === 'applications') ? 'flex' : 'none';
            
            refreshView();
        }

        async function refreshView() {
            const container = document.getElementById('module-content');
            if (!container) return;

            if (currentModule === 'clients') {
                container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="clients-grid"></div>';
                await fetchDashboard();
            } else if (currentModule === 'applications') {
                await renderApplications();
            } else if (currentModule === 'kyc') {
                await renderKYC();
            } else if (currentModule === 'compliance') {
                await renderCompliance();
            } else if (currentModule === 'blogs') {
                await renderBlogs();
            } else if (currentModule === 'reports') {
                await renderReports();
            }
            lucide.createIcons();
        }

        async function fetchDashboard() {
            console.log('fetchDashboard triggered');
            try {
                const res = await fetch('/api/dashboard');
                if (!res.ok) throw new Error('API Error: ' + res.status);
                const data = await res.json();
                console.log('Dashboard Data Received:', data);
                clientsData = data.clients || [];
                statsData = data.stats || {};
                
                renderStats();
                if (currentModule === 'clients') renderClients();
                updateNotifications();
            } catch(e) {
                console.error('Fetch failed in dashboard:', e);
            }
        }

        function renderStats() {
            document.getElementById('stat-total').innerText = statsData.totalClients || 0;
            document.getElementById('stat-services').innerText = statsData.totalServices || 0;
            document.getElementById('stat-pending').innerText = statsData.pending || 0;
            document.getElementById('stat-approved').innerText = statsData.approved || 0;
            document.getElementById('stat-rejected').innerText = statsData.rejected || 0;
        }

        function getStatusProps(status) {
            const s = (status || 'pending').toLowerCase();
            if (s === 'pending') return { class: 'status-pending', text: 'Pending' };
            if (s === 'review' || s === 'under review') return { class: 'status-review', text: 'In Review' };
            if (s === 'approved' || s === 'verified') return { class: 'status-approved', text: 'Approved' };
            if (s === 'rejected') return { class: 'status-rejected', text: 'Rejected' };
            return { class: 'status-pending', text: s };
        }

        function renderClients() {
            const grid = document.getElementById('clients-grid');
            if (!grid) return;
            
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = clientsData.filter(c => {
                const matchesFilter = currentFilter === 'all' || 
                                     (currentFilter === 'review' && (c.latestStatus === 'review' || c.latestStatus === 'under review')) ||
                                     c.latestStatus === currentFilter;
                const matchesSearch = c.name.toLowerCase().includes(search) || c.email.toLowerCase().includes(search);
                return matchesFilter && matchesSearch;
            });

            grid.innerHTML = filtered.map(c => {
                const props = getStatusProps(c.latestStatus);
                return `
                    <div class="client-card" onclick="openClientProfile('${c.clientId}')">
                        <div class="flex justify-between items-start mb-4">
                            <span class="status-badge ${props.class}">${props.text}</span>
                            <span class="text-[10px] font-bold text-slate-400 uppercase">ID: ${c.clientId}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">${c.name}</h3>
                        <p class="text-xs text-slate-500 mb-4">${c.email}</p>
                        <div class="grid grid-cols-2 gap-3 pt-4 border-t border-slate-100">
                            <div>
                                <div class="text-[9px] uppercase font-bold text-slate-400">Services</div>
                                <div class="text-sm font-bold text-slate-800">${c.serviceCount}</div>
                            </div>
                            <div>
                                <div class="text-[9px] uppercase font-bold text-slate-400">Last Activity</div>
                                <div class="text-sm font-bold text-slate-800">${c.latestActivity}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            if (filtered.length === 0) grid.innerHTML = '<div class="col-span-full p-12 text-center text-slate-400">No clients found</div>';
            lucide.createIcons();
        }

        async function openClientProfile(id) {
            currentClientId = id;
            try {
                const res = await fetch(`/api/clients/${id}/services`);
                if (!res.ok) return;
                const data = await res.json();
                
                document.getElementById('detail-company').innerText = data.client.name;
                document.getElementById('detail-date').innerText = 'Client Workspace';
                
                let html = `
                    <div class="detail-section">
                        <div class="section-title"><i data-lucide="user" class="w-4 h-4"></i> Contact Info</div>
                        <div class="space-y-3">
                            <div class="info-item"><span class="info-label">Email</span><span class="info-value">${data.client.email}</span></div>
                            <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${data.client.phone || '-'}</span></div>
                        </div>
                    </div>
                    <div class="section-title"><i data-lucide="layers" class="w-4 h-4"></i> Active Services</div>
                    <div class="space-y-3">
                        ${data.services.map(s => {
                            const p = getStatusProps(s.status);
                            return `
                                <div class="p-4 bg-white/60 border border-white/80 rounded-xl flex justify-between items-center">
                                    <div>
                                        <div class="font-bold text-slate-800 text-sm">${s.serviceType}</div>
                                        <div class="text-[10px] text-slate-500">${s.date}</div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="status-badge ${p.class} scale-75">${p.text}</span>
                                        <button class="p-1.5 hover:bg-slate-100 rounded-md" onclick="event.stopPropagation(); openServiceDetail('${s.serviceId}', '${id}')"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                document.getElementById('detail-body').innerHTML = html;
                document.getElementById('panel-footer').style.display = 'none';
                
                document.getElementById('panel-overlay').classList.add('open');
                document.getElementById('detail-panel').classList.add('open');
                lucide.createIcons();
            } catch(e) { console.error(e); }
        }

        async function openServiceDetail(serviceId, clientId) {
            currentServiceId = serviceId;
            try {
                const res = await fetch(`/api/clients/${clientId}/services`);
                const data = await res.json();
                const service = data.services.find(s => s.serviceId === serviceId);
                const details = service.details || {};
                
                document.getElementById('detail-company').innerText = service.companyName || 'Service Details';
                document.getElementById('detail-date').innerText = service.serviceType;

                let html = `
                    <div class="detail-section">
                        <div class="section-title">Company Info</div>
                        <div class="space-y-2">
                            <div class="info-item"><span class="info-label">Proposed Name</span><span class="info-value">${details.names?.[0] || '-'}</span></div>
                            <div class="info-item"><span class="info-label">Activity</span><span class="info-value">${details.activities?.primary || '-'}</span></div>
                        </div>
                    </div>
                    <div class="detail-section">
                        <div class="section-title">Capital & Structure</div>
                        <div class="space-y-2">
                            <div class="info-item"><span class="info-label">Issued Capital</span><span class="info-value">${details.capital?.currency} ${details.capital?.issued}</span></div>
                            <div class="info-item"><span class="info-label">Shares</span><span class="info-value">${details.capital?.numShares}</span></div>
                        </div>
                    </div>
                    <div class="detail-section">
                        <div class="section-title">Directors</div>
                        <div class="space-y-3">
                            ${details.directors?.map(d => `<div class="p-3 bg-white/40 rounded-lg text-sm"><strong>${d.name}</strong><br><span class="text-xs text-slate-500">${d.idType} • ${d.nation}</span></div>`).join('')}
                        </div>
                    </div>
                `;
                document.getElementById('detail-body').innerHTML = html;
                document.getElementById('panel-footer').style.display = 'flex';
                lucide.createIcons();
            } catch(e) { console.error(e); }
        }

        function closePanel() {
            document.getElementById('panel-overlay').classList.remove('open');
            document.getElementById('detail-panel').classList.remove('open');
            currentClientId = null;
            currentServiceId = null;
        }

        function openModal(action) {
            pendingAction = action;
            document.getElementById('modal-title').innerText = action === 'approved' ? 'Approve Service' : 'Reject Service';
            document.getElementById('modal-confirm-btn').className = action === 'approved' ? 'btn btn-primary' : 'btn btn-outline text-red-600';
            document.getElementById('action-modal').classList.add('opacity-100', 'pointer-events-auto');
            document.getElementById('action-modal').querySelector('.transform').classList.remove('scale-90');
        }

        function closeModal() {
            document.getElementById('action-modal').classList.remove('opacity-100', 'pointer-events-auto');
            document.getElementById('action-modal').querySelector('.transform').classList.add('scale-90');
        }

        async function confirmAction() {
            if (!currentServiceId) return;
            try {
                const res = await fetch(`/api/services/${currentServiceId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: pendingAction })
                });
                if (res.ok) {
                    closeModal();
                    closePanel();
                    fetchDashboard();
                }
            } catch(e) { console.error(e); }
        }

        // --- Module: Applications ---
        async function renderApplications() {
            const container = document.getElementById('module-content');
            container.innerHTML = `<div class="glass-card overflow-hidden bg-white/40 backdrop-blur-xl border border-white/60 rounded-2xl"><table class="admin-table" id="apps-table">
                <thead><tr><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Client</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Company</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Service</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Status</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Date</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Action</th></tr></thead>
                <tbody id="apps-body"></tbody></table></div>`;
            
            try {
                const res = await fetch('/api/applications');
                const apps = await res.json();
                const search = document.getElementById('search-input').value.toLowerCase();
                
                const filtered = apps.filter(app => {
                    const matchesFilter = currentFilter === 'all' || app.status === currentFilter;
                    const matchesSearch = app.clientName.toLowerCase().includes(search) || (app.companyName || '').toLowerCase().includes(search);
                    return matchesFilter && matchesSearch;
                });

                const body = document.getElementById('apps-body');
                body.innerHTML = filtered.map(app => {
                    const props = getStatusProps(app.status);
                    return `<tr class="hover:bg-white/40 transition-colors">
                        <td class="p-4 font-semibold text-slate-800">${app.clientName}</td>
                        <td class="p-4 text-slate-600">${app.companyName || 'N/A'}</td>
                        <td class="p-4 text-slate-600">${app.serviceType}</td>
                        <td class="p-4"><span class="status-badge ${props.class}">${props.text}</span></td>
                        <td class="p-4 text-slate-500 text-xs">${app.date}</td>
                        <td class="p-4"><button class="btn btn-outline py-1 px-3 text-xs" onclick="openClientProfile('${app.clientId}')">View</button></td>
                    </tr>`;
                }).join('');
            } catch(e) { console.error(e); }
        }

        // --- Module: KYC Review ---
        async function renderKYC() {
            const container = document.getElementById('module-content');
            container.innerHTML = `<div class="glass-card overflow-hidden bg-white/40 backdrop-blur-xl border border-white/60 rounded-2xl"><table class="admin-table">
                <thead><tr><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Client</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Risk Level</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Docs Status</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Status</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Action</th></tr></thead>
                <tbody id="kyc-body"></tbody></table></div>`;
            
            try {
                const res = await fetch('/api/kyc');
                const data = await res.json();
                const body = document.getElementById('kyc-body');
                body.innerHTML = data.map(k => {
                    const statusProps = getStatusProps(k.status === 'verified' ? 'approved' : k.status);
                    return `<tr class="hover:bg-white/40 transition-colors">
                        <td class="p-4 font-semibold text-slate-800">${k.clientName}</td>
                        <td class="p-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${k.riskLevel === 'Low' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}">${k.riskLevel}</span></td>
                        <td class="p-4 text-xs text-slate-500">${k.documents.length} Docs (${k.documents.filter(d => d.status === 'Verified').length} Verified)</td>
                        <td class="p-4"><span class="status-badge ${statusProps.class}">${k.status}</span></td>
                        <td class="p-4"><button class="btn btn-primary py-1 px-3 text-xs" onclick="openClientProfile('${k.clientId}')">Review</button></td>
                    </tr>`;
                }).join('');
            } catch(e) { console.error(e); }
        }

        // --- Module: Compliance ---
        async function renderCompliance() {
            const container = document.getElementById('module-content');
            container.innerHTML = `<div class="glass-card overflow-hidden bg-white/40 backdrop-blur-xl border border-white/60 rounded-2xl"><table class="admin-table">
                <thead><tr><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Client</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Status</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Flags</th><th class="p-4 text-left text-xs font-bold text-slate-400 uppercase">Action</th></tr></thead>
                <tbody id="compliance-body"></tbody></table></div>`;
            
            try {
                const res = await fetch('/api/compliance');
                const data = await res.json();
                const body = document.getElementById('compliance-body');
                body.innerHTML = data.map(c => {
                    const statusProps = getStatusProps(c.status === 'compliant' ? 'approved' : 'pending');
                    return `<tr class="hover:bg-white/40 transition-colors">
                        <td class="p-4 font-semibold text-slate-800">${c.clientName}</td>
                        <td class="p-4"><span class="status-badge ${statusProps.class}">${c.status}</span></td>
                        <td class="p-4 text-xs text-slate-500">${c.flags.length > 0 ? c.flags.join(', ') : 'None'}</td>
                        <td class="p-4"><button class="btn btn-outline py-1 px-3 text-xs" onclick="openClientProfile('${c.clientId}')">Manage</button></td>
                    </tr>`;
                }).join('');
            } catch(e) { console.error(e); }
        }

        // --- Module: Blogs ---
        async function renderBlogs() {
            const container = document.getElementById('module-content');
            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold font-outfit text-slate-900">Blog Management</h2>
                    <button class="btn btn-primary px-4 py-2 text-sm" onclick="alert('Blog Creation Coming Soon')"><i data-lucide="plus" class="w-4 h-4"></i> Create New Post</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="blogs-list"></div>
            `;
            
            try {
                const res = await fetch('/api/blogs');
                const data = await res.json();
                const list = document.getElementById('blogs-list');
                list.innerHTML = data.map(blog => `
                    <div class="client-card group">
                        <div class="text-[10px] font-bold text-blue-600 uppercase mb-2">${blog.category || 'Update'}</div>
                        <h3 class="font-bold text-slate-900 mb-2 line-clamp-2">${blog.title}</h3>
                        <p class="text-xs text-slate-500 mb-4 line-clamp-2">${blog.description}</p>
                        <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                            <span class="text-[10px] text-slate-400 font-bold">${new Date(blog.date || blog.createdAt).toLocaleDateString()}</span>
                            <span class="text-[10px] font-bold uppercase tracking-wider ${blog.published ? 'text-emerald-600' : 'text-amber-600'}">${blog.published ? 'Published' : 'Draft'}</span>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            } catch(e) { console.error(e); }
        }

        // --- Module: Reports ---
        async function renderReports() {
            const container = document.getElementById('module-content');
            try {
                const res = await fetch('/api/reports');
                const data = await res.json();
                
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="stat-card">
                            <div class="text-[10px] font-bold text-slate-400 uppercase mb-2">Total Revenue (Est.)</div>
                            <div class="text-3xl font-bold text-slate-900">SGD ${data.revenue?.toLocaleString() || 0}</div>
                        </div>
                        <div class="stat-card">
                            <div class="text-[10px] font-bold text-slate-400 uppercase mb-2">Success Rate</div>
                            <div class="text-3xl font-bold text-emerald-600">${Math.round((data.approved/data.totalApplications)*100) || 0}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="text-[10px] font-bold text-slate-400 uppercase mb-2">Pending KYC</div>
                            <div class="text-3xl font-bold text-amber-600">${data.pendingKYC || 0}</div>
                        </div>
                    </div>
                    <div class="glass-card p-8 bg-white/40 rounded-2xl border border-white/80">
                        <h3 class="font-bold text-slate-800 mb-4">Service Distribution</h3>
                        <div class="space-y-4">
                            ${Object.entries(data.byService || {}).map(([name, count]) => `
                                <div>
                                    <div class="flex justify-between text-xs font-bold mb-1"><span class="text-slate-600">${name}</span><span class="text-slate-900">${count}</span></div>
                                    <div class="w-full bg-slate-200/50 h-2 rounded-full overflow-hidden"><div class="bg-indigo-500 h-full" style="width: ${(count/data.totalApplications*100)}%"></div></div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                lucide.createIcons();
            } catch(e) { console.error(e); }
        }

        function updateNotifications() {
            const list = document.getElementById('notifications-list');
            const pending = clientsData.filter(c => c.latestStatus === 'pending');
            const badge = document.getElementById('notification-badge');
            
            if (pending.length > 0) badge.classList.remove('hidden');
            else badge.classList.add('hidden');

            list.innerHTML = pending.map(c => `
                <div class="p-4 border-b border-slate-100 hover:bg-slate-50 cursor-pointer" onclick="openClientProfile('${c.clientId}')">
                    <div class="text-sm font-bold text-slate-800">New Application</div>
                    <div class="text-xs text-slate-500">${c.name} submitted a request.</div>
                </div>
            `).join('') || '<div class="p-8 text-center text-slate-400 text-xs">No new notifications</div>';
        }

        function toggleNotifications(e) {
            e.stopPropagation();
            const d = document.getElementById('notifications-dropdown');
            d.classList.toggle('opacity-0');
            d.classList.toggle('pointer-events-none');
            d.classList.toggle('scale-95');
        }

        document.addEventListener('click', () => {
            const d = document.getElementById('notifications-dropdown');
            d.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
        });

        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderClients();
            });
        });

        // Start
        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
