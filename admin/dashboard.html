<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

    <script>
        // Authentication Check
        if (!localStorage.getItem('admin_auth')) {
            window.location.href = '/auth.html';
        } else {
            try {
                const auth = JSON.parse(localStorage.getItem('admin_auth'));
                if (auth.role !== 'admin') window.location.href = '/auth.html';
            } catch(e) {
                window.location.href = '/auth.html';
            }
        }

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { 
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' },
                        primary: '#0f172a', accent: '#3b82f6' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%);
            background-attachment: fixed;

            overflow-x: hidden; 
        }
        
        .top-nav { height: 60px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1.5rem; z-index: 9999; gap: 0.5rem; pointer-events: auto; justify-content: space-between; }

        #module-switcher {

    <script>
        function logout() {
            localStorage.removeItem('admin_auth');
            localStorage.removeItem('token');
            window.location.href = '/auth.html';
        }

        function safeCreateIcons() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.warn('Lucide icons library is not loaded.');
            }
        }

        let clientsData = [];
        let statsData = {};
        let currentModule = 'clients';
        let currentFilter = 'all';
        let currentClientId = null;
        let currentServiceId = null;
        let notifications = [];
        let pendingAction = null;
        let activeClickOutsideHandler = null;
        let activeScrollHandler = null;
        let activeEditorAppId = null;

        // Initialization
        async function init() {
            console.log('Dashboard Initializing...');
            safeCreateIcons();
            handleRouting();
            await fetchDashboard();
            
            // Polling
            setInterval(() => {
                if (!currentClientId) fetchDashboard();
            }, 15000);

            // Cross-tab sync storage event listener
            window.addEventListener('storage', (e) => {
                if (e.key === 'globalisor_app_seq_map') {
                    try {
                        window.appSeqMap = JSON.parse(e.newValue);
                        if (currentModule === 'clients') renderClients();
                        else if (currentModule === 'applications') renderApplications();
                    } catch (err) { console.error(err); }
                } else if (e.key && e.key.startsWith('assigned_staff_')) {
                    fetchDashboard().then(() => {
                        if (currentModule === 'applications') renderApplications();
                    });
                }
            });
        }

        function initDraggable() {
            const container = document.getElementById('main-dashboard-grid');
            if (!container) return;

            let draggedItem = null;

            container.addEventListener('dragstart', (e) => {
                const widget = e.target.closest('.draggable-widget');
                if (widget) {
                    draggedItem = widget;
                    widget.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                }
            });

            container.addEventListener('dragend', (e) => {
                if (draggedItem) {
                    draggedItem.classList.remove('dragging');
                    draggedItem = null;
                }
            });

            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                const afterElement = getDragAfterElement(container, e.clientY);
                if (afterElement == null) {
                    container.appendChild(draggedItem);
                } else {
                    container.insertBefore(draggedItem, afterElement);
                }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.draggable-widget:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        window.navigateTo = function(path) {
            console.log('Navigating to:', path);
            try {
                history.pushState(null, null, path);
            } catch(e) {
                console.warn('URL update failed (local file mode):', e);
            }
            
            // Extract module from path
            let module = 'clients';
            if (path.includes('applications')) module = 'applications';
            else if (path.includes('kyc')) module = 'kyc';
            else if (path.includes('compliance')) module = 'compliance';
            else if (path.includes('blogs')) module = 'blogs';
            else if (path.includes('content')) module = 'content';
            else if (path.includes('reports')) module = 'reports';
            else if (path.includes('users')) module = 'users';
            
            switchModule(module);
        }

        window.onpopstate = handleRouting;

        function handleRouting() {
            const path = window.location.pathname;
            let module = 'clients';
            if (path.includes('/admin/applications')) module = 'applications';
            else if (path.includes('/admin/kyc')) module = 'kyc';
            else if (path.includes('/admin/compliance')) module = 'compliance';
            else if (path.includes('/admin/blogs')) module = 'blogs';
            else if (path.includes('/admin/content')) module = 'content';
            else if (path.includes('/admin/reports')) module = 'reports';
            else if (path.includes('/admin/users')) module = 'users';
            
            switchModule(module);
        }

        function switchModule(module) {
            currentModule = module;
            document.querySelectorAll('.module-nav-btn').forEach(btn => {
                const isMatch = btn.id === 'btn-' + module;
                btn.classList.toggle('active', isMatch);
            });
            
            const filters = document.getElementById('filter-tabs');
            if (filters) filters.style.display = (module === 'clients' || module === 'applications') ? 'flex' : 'none';
            
            // Search visibility
            const searchContainer = document.querySelector('.relative.w-64');
            if (searchContainer) searchContainer.style.display = (module === 'clients' || module === 'applications') ? 'block' : 'none';

            refreshView();
        }

        async function refreshView() {
            const container = document.getElementById('module-content');
            if (!container) return;

            if (currentModule === 'clients') {
                container.innerHTML = `
                    <div id="dashboard-home-view">
                        <div class="draggable-container" id="main-dashboard-grid">
                            <div class="lg:col-span-3 draggable-widget" draggable="true" id="widget-clients">

                await renderKYC();

        async function fetchDashboard() {
            console.log('fetchDashboard triggered');
            try {
                const res = await fetch('/api/dashboard');
                if (!res.ok) throw new Error('API Error: ' + res.status);
                const data = await res.json();
                console.log('Dashboard Data Received:', data);
                clientsData = data.clients || [];
                statsData = data.stats || {};
                
                renderStats();
                if (currentModule === 'clients') renderClients();
                updateNotifications();
            } catch(e) {
                console.error('Fetch failed in dashboard:', e);
            }
        }

        function renderStats() {
            document.getElementById('stat-total').innerText = statsData.totalClients || 0;
            document.getElementById('stat-services').innerText = statsData.totalServices || 0;
            document.getElementById('stat-pending').innerText = statsData.pending || 0;
            document.getElementById('stat-approved').innerText = statsData.approved || 0;
            document.getElementById('stat-rejected').innerText = statsData.rejected || 0;
        }

        function getStatusProps(status) {
            const s = (status || 'pending').toLowerCase();
            if (s === 'pending') return { class: 'status-pending', text: 'Pending', key: 'pending' };
            if (s === 'review' || s === 'under review') return { class: 'status-review', text: 'In Review', key: 'review' };
            if (s === 'approved' || s === 'verified') return { class: 'status-approved', text: 'Approved', key: 'approved' };
            if (s === 'completed') return { class: 'status-completed', text: 'Completed', key: 'completed' };
            if (s === 'rejected') return { class: 'status-rejected', text: 'Rejected', key: 'rejected' };
            return { class: 'status-pending', text: s, key: 'pending' };
        }

        function renderClients() {
            const grid = document.getElementById('clients-grid');
            if (!grid) return;
            
            // Build sequence mapping based on creation order (ascending clientId hex string)
            const sortedIds = (clientsData || []).map(cl => cl.clientId).filter(Boolean).sort();
            window.clientSeqMap = {};
            sortedIds.forEach((id, index) => {
                window.clientSeqMap[id] = 101 + index;
            });
            
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = clientsData.filter(c => {
                const statusLower = (c.latestStatus || '').toLowerCase();
                const matchesFilter = currentFilter === 'all' || 
                                     (currentFilter === 'review' && (statusLower === 'review' || statusLower === 'under review')) ||
                                     (currentFilter === 'approved' && (statusLower === 'approved' || statusLower === 'verified' || statusLower === 'completed')) ||
                                     statusLower === currentFilter;
                const matchesSearch = c.name.toLowerCase().includes(search) || 
                                     c.email.toLowerCase().includes(search) ||
                                     (c.companyNames && c.companyNames.some(name => name.toLowerCase().includes(search)));
                return matchesFilter && matchesSearch;
            });

            grid.innerHTML = filtered.map(c => {

                            const year = activeDate.getFullYear();

                            const minutes = String(activeDate.getMinutes()).padStart(2, '0');
                            const seconds = String(activeDate.getSeconds()).padStart(2, '0');

                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                ${c.name}

                        <!-- Email row -->
                        <div class="flex items-center gap-1.5 mb-3 text-xs text-slate-500 truncate">
                            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>

                            <div class="flex items-center gap-1.5">

                                <span class="text-[10px] text-slate-500 font-semibold truncate max-w-[80px]">${staff}</span>
                            </div>
                        </div>

                        <!-- Status mini progress bar -->
                        ${totalSvcs > 0 ? `

        window.filterApplications = function() {
            const statusFilter = document.getElementById('filter-status').value;
            const priorityFilter = document.getElementById('filter-priority').value;
            const searchQuery = (document.getElementById('app-search-input')?.value || '').toLowerCase();
            
            const filteredData = (window.allApplications || []).map((app, originalIndex) => ({...app, originalIndex})).filter(app => {
                const s = app.status || 'Pending';
                const p = app.priority || 'Normal';
                const statusMatch = statusFilter === 'All' || s.toLowerCase() === statusFilter.toLowerCase();
                const priorityMatch = priorityFilter === 'All' || p.toLowerCase() === priorityFilter.toLowerCase();
                
                const idMatch = String(app.originalIndex + 1).includes(searchQuery);
                const businessMatch = (app.business || '').toLowerCase().includes(searchQuery);
                const clientMatch = (app.client || '').toLowerCase().includes(searchQuery);
                const searchMatch = !searchQuery || idMatch || businessMatch || clientMatch;

                return statusMatch && priorityMatch && searchMatch;
            });
            renderApplicationsTable(filteredData);
        };

        function renderApplicationsTable(data) {
            const tbody = document.getElementById('applications-table-body');

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="p-12 text-center text-slate-400 italic">No applications found matching criteria</td></tr>';
                return;
            }
            tbody.innerHTML = data.map((app, idx) => {
                const status = (app.status || 'pending').toLowerCase();
                let statusClass = 'bg-slate-100 text-slate-600';
                if (status === 'pending') statusClass = 'bg-blue-50/80 text-blue-600';
                else if (status === 'in progress' || status === 'under review' || status === 'review') statusClass = 'bg-amber-50/80 text-amber-600';
                else if (status === 'completed' || status === 'approved') statusClass = 'bg-emerald-50/80 text-emerald-600';
                else if (status === 'rejected') statusClass = 'bg-red-50/80 text-red-600';
                
                let currentAssigned = localStorage.getItem('assigned_staff_' + app.id);
                if (currentAssigned === null) {
                    const rawStaff = app.staff || '';
                    if (!rawStaff || rawStaff.toLowerCase() === 'sarah lim' || rawStaff.toLowerCase() === 'unassigned') {
                        currentAssigned = 'Unassigned';
                    } else {
                        currentAssigned = rawStaff;
                    }
                }
                const isUnassigned = !currentAssigned || currentAssigned.toLowerCase() === 'unassigned';
                const displayClass = isUnassigned ? 'text-slate-400 italic' : 'text-emerald-600';
                const displayName = isUnassigned ? 'Unassigned' : currentAssigned;
                const displayId = window.appSeqMap?.[app.id] || (app.originalIndex !== undefined ? app.originalIndex + 1 : idx + 1);

            let highlightedIndex = 0;
            let options = [];

            const renderList = (query = '') => {
                const filtered = staffNames.filter(name => name.toLowerCase().includes(query.toLowerCase()));
                options = ['Unassigned', ...filtered];

                if (highlightedIndex >= options.length) {
                    highlightedIndex = Math.max(0, options.length - 1);
                }

                let itemsHtml = '';
                options.forEach((name, idx) => {
                    const isSelected = (!name || name === 'Unassigned')
                        ? (!currentStaff || currentStaff.toLowerCase() === 'unassigned')
                        : (currentStaff && currentStaff.toLowerCase() === name.toLowerCase());
                    
                    const isHighlighted = idx === highlightedIndex;
                    const initial = name === 'Unassigned' ? 'U' : (name.charAt(0).toUpperCase() + (name.split(' ')[1] ? name.split(' ')[1].charAt(0).toUpperCase() : ''));
                    const isUnassigned = name === 'Unassigned';

                    let bgClass = 'border-transparent hover:bg-slate-50';
                    if (isHighlighted) {
                        bgClass = 'bg-sky-100 border-sky-400 shadow-sm';

                        bgClass = 'border-blue-500 bg-blue-50/30';

                    itemsHtml += `

                        </div>
                    `;
                });

                listContainer.innerHTML = itemsHtml;
            };

            const handleKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    highlightedIndex = (highlightedIndex + 1) % options.length;
                    renderList(searchInput.value);
                    const activeEl = listContainer.querySelector(`[data-index="${highlightedIndex}"]`);
                    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    highlightedIndex = (highlightedIndex - 1 + options.length) % options.length;
                    renderList(searchInput.value);
                    const activeEl = listContainer.querySelector(`[data-index="${highlightedIndex}"]`);
                    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (options[highlightedIndex]) {

                    }
                } else if (e.key === 'Escape') {

                    window.closeReassignModal();

            };

            searchInput.addEventListener('keydown', handleKeyDown);
            const observer = new MutationObserver(() => {
                if (!document.getElementById('reassign-modal')) {
                    searchInput.removeEventListener('keydown', handleKeyDown);
                    observer.disconnect();
                }
            });
            observer.observe(document.body, { childList: true });

            searchInput.addEventListener('input', (e) => {
                highlightedIndex = 0;
                renderList(e.target.value);
            });
            renderList('');
            setTimeout(() => searchInput.focus(), 100);
        }

        window.saveStaffAssignment = async function(appId, name) {
            const isUnassigned = !name || name.toLowerCase() === 'unassigned';
            if (!isUnassigned && !staffNames.includes(name)) {
                alert("Cannot assign: " + name + " is not a valid staff member.");
                return;
            }

            // Store name
            localStorage.setItem('assigned_staff_' + appId, isUnassigned ? 'Unassigned' : name);

            // Also store email as unique identifier for reliable cross-matching
            try {
                if (isUnassigned) {
                    localStorage.removeItem('assigned_staff_email_' + appId);
                } else {
                    const localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
                    const staffMember = localAccounts.find(s => `${s.firstName} ${s.lastName}`.toLowerCase() === name.toLowerCase());
                    if (staffMember && staffMember.email) {
                        localStorage.setItem('assigned_staff_email_' + appId, staffMember.email.toLowerCase());
                    } else {
                        localStorage.removeItem('assigned_staff_email_' + appId);
                    }
                }
            } catch (e) { console.warn('Could not look up staff email', e); }

            // Tear down editor state cleanly and render updated cell
            closeActiveEditor();
            renderStaffCell(appId, isUnassigned ? 'Unassigned' : name);

            try {
                await fetch(`/api/services/${appId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staff: isUnassigned ? 'Unassigned' : name })
                });
            } catch (e) { console.warn("Backend sync failed, saved locally.", e); }
        }

        function generateStaffClientSide(firstName, lastName) {
            const baseEmail = (firstName + "." + lastName).toLowerCase().replace(/[^a-z0-9]/g, "");
            let email = baseEmail + "@globalisor.com";
            
            let localAccounts = [];
            try {
                localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
            } catch (e) {
                console.error("Error reading local_staff_accounts", e);
            }
            
            let suffix = 1;
            while (localAccounts.some(acc => acc.email === email)) {
                email = baseEmail + suffix + "@globalisor.com";
                suffix++;
            }
            
            const randomNum = Math.floor(Math.random() * 9000) + 1000;
            const password = "Glob-" + randomNum;
            
            const newStaff = {
                id: "local_" + (localAccounts.length + 1),
                firstName: firstName,
                lastName: lastName,
                email: email,
                password: password,
                role: "STAFF"
            };
            
            localAccounts.push(newStaff);
            localStorage.setItem('local_staff_accounts', JSON.stringify(localAccounts));
            return newStaff;
        }

        const EYE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const EYE_OFF_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;
        const COPY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

        window.togglePasswordVisibility = function(id, password) {
            const textSpan = document.getElementById(`pass-text-${id}`);
            const btn = document.getElementById(`pass-btn-${id}`);
            if (!textSpan || !btn) return;
            
            const isHidden = textSpan.innerText === '••••••••';
            if (isHidden) {
                textSpan.innerText = password || 'Glob-••••';
                btn.innerHTML = EYE_OFF_SVG;
            } else {
                textSpan.innerText = '••••••••';
                btn.innerHTML = EYE_SVG;
            }
        }

        window.copyEmail = function(email) {
            navigator.clipboard.writeText(email).then(() => {
                // Success
            }).catch(err => console.error("Could not copy email", err));
        }

        window.copyPassword = function(id, password) {
            const val = password || '';
            if (!val) {
                alert("No plain password available to copy.");
                return;
            }
            navigator.clipboard.writeText(val).then(() => {
                // Success
            }).catch(err => console.error("Could not copy password", err));
        }

        window.fetchStaffList = async function() {
            let remoteStaff = [];
            let fetchError = false;
            try {
                const authObj = JSON.parse(localStorage.getItem('admin_auth') || '{}');
                const token = authObj.token;
                const res = await fetch('/api/admin/staff', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    remoteStaff = await res.json();
                } else {
                    fetchError = true;
                }
            } catch (e) {
                console.error(e);
                fetchError = true;
            }
            
            let localAccounts = [];
            try {
                localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
            } catch (e) {
                console.error("Error reading local_staff_accounts", e);
            }
            
            const mergedMap = new Map();
            remoteStaff.forEach(s => {
                mergedMap.set(s.email, {
                    id: s.id,
                    firstName: s.firstName,
                    lastName: s.lastName,
                    email: s.email,
                    password: s.password || ''
                });
            });
            
            localAccounts.forEach(s => {
                if (!mergedMap.has(s.email)) {
                    mergedMap.set(s.email, {
                        id: s.id,
                        firstName: s.firstName,
                        lastName: s.lastName,
                        email: s.email,
                        password: s.password || ''
                    });
                }
            });
            
            const mergedList = Array.from(mergedMap.values());
            const tbody = document.getElementById('staff-table-body');
            if (!tbody) return;
            
            if (mergedList.length === 0) {
                if (fetchError && localAccounts.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-red-500 font-bold">Failed to load staff directory (API error)</td></tr>`;
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-slate-400">No staff members found</td></tr>`;
                }
                return;
            }
            
            tbody.innerHTML = mergedList.map((staff, idx) => `
                <tr class="hover:bg-white/40 transition-colors">
                    <td class="px-6 py-4 font-bold text-blue-600 text-xs">${idx + 1}</td>
                    <td class="px-6 py-4 font-bold text-slate-800 font-outfit">${staff.firstName} ${staff.lastName}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center justify-between gap-2 mr-4">
                            <span class="text-slate-600 font-semibold text-xs">${staff.email}</span>
                            <button onclick="copyEmail('${staff.email}')" class="p-1 hover:bg-slate-200/50 rounded text-slate-400 hover:text-slate-600 transition-colors" title="Copy Email">
                                ${COPY_SVG}
                            </button>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-1.5">
                            <span class="font-mono text-xs text-slate-500 font-semibold" id="pass-text-${staff.id}">••••••••</span>
                            <button id="pass-btn-${staff.id}" onclick="togglePasswordVisibility('${staff.id}', '${staff.password || ''}')" class="p-1 hover:bg-slate-200/50 rounded text-slate-500 transition-colors" title="View Password">
                                ${EYE_SVG}
                            </button>
                            <button onclick="copyPassword('${staff.id}', '${staff.password || ''}')" class="p-1 hover:bg-slate-200/50 rounded text-slate-400 hover:text-slate-600 transition-colors" title="Copy Password">
                                ${COPY_SVG}
                            </button>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-600 uppercase tracking-wider">STAFF</span>
                    </td>
                </tr>
            `).join('');
            if (window.lucide) window.lucide.createIcons();
        }

        window.handleCreateStaff = async function(e) {
            e.preventDefault();
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            
            try {
                const authObj = JSON.parse(localStorage.getItem('admin_auth') || '{}');
                const token = authObj.token;
                const response = await fetch('/api/admin/staff', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ firstName, lastName })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('first-name').value = '';
                    document.getElementById('last-name').value = '';
                    
                    document.getElementById('display-email').innerText = data.email;
                    document.getElementById('display-password').innerText = data.password;
                    
                    openStaffModal();
                    fetchStaffList();
                } else {
                    console.warn("API responded with non-200. Falling back to localStorage.");
                    const fallbackData = generateStaffClientSide(firstName, lastName);
                    document.getElementById('first-name').value = '';
                    document.getElementById('last-name').value = '';
                    
                    document.getElementById('display-email').innerText = fallbackData.email;
                    document.getElementById('display-password').innerText = fallbackData.password;
                    
                    openStaffModal();
                    fetchStaffList();
                }
            } catch (err) {
                console.error("API call failed, falling back to localStorage", err);
                const fallbackData = generateStaffClientSide(firstName, lastName);
                document.getElementById('first-name').value = '';
                document.getElementById('last-name').value = '';
                
                document.getElementById('display-email').innerText = fallbackData.email;
                document.getElementById('display-password').innerText = fallbackData.password;
                
                openStaffModal();
                fetchStaffList();
            }
        }

        window.openStaffModal = function() {
            const modal = document.getElementById('credentials-modal');
            modal.classList.remove('hidden');
            modal.offsetHeight; // force reflow
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.remove('scale-90');
            modal.classList.add('opacity-100', 'pointer-events-auto');
        }

        window.closeStaffModal = function() {
            const modal = document.getElementById('credentials-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.add('scale-90');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        window.copyStaffText = function(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
        }

        window.toggleSubmenu = function(id) {
            const submenu = document.getElementById(id);
            const btn = document.getElementById('btn-services');
            if (submenu) {
                const isOpen = !submenu.classList.contains('hidden');
                if (isOpen) {
                    submenu.classList.add('hidden');
                    btn.classList.remove('submenu-open');
                } else {
                    submenu.classList.remove('hidden');
                    btn.classList.add('submenu-open');
                }
            }
        }

        // Start
        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
