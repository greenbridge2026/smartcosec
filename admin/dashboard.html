<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | Globalisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script>
        // Authentication Check
        if (!localStorage.getItem('admin_auth')) {
            window.location.href = '/admin';
        } else {
            try {
                const auth = JSON.parse(localStorage.getItem('admin_auth'));
                if (auth.role !== 'admin') window.location.href = '/admin';
            } catch(e) {
                window.location.href = '/admin';
            }
        }

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { 
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' },
                        primary: '#0f172a', accent: '#3b82f6' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden; 
        }
        
        .top-nav { height: 60px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1rem; z-index: 9999; gap: 0.5rem; pointer-events: auto; justify-content: space-between; }
        .main-container { padding: 1.5rem; max-width: 1600px; margin-left: auto; margin-right: auto; }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(1, minmax(0, 1fr)); 
            gap: 0.75rem; 
            margin-bottom: 1.5rem; 
        }
        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (min-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }
        .stat-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); padding: 0.85rem 1rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .stat-card.highlight { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border: none; }
        .stat-card.highlight * { color: white !important; }
        
        .module-nav-btn { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.75rem; border-radius: 8px; font-size: 0.8rem; font-weight: 500; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; pointer-events: auto !important; }
        .module-nav-btn:hover { color: #0f172a; background: rgba(255,255,255,0.6); }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        #module-switcher { display: flex; gap: 4px; }

        .filter-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .filter-tab { padding: 0.75rem 0.5rem; font-size: 0.85rem; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .filter-tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }

        .client-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); padding: 1.5rem; border-radius: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; overflow: hidden; }
        .client-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); background: rgba(255, 255, 255, 0.8); border-color: white; }
        
        .status-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.75rem; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
        .status-pending { background: #eff6ff; color: #2563eb; }
        .status-review { background: #fffbeb; color: #d97706; }
        .status-approved { background: #f0fdf4; color: #16a34a; }
        .status-rejected { background: #fef2f2; color: #dc2626; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .glass-panel { position: fixed; top: 0; right: -100%; width: 600px; height: 100vh; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(30px); box-shadow: -10px 0 50px rgba(0,0,0,0.1); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; display: flex; flex-direction: column; }
        .glass-panel.open { right: 0; }
        .panel-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.1); backdrop-filter: blur(4px); z-index: 1999; display: none; }
        .panel-overlay.open { display: block; }
        
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.4) 25%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0.4) 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: 12px; font-weight: 600; transition: all 0.2s; cursor: pointer; border: none; }
        .btn-primary { background: #0f172a; color: white; }
        .btn-primary:hover { background: #1e293b; transform: scale(1.02); }
        .btn-outline { background: white; border: 1px solid #e2e8f0; color: #64748b; }
        .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; color: #0f172a; }
        
        .detail-section { background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section-title { font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .info-item { display: flex; justify-content: space-between; align-items: center; padding-top: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .info-label { font-size: 0.8rem; color: #94a3b8; }
        .info-value { font-size: 0.85rem; font-weight: 600; color: #334155; }

        /* Draggable Styles */
        .draggable-container { display: flex; flex-direction: column; gap: 1.5rem; }
        @media (min-width: 1024px) {
            .draggable-container { display: grid; grid-template-columns: repeat(3, 1fr); }
        }
        .drag-handle { cursor: grab; opacity: 0; transition: opacity 0.2s; }
        .draggable-widget:hover .drag-handle { opacity: 1; }
        .draggable-widget.dragging { opacity: 0.5; border: 2px dashed #3b82f6; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="flex items-center gap-4">
            <div class="flex flex-col leading-none cursor-pointer" onclick="navigateTo('/admin/clients')">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Admin</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Dashboard</span>
            </div>
            <div class="relative w-48">

            </div>
        </div>

        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="window.location.href='dashboard.html'" class="module-nav-btn active" id="btn-clients"><i data-lucide="users" class="w-4 h-4"></i> Clients</button>
            <button onclick="window.location.href='applications.html'" class="module-nav-btn" id="btn-applications"><i data-lucide="file-text" class="w-4 h-4"></i> Applications</button>
            <button onclick="window.location.href='kyc.html'" class="module-nav-btn" id="btn-kyc"><i data-lucide="shield-check" class="w-4 h-4"></i> KYC Review</button>
            <button onclick="window.location.href='compliance.html'" class="module-nav-btn" id="btn-compliance"><i data-lucide="balance-scale" class="w-4 h-4"></i> Compliance</button>
            <button onclick="window.location.href='blogs.html'" class="module-nav-btn" id="btn-blogs"><i data-lucide="layout" class="w-4 h-4"></i> Blogs</button>

            <button onclick="window.location.href='reports.html'" class="module-nav-btn" id="btn-reports"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reports</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="btn-messages"><i data-lucide="message-square" class="w-4 h-4"></i> Messages</button>
            <button onclick="window.location.href='users.html'" class="module-nav-btn" id="btn-users"><i data-lucide="user-plus" class="w-4 h-4"></i> Users</button>

        <div class="flex items-center justify-end gap-3 relative">
            <button onclick="fetchDashboard()" class="p-2 text-slate-600 hover:bg-slate-100/50 rounded-full transition-colors" title="Refresh Data">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
            <button id="bell-btn" class="p-2 text-slate-600 hover:bg-slate-100/50 rounded-full transition-colors relative" onclick="toggleNotifications(event)">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span id="notification-badge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white hidden shadow-sm"></span>
            </button>
            <div id="notifications-dropdown" class="absolute top-[60px] right-0 w-80 bg-white/95 backdrop-blur-xl border border-white/60 shadow-xl rounded-xl overflow-hidden flex flex-col z-[100] transition-all opacity-0 pointer-events-none scale-95 origin-top-right">
                <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h3 class="font-semibold text-sm text-slate-800">Notifications</h3>
                    <button class="text-xs text-blue-600" onclick="markAllAsRead(event)">Mark all read</button>
                </div>
                <div id="notifications-list" class="max-h-80 overflow-y-auto"></div>
            </div>
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800">Admin Team</div>

            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="stats-grid">
            <div class="stat-card cursor-pointer hover:bg-white/80 transition-all" onclick="switchModule('clients')">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Total Clients</div>
                <div class="text-2xl font-bold text-slate-900" id="stat-total">0</div>
            </div>
            <div class="stat-card highlight cursor-pointer hover:opacity-90 transition-all" onclick="switchModule('applications')">
                <div class="text-[10px] font-bold text-white/70 uppercase">Total Services</div>
                <div class="text-2xl font-bold text-white" id="stat-services">0</div>
            </div>
            <div class="stat-card cursor-pointer hover:bg-white/80 transition-all" onclick="switchModule('kyc')">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Pending</div>
                <div class="text-2xl font-bold text-blue-600" id="stat-pending">0</div>
            </div>
            <div class="stat-card cursor-pointer hover:bg-white/80 transition-all" onclick="switchModule('compliance')">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Approved</div>
                <div class="text-2xl font-bold text-emerald-600" id="stat-approved">0</div>
            </div>
            <div class="stat-card cursor-pointer hover:bg-white/80 transition-all" onclick="switchModule('reports')">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Rejected</div>
                <div class="text-2xl font-bold text-red-600" id="stat-rejected">0</div>
            </div>
        </div>

        <div id="module-content">
            <div id="dashboard-home-view">
                <div class="draggable-container" id="main-dashboard-grid">
                    <div class="lg:col-span-2 draggable-widget" draggable="true" id="widget-clients">
                        <div class="flex items-center gap-2 mb-4">
                            <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-300 drag-handle"></i>
                            <div id="filter-tabs" class="filter-tabs mb-0 flex-1">
                                <div class="filter-tab active" data-filter="all">All Clients</div>
                                <div class="filter-tab" data-filter="pending">Pending</div>
                                <div class="filter-tab" data-filter="review">Under Review</div>
                                <div class="filter-tab" data-filter="approved">Approved</div>
                            </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="clients-grid"></div>
                    </div>
                    <div class="space-y-6 draggable-widget" draggable="true" id="widget-announcements">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-300 drag-handle"></i>
                                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest">Internal Guidance</h3>
                            </div>
                            <button onclick="switchModule('content')" class="text-[10px] font-bold text-blue-600 hover:underline">Manage All</button>
                        </div>
                        <div id="admin-notices-container" class="space-y-4">
                            <div class="p-8 text-center text-slate-400 bg-white/20 rounded-2xl border border-dashed border-slate-300 text-xs">Loading notices...</div>
                        </div>

                    </div>

        </div>

    <!-- Detail Panel -->
    <div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
    <div class="glass-panel" id="detail-panel">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white/40">
            <div>
                <h2 class="text-2xl font-bold text-slate-900" id="detail-company">Company Name</h2>
                <p class="text-sm text-slate-500" id="detail-date">Client Details</p>
            </div>
            <button class="p-2 hover:bg-slate-100 rounded-full transition-colors" onclick="closePanel()"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6" id="detail-body">
            <!-- Dynamic Content -->
        </div>

        <div class="p-6 bg-white/60 border-t border-slate-100 flex gap-3" id="panel-footer">
            <button class="btn btn-outline flex-1 py-3" onclick="openModal('review')">Mark Review</button>
            <button class="btn btn-outline border-red-200 text-red-600 hover:bg-red-50 flex-1 py-3" onclick="openModal('rejected')">Reject</button>
            <button class="btn btn-primary flex-[2] py-3" onclick="openModal('approved')">Approve Service</button>
        </div>
    </div>

    <!-- Action Modal -->
    <div class="hidden fixed inset-0 z-[3000] flex items-center justify-center pointer-events-none opacity-0 transition-all duration-300" id="action-modal">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto" onclick="closeModal()"></div>
        <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl relative z-10 pointer-events-auto transform scale-90 transition-transform">
            <h3 class="text-xl font-bold mb-2" id="modal-title">Confirm Action</h3>
            <p class="text-slate-600 mb-8" id="modal-desc">Proceed with this update?</p>
            <div class="flex gap-4">
                <button class="btn btn-outline flex-1 py-3" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary flex-1 py-3" id="modal-confirm-btn" onclick="confirmAction()">Proceed</button>
            </div>
        </div>
    </div>
    
    <script>
        function logout() {
            localStorage.removeItem('admin_auth');
            window.location.href = '/admin';
        }

        let clientsData = [];
        let statsData = {};
        let currentModule = 'clients';
        let currentFilter = 'all';
        let currentClientId = null;
        let currentServiceId = null;
        let notifications = [];
        let pendingAction = null;
        let activeClickOutsideHandler = null;
        let activeEditorAppId = null;

        // Initialization
        async function init() {
            console.log('Dashboard Initializing...');
            lucide.createIcons();
            handleRouting();
            
            // Polling
            setInterval(() => {
                if (!currentClientId) fetchDashboard();
            }, 10000);
        }

        function initDraggable() {
            const container = document.getElementById('main-dashboard-grid');
            if (!container) return;

            let draggedItem = null;

            container.addEventListener('dragstart', (e) => {
                const widget = e.target.closest('.draggable-widget');
                if (widget) {
                    draggedItem = widget;
                    widget.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                }
            });

            container.addEventListener('dragend', (e) => {
                if (draggedItem) {
                    draggedItem.classList.remove('dragging');
                    draggedItem = null;
                }
            });

            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                const afterElement = getDragAfterElement(container, e.clientY);
                if (afterElement == null) {
                    container.appendChild(draggedItem);
                } else {
                    container.insertBefore(draggedItem, afterElement);
                }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.draggable-widget:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        window.navigateTo = function(path) {
            console.log('Navigating to:', path);
            try {
                history.pushState(null, null, path);
            } catch(e) {
                console.warn('URL update failed (local file mode):', e);
            }
            
            // Extract module from path
            let module = 'clients';
            if (path.includes('applications')) module = 'applications';
            else if (path.includes('kyc')) module = 'kyc';
            else if (path.includes('compliance')) module = 'compliance';
            else if (path.includes('blogs')) module = 'blogs';
            else if (path.includes('content')) module = 'content';
            else if (path.includes('reports')) module = 'reports';
            else if (path.includes('users')) module = 'users';
            
            switchModule(module);
        }

        window.onpopstate = handleRouting;

        function handleRouting() {
            const path = window.location.pathname;
            let module = 'clients';
            if (path.includes('/admin/applications')) module = 'applications';
            else if (path.includes('/admin/kyc')) module = 'kyc';
            else if (path.includes('/admin/compliance')) module = 'compliance';
            else if (path.includes('/admin/blogs')) module = 'blogs';
            else if (path.includes('/admin/content')) module = 'content';
            else if (path.includes('/admin/reports')) module = 'reports';
            else if (path.includes('/admin/users')) module = 'users';
            
            switchModule(module);
        }

        function switchModule(module) {
            currentModule = module;
            document.querySelectorAll('.module-nav-btn').forEach(btn => {
                const isMatch = btn.id === 'btn-' + module;
                btn.classList.toggle('active', isMatch);
            });
            
            const filters = document.getElementById('filter-tabs');
            if (filters) filters.style.display = (module === 'clients' || module === 'applications') ? 'flex' : 'none';
            
            // Search visibility
            const searchContainer = document.querySelector('.relative.w-64');
            if (searchContainer) searchContainer.style.display = (module === 'clients' || module === 'applications') ? 'block' : 'none';

            refreshView();
        }

        async function refreshView() {
            const container = document.getElementById('module-content');
            if (!container) return;

            if (currentModule === 'clients') {
                container.innerHTML = `
                    <div id="dashboard-home-view">
                        <div class="draggable-container" id="main-dashboard-grid">
                            <div class="lg:col-span-2 draggable-widget" draggable="true" id="widget-clients">
                                <div class="flex items-center gap-2 mb-4">
                                    <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-300 drag-handle"></i>
                                    <div id="filter-tabs" class="filter-tabs mb-0 flex-1">
                                        <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">All Clients</div>
                                        <div class="filter-tab" data-filter="pending" onclick="setFilter('pending')">Pending</div>
                                        <div class="filter-tab" data-filter="review" onclick="setFilter('review')">Under Review</div>
                                        <div class="filter-tab" data-filter="approved" onclick="setFilter('approved')">Approved</div>
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="clients-grid"></div>
                            </div>
                            <div class="space-y-6 draggable-widget" draggable="true" id="widget-announcements">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-300 drag-handle"></i>
                                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest">Internal Guidance</h3>
                                    </div>
                                    <button onclick="switchModule('content')" class="text-[10px] font-bold text-blue-600 hover:underline">Manage All</button>
                                </div>
                                <div id="admin-notices-container" class="space-y-4"></div>
                            </div>
                        </div>
                    </div>
                `;
                await fetchDashboard();
                await renderAdminNotices();
                initDraggable();
            } else if (currentModule === 'applications') {
                await renderApplications();
            } else if (currentModule === 'kyc') {
                await renderKYC();
            } else if (currentModule === 'compliance') {
                await renderCompliance();
            } else if (currentModule === 'blogs') {
                await renderBlogs();
            } else if (currentModule === 'content') {
                await renderStaticContent();
            } else if (currentModule === 'reports') {
                await renderReports();
            } else if (currentModule === 'users') {
                await renderUsers();
            }
            lucide.createIcons();
        }

        async function fetchDashboard() {
            console.log('fetchDashboard triggered');
            try {

        function renderStats() {
            document.getElementById('stat-total').innerText = statsData.totalClients || 0;
            document.getElementById('stat-services').innerText = statsData.totalServices || 0;
            document.getElementById('stat-pending').innerText = statsData.pending || 0;
            document.getElementById('stat-approved').innerText = statsData.approved || 0;
            document.getElementById('stat-rejected').innerText = statsData.rejected || 0;
        }

        function getStatusProps(status) {
            const s = (status || 'pending').toLowerCase();
            if (s === 'pending') return { class: 'status-pending', text: 'Pending' };
            if (s === 'review' || s === 'under review') return { class: 'status-review', text: 'In Review' };
            if (s === 'approved' || s === 'verified') return { class: 'status-approved', text: 'Approved' };
            if (s === 'rejected') return { class: 'status-rejected', text: 'Rejected' };
            return { class: 'status-pending', text: s };
        }

        function renderClients() {
            const grid = document.getElementById('clients-grid');
            if (!grid) return;
            
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = clientsData.filter(c => {
                const matchesFilter = currentFilter === 'all' || 
                                     (currentFilter === 'review' && (c.latestStatus === 'review' || c.latestStatus === 'under review')) ||
                                     c.latestStatus === currentFilter;
                const matchesSearch = c.name.toLowerCase().includes(search) || 
                                     c.email.toLowerCase().includes(search) ||
                                     (c.companyNames && c.companyNames.some(name => name.toLowerCase().includes(search)));
                return matchesFilter && matchesSearch;
            });

            grid.innerHTML = filtered.map(c => {
                const props = getStatusProps(c.latestStatus);
                const companyList = c.companyNames && c.companyNames.length > 0 
                    ? `<div class="text-xs font-bold text-blue-600 bg-blue-50/50 px-2 py-1 rounded border border-blue-100/50 inline-block mb-3">${c.companyNames.join(', ')}</div>` 
                    : `<div class="text-xs font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded border border-slate-100 inline-block mb-3">No associated business</div>`;

                return `
                    <div class="client-card" onclick="openClientProfile('${c.clientId}')">
                        <div class="flex justify-between items-start mb-4">
                            <span class="status-badge ${props.class}">${props.text}</span>

                        </div>

        function openModal(action) {
            pendingAction = action;
            document.getElementById('modal-title').innerText = action === 'approved' ? 'Approve Service' : 'Reject Service';
            document.getElementById('modal-confirm-btn').className = action === 'approved' ? 'btn btn-primary' : 'btn btn-outline text-red-600';
            const modal = document.getElementById('action-modal');
            modal.classList.remove('hidden');
            modal.offsetHeight; // force reflow
            modal.classList.add('opacity-100', 'pointer-events-auto');
            modal.querySelector('.transform').classList.remove('scale-90');
        }

        function closeModal() {
            const modal = document.getElementById('action-modal');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.querySelector('.transform').classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        async function confirmAction() {
            if (!currentServiceId) return;
            try {
                const res = await fetch(`/api/services/${currentServiceId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: pendingAction })
                });
                if (res.ok) {
                    const updatedService = await res.json();
                    closeModal();
                    // Update local state if needed
                    const idx = currentClientServices.findIndex(s => s.serviceId === currentServiceId);
                    if (idx > -1) currentClientServices[idx].status = pendingAction;
                    
                    // Re-render service detail or close panel
                    openServiceDetail(currentServiceId, currentClientId);
                    fetchDashboard();
                }
            } catch(e) { console.error(e); }
        }

        window.filterApplications = function() {
            const statusFilter = document.getElementById('filter-status').value;
            const priorityFilter = document.getElementById('filter-priority').value;
            const searchQuery = (document.getElementById('app-search-input')?.value || '').toLowerCase();
            
            const filteredData = (window.allApplications || []).map((app, originalIndex) => ({...app, originalIndex})).filter(app => {
                const s = app.status || 'Pending';
                const p = app.priority || 'Normal';
                const statusMatch = statusFilter === 'All' || s.toLowerCase() === statusFilter.toLowerCase();
                const priorityMatch = priorityFilter === 'All' || p.toLowerCase() === priorityFilter.toLowerCase();
                
                const idMatch = String(app.originalIndex + 1).includes(searchQuery);
                const businessMatch = (app.business || '').toLowerCase().includes(searchQuery);
                const clientMatch = (app.client || '').toLowerCase().includes(searchQuery);
                const searchMatch = !searchQuery || idMatch || businessMatch || clientMatch;

                return statusMatch && priorityMatch && searchMatch;
            });
            renderApplicationsTable(filteredData);
        };

            document.getElementById('content-form').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const payload = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    content: formData.get('content'),
                    portal: formData.get('portal'),
                    category: formData.get('category'),

                try {

        let staffNames = [];
        let activeClickOutsideHandler = null;
        let activeEditorAppId = null;

        async function loadStaffNames() {
            let remoteStaff = [];
            try {
                const res = await fetch('/api/admin/staff');
                if (res.ok) remoteStaff = await res.json();
            } catch (e) { console.error("Failed to fetch remote staff names", e); }

            let localAccounts = [];
            try {
                localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
            } catch (e) { console.error("Failed to load local staff accounts", e); }

            const namesSet = new Set();
            remoteStaff.forEach(s => { if (s.firstName && s.lastName) namesSet.add(`${s.firstName} ${s.lastName}`); });
            localAccounts.forEach(s => { if (s.firstName && s.lastName) namesSet.add(`${s.firstName} ${s.lastName}`); });
            staffNames = Array.from(namesSet);
        }

        function renderStaffCell(appId, staffName) {
            const cell = document.getElementById(`staff-cell-${appId}`);
            if (!cell) return;
            const displayClass = staffName ? 'text-emerald-600' : 'text-slate-400 italic';
            cell.innerHTML = `<span onclick="enableStaffEdit('${appId}', '${staffName}')" class="${displayClass} font-bold text-xs hover:underline cursor-pointer">${staffName || 'Unassigned'}</span>`;
        }

        function closeActiveEditor() {
            if (activeEditorAppId) {
                const prevId = activeEditorAppId;
                const prevStaff = localStorage.getItem('assigned_staff_' + prevId) || '';
                if (activeClickOutsideHandler) {
                    document.removeEventListener('mousedown', activeClickOutsideHandler);
                    activeClickOutsideHandler = null;
                }
                if (activeScrollHandler) {
                    window.removeEventListener('scroll', activeScrollHandler, true);
                    activeScrollHandler = null;
                }
                const portal = document.getElementById(`staff-list-${prevId}`);
                if (portal) portal.remove();
                activeEditorAppId = null;
                renderStaffCell(prevId, prevStaff);
            }
        }

        window.enableStaffEdit = function(appId, currentStaff) {
            if (activeEditorAppId === appId) return;
            closeActiveEditor();

            const cell = document.getElementById(`staff-cell-${appId}`);
            if (!cell) return;

            let highlightIndex = -1;
            let filteredNames = [];

            cell.innerHTML = `
                <div id="staff-editor-${appId}" style="min-width:190px">
                    <div class="flex items-center gap-1.5 border-2 border-blue-500 rounded-xl bg-white shadow-lg px-2.5 py-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input type="text" id="staff-input-${appId}" value="" class="w-full bg-transparent outline-none text-xs font-semibold text-slate-700 placeholder-slate-300 min-w-0" autocomplete="off" placeholder="Search staff...">
                    </div>
                </div>
            `;
            
            const portal = document.createElement('div');
            portal.id = `staff-list-${appId}`;
            portal.className = "fixed z-[9999] bg-white border border-slate-200 rounded-2xl shadow-2xl hidden overflow-hidden";
            portal.style.minWidth = "200px";
            portal.innerHTML = `
                <div class="px-3 py-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest border-b border-slate-100 flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Staff Directory
                </div>
                <div id="staff-list-items-${appId}" class="max-h-44 overflow-y-auto py-1"></div>
                <div class="px-3 py-1.5 border-t border-slate-100 bg-slate-50">
                    <span class="text-[9px] text-slate-400 font-medium">↑↓ Navigate &nbsp;·&nbsp; ↵ Select &nbsp;·&nbsp; Esc Cancel</span>
                </div>
            `;
            document.body.appendChild(portal);

            const input = document.getElementById(`staff-input-${appId}`);
            const list = document.getElementById(`staff-list-${appId}`);
            const listItemsEl = document.getElementById(`staff-list-items-${appId}`);
            activeEditorAppId = appId;

            function setHighlight(idx) {
                listItemsEl.querySelectorAll('.staff-item').forEach(el => {
                    el.classList.remove('bg-emerald-500', 'text-white', 'staff-item-highlighted');
                    el.classList.add('text-slate-700');
                    el.querySelector('.avatar-circle').classList.replace('text-emerald-600', 'text-slate-500');
                });
                highlightIndex = idx;
                if (idx >= 0 && idx < filteredNames.length) {
                    const items = listItemsEl.querySelectorAll('.staff-item');
                    if (items[idx]) {
                        items[idx].classList.add('bg-emerald-500', 'text-white', 'staff-item-highlighted');
                        items[idx].classList.remove('text-slate-700');
                        items[idx].querySelector('.avatar-circle').classList.replace('text-slate-500', 'text-emerald-600');
                        items[idx].scrollIntoView({ block: 'nearest' });
                    }
                }
            }

            function positionPortal() {
                const editorRect = document.getElementById(`staff-editor-${appId}`).getBoundingClientRect();
                portal.style.top = (editorRect.bottom + 6) + 'px';
                portal.style.left = editorRect.left + 'px';
            }

            function renderSuggestions(query) {
                filteredNames = staffNames.filter(n => n.toLowerCase().includes(query.toLowerCase()));
                highlightIndex = -1;
                if (filteredNames.length === 0) {
                    listItemsEl.innerHTML = `<div class="px-3 py-4 text-xs text-slate-400 italic text-center">No staff members found</div>`;
                } else {
                    listItemsEl.innerHTML = filteredNames.map((name, i) => {
                        const initial = name.charAt(0).toUpperCase();
                        return `<div class="staff-item flex items-center gap-2 px-3 py-2.5 text-xs font-semibold text-slate-700 cursor-pointer transition-colors select-none" data-name="${name}" data-index="${i}">
                            <div class="avatar-circle w-5 h-5 rounded-full bg-slate-100 flex items-center justify-center text-[9px] font-bold text-slate-500 flex-shrink-0">${initial}</div>
                            <span>${name}</span>
                        </div>`;
                    }).join('');
                    listItemsEl.querySelectorAll('.staff-item').forEach(item => {
                        item.addEventListener('mousedown', (e) => {
                            e.preventDefault(); // fires before blur — no premature close
                            saveStaffAssignment(appId, item.getAttribute('data-name'));
                        });
                        item.addEventListener('mouseenter', () => {
                            setHighlight(parseInt(item.getAttribute('data-index')));
                        });
                    });
                }
                positionPortal();
                list.classList.remove('hidden');
            }

            input.addEventListener('focus', () => renderSuggestions(input.value));
            input.addEventListener('input', () => renderSuggestions(input.value));

            input.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (list.classList.contains('hidden')) renderSuggestions(input.value);
                    setHighlight(Math.min(highlightIndex + 1, filteredNames.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setHighlight(Math.max(highlightIndex - 1, 0));
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (highlightIndex >= 0 && highlightIndex < filteredNames.length) {
                        saveStaffAssignment(appId, filteredNames[highlightIndex]);
                    } else {
                        const exactMatch = staffNames.find(n => n.toLowerCase() === input.value.trim().toLowerCase());
                        if (exactMatch) {
                            saveStaffAssignment(appId, exactMatch);
                        } else {
                            alert("Please select a valid staff member from the dropdown list.");
                        }
                    }
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeActiveEditor();
                }
            });

            const outsideHandler = (e) => {
                const editor = document.getElementById(`staff-editor-${appId}`);
                const portal = document.getElementById(`staff-list-${appId}`);
                if ((editor && editor.contains(e.target)) || (portal && portal.contains(e.target))) return;
                closeActiveEditor();
            };
            activeClickOutsideHandler = outsideHandler;
            setTimeout(() => document.addEventListener('mousedown', outsideHandler), 150);
            
            activeScrollHandler = positionPortal;
            window.addEventListener('scroll', activeScrollHandler, true); // update on scroll

            input.focus();
            renderSuggestions('');
        }

        window.saveStaffAssignment = async function(appId, name) {
            if (!staffNames.includes(name)) {
                alert("Cannot assign: " + name + " is not a valid staff member.");
                return;
            }
            if (activeClickOutsideHandler) {
                document.removeEventListener('mousedown', activeClickOutsideHandler);
                activeClickOutsideHandler = null;
            }
            activeEditorAppId = null;

            // Store name
            localStorage.setItem('assigned_staff_' + appId, name);

            // Also store email as unique identifier for reliable cross-matching
            try {
                const localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
                const staffMember = localAccounts.find(s => `${s.firstName} ${s.lastName}`.toLowerCase() === name.toLowerCase());
                if (staffMember && staffMember.email) {
                    localStorage.setItem('assigned_staff_email_' + appId, staffMember.email.toLowerCase());
                } else {
                    localStorage.removeItem('assigned_staff_email_' + appId);
                }
            } catch (e) { console.warn('Could not look up staff email', e); }

            renderStaffCell(appId, name);
            try {
                await fetch(`/api/services/${appId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staff: name })
                });
            } catch (e) { console.warn("Backend sync failed, saved locally.", e); }
        }

        window.cancelStaffEdit = function(appId, originalStaff) {

        window.renderUsers = async function() {

                <!-- Credentials Modal -->
                <div id="credentials-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center pointer-events-none opacity-0 transition-all duration-300">

        function generateStaffClientSide(firstName, lastName) {
            const baseEmail = (firstName + "." + lastName).toLowerCase().replace(/[^a-z0-9]/g, "");
            let email = baseEmail + "@globalisor.com";
            
            let localAccounts = [];
            try {
                localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
            } catch (e) {
                console.error("Error reading local_staff_accounts", e);
            }
            
            let suffix = 1;
            while (localAccounts.some(acc => acc.email === email)) {
                email = baseEmail + suffix + "@globalisor.com";
                suffix++;
            }
            
            const randomNum = Math.floor(Math.random() * 9000) + 1000;
            const password = "Glob-" + randomNum;
            
            const newStaff = {
                id: "local_" + (localAccounts.length + 1),
                firstName: firstName,
                lastName: lastName,
                email: email,
                password: password,
                role: "STAFF"
            };
            
            localAccounts.push(newStaff);
            localStorage.setItem('local_staff_accounts', JSON.stringify(localAccounts));
            return newStaff;
        }

        const EYE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const EYE_OFF_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;
        const COPY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

        window.togglePasswordVisibility = function(id, password) {
            const textSpan = document.getElementById(`pass-text-${id}`);
            const btn = document.getElementById(`pass-btn-${id}`);
            if (!textSpan || !btn) return;
            
            const isHidden = textSpan.innerText === '••••••••';
            if (isHidden) {
                textSpan.innerText = password || 'Glob-••••';
                btn.innerHTML = EYE_OFF_SVG;
            } else {
                textSpan.innerText = '••••••••';
                btn.innerHTML = EYE_SVG;
            }
        }

        window.copyEmail = function(email) {
            navigator.clipboard.writeText(email).then(() => {
                // Success
            }).catch(err => console.error("Could not copy email", err));
        }

        window.copyPassword = function(id, password) {
            const val = password || '';
            if (!val) {
                alert("No plain password available to copy.");
                return;
            }
            navigator.clipboard.writeText(val).then(() => {
                // Success
            }).catch(err => console.error("Could not copy password", err));
        }

        window.fetchStaffList = async function() {
            let remoteStaff = [];
            let fetchError = false;
            try {
                const res = await fetch('/api/admin/staff');
                if (res.ok) {
                    remoteStaff = await res.json();
                } else {
                    fetchError = true;
                }
            } catch (e) {
                console.error(e);
                fetchError = true;
            }
            
            let localAccounts = [];
            try {
                localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
            } catch (e) {
                console.error("Error reading local_staff_accounts", e);
            }
            
            const mergedMap = new Map();
            remoteStaff.forEach(s => {
                mergedMap.set(s.email, {
                    id: s.id,
                    firstName: s.firstName,
                    lastName: s.lastName,
                    email: s.email,
                    password: s.password || ''
                });
            });
            
            localAccounts.forEach(s => {
                if (!mergedMap.has(s.email)) {
                    mergedMap.set(s.email, {
                        id: s.id,
                        firstName: s.firstName,
                        lastName: s.lastName,
                        email: s.email,
                        password: s.password || ''
                    });
                }
            });
            
            const mergedList = Array.from(mergedMap.values());
            const tbody = document.getElementById('staff-table-body');
            if (!tbody) return;
            
            if (mergedList.length === 0) {
                if (fetchError && localAccounts.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-red-500 font-bold">Failed to load staff directory (API error)</td></tr>`;
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-slate-400">No staff members found</td></tr>`;
                }
                return;
            }
            
            tbody.innerHTML = mergedList.map((staff, idx) => `
                <tr class="hover:bg-white/40 transition-colors">
                    <td class="px-6 py-4 font-bold text-blue-600 text-xs">${idx + 1}</td>
                    <td class="px-6 py-4 font-bold text-slate-800 font-outfit">${staff.firstName} ${staff.lastName}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center justify-between gap-2 mr-4">
                            <span class="text-slate-600 font-semibold text-xs">${staff.email}</span>
                            <button onclick="copyEmail('${staff.email}')" class="p-1 hover:bg-slate-200/50 rounded text-slate-400 hover:text-slate-600 transition-colors" title="Copy Email">
                                ${COPY_SVG}
                            </button>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-1.5">
                            <span class="font-mono text-xs text-slate-500 font-semibold" id="pass-text-${staff.id}">••••••••</span>
                            <button id="pass-btn-${staff.id}" onclick="togglePasswordVisibility('${staff.id}', '${staff.password || ''}')" class="p-1 hover:bg-slate-200/50 rounded text-slate-500 transition-colors" title="View Password">
                                ${EYE_SVG}
                            </button>
                            <button onclick="copyPassword('${staff.id}', '${staff.password || ''}')" class="p-1 hover:bg-slate-200/50 rounded text-slate-400 hover:text-slate-600 transition-colors" title="Copy Password">
                                ${COPY_SVG}
                            </button>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-600 uppercase tracking-wider">STAFF</span>
                    </td>
                </tr>
            `).join('');
            if (window.lucide) window.lucide.createIcons();
        }

        window.handleCreateStaff = async function(e) {
            e.preventDefault();
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            
            try {
                const response = await fetch('/api/admin/staff', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ firstName, lastName })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('first-name').value = '';
                    document.getElementById('last-name').value = '';
                    
                    document.getElementById('display-email').innerText = data.email;
                    document.getElementById('display-password').innerText = data.password;
                    
                    openStaffModal();
                    fetchStaffList();
                } else {
                    console.warn("API responded with non-200. Falling back to localStorage.");
                    const fallbackData = generateStaffClientSide(firstName, lastName);
                    document.getElementById('first-name').value = '';
                    document.getElementById('last-name').value = '';
                    
                    document.getElementById('display-email').innerText = fallbackData.email;
                    document.getElementById('display-password').innerText = fallbackData.password;
                    
                    openStaffModal();
                    fetchStaffList();
                }
            } catch (err) {
                console.error("API call failed, falling back to localStorage", err);
                const fallbackData = generateStaffClientSide(firstName, lastName);
                document.getElementById('first-name').value = '';
                document.getElementById('last-name').value = '';
                
                document.getElementById('display-email').innerText = fallbackData.email;
                document.getElementById('display-password').innerText = fallbackData.password;
                
                openStaffModal();
                fetchStaffList();
            }
        }

        window.openStaffModal = function() {
            const modal = document.getElementById('credentials-modal');
            modal.classList.remove('hidden');
            modal.offsetHeight; // force reflow
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.remove('scale-90');
            modal.classList.add('opacity-100', 'pointer-events-auto');
        }

        window.closeStaffModal = function() {
            const modal = document.getElementById('credentials-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.add('scale-90');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        window.copyStaffText = function(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
        }

        // Start
        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
