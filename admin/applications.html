<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Applications | Globalisor Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script>
        // Authentication Check
        if (!localStorage.getItem('admin_auth')) {
            window.location.href = '/admin/login.html';
        }
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { 
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' },
                        primary: '#0f172a', accent: '#3b82f6' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden; 
        }
        .top-nav { height: 60px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1rem; z-index: 9999; gap: 0.5rem; justify-content: space-between; }
        .main-container { padding: 2rem; max-width: 1600px; margin-left: auto; margin-right: auto; }
        .module-nav-btn { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.75rem; border-radius: 8px; font-size: 0.8rem; font-weight: 500; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; pointer-events: auto !important; }
        .module-nav-btn:hover { color: #0f172a; background: rgba(255,255,255,0.6); }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="flex items-center gap-4">
            <div class="flex flex-col leading-none cursor-pointer" onclick="window.location.href='dashboard.html'">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Admin</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Dashboard</span>
            </div>
        </div>
        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="window.location.href='dashboard.html'" class="module-nav-btn" id="btn-clients"><i data-lucide="users" class="w-4 h-4"></i> Clients</button>
            <button onclick="window.location.href='applications.html'" class="module-nav-btn active" id="btn-applications"><i data-lucide="file-text" class="w-4 h-4"></i> Applications</button>
            <button onclick="window.location.href='kyc.html'" class="module-nav-btn" id="btn-kyc"><i data-lucide="shield-check" class="w-4 h-4"></i> KYC Review</button>
            <button onclick="window.location.href='compliance.html'" class="module-nav-btn" id="btn-compliance"><i data-lucide="balance-scale" class="w-4 h-4"></i> Compliance</button>
            <button onclick="window.location.href='blogs.html'" class="module-nav-btn" id="btn-blogs"><i data-lucide="layout" class="w-4 h-4"></i> Blogs</button>

            <button onclick="window.location.href='reports.html'" class="module-nav-btn" id="btn-reports"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reports</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="btn-messages"><i data-lucide="message-square" class="w-4 h-4"></i> Messages</button>
            <button onclick="window.location.href='users.html'" class="module-nav-btn" id="btn-users"><i data-lucide="user-plus" class="w-4 h-4"></i> Users</button>
        </div>
        <div class="flex items-center justify-end gap-3 relative">
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800">Admin Team</div>
                    <button onclick="localStorage.removeItem('admin_auth'); window.location.href='login.html'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="space-y-6" id="applications-view">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-3xl font-bold font-outfit text-slate-900">All Applications</h2>
                    <p class="text-slate-500 text-sm">Manage and review all incoming service requests.</p>
                </div>
            </div>
            
            <div class="bg-white/60 backdrop-blur-md border border-white/80 p-4 rounded-2xl shadow-sm flex flex-wrap items-center gap-4 text-xs font-semibold text-slate-500">
                <div class="relative flex-1 min-w-[240px]">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input id="app-search-input" oninput="filterApplications()" type="text" placeholder="Search by ID, business, client..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none">
                </div>
                <div class="flex items-center gap-2">
                    <span>Date Range:</span>
                    <select class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none">
                        <option>Select</option>
                        <option>Last 7 Days</option>
                        <option>Last 30 Days</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <span>Custom:</span>
                    <div class="flex items-center px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl">
                        <input type="date" class="bg-transparent border-none outline-none text-slate-600 text-sm cursor-pointer">
                    </div>
                    <span>to</span>
                    <div class="flex items-center px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl">
                        <input type="date" class="bg-transparent border-none outline-none text-slate-600 text-sm cursor-pointer">
                    </div>
                </div>
                <select id="filter-status" onchange="filterApplications()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none">
                    <option value="All">All Status</option>
                    <option value="Pending">Status: Pending</option>
                    <option value="In Progress">Status: In Progress</option>
                    <option value="Under Review">Status: Under Review</option>
                    <option value="Submitted to ACRA">Status: Submitted to ACRA</option>
                    <option value="Approved">Status: Approved</option>
                    <option value="Rejected">Status: Rejected</option>
                </select>
                <select id="filter-priority" onchange="filterApplications()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none">
                    <option value="All">All Priority</option>
                    <option value="Low">Priority: Low</option>
                    <option value="Normal">Priority: Normal</option>
                    <option value="High">Priority: High</option>
                    <option value="Urgent">Priority: Urgent</option>
                </select>
            </div>

            <div class="bg-white/60 backdrop-blur-md border border-white/80 rounded-2xl shadow-sm overflow-visible">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50 border-b border-slate-100">
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">ID</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Business</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Client</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Staff</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Status</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Priority</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">KYC</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applications-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="8" class="p-12 text-center text-slate-400">Loading applications...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="h-64 w-full"></div> <!-- Extra space for dropdown -->
        </div>
    </main>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
        
        let staffNames = [];
        let activeClickOutsideHandler = null;
        let activeEditorAppId = null;
        let allApplications = [];

        async function loadStaffNames() {
            let remoteStaff = [];
            try {
                const res = await fetch('/api/admin/staff');
                if (res.ok) remoteStaff = await res.json();
            } catch (e) { console.error("Failed to fetch remote staff names", e); }
            
            let localAccounts = [];
            try {
                localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
            } catch (e) { console.error("Failed to load local staff accounts", e); }
            
            const namesSet = new Set();
            remoteStaff.forEach(s => { if (s.firstName && s.lastName) namesSet.add(`${s.firstName} ${s.lastName}`); });
            localAccounts.forEach(s => { if (s.firstName && s.lastName) namesSet.add(`${s.firstName} ${s.lastName}`); });
            staffNames = Array.from(namesSet);
        }

        window.filterApplications = function() {
            const statusFilter = document.getElementById('filter-status').value;
            const priorityFilter = document.getElementById('filter-priority').value;
            const searchQuery = (document.getElementById('app-search-input')?.value || '').toLowerCase();
            
            const filteredData = allApplications.map((app, originalIndex) => ({...app, originalIndex})).filter(app => {
                const s = app.status || 'Pending';
                const p = app.priority || 'Normal';
                const statusMatch = statusFilter === 'All' || s.toLowerCase() === statusFilter.toLowerCase();
                const priorityMatch = priorityFilter === 'All' || p.toLowerCase() === priorityFilter.toLowerCase();
                
                const idMatch = String(app.originalIndex + 1).includes(searchQuery);
                const businessMatch = (app.business || '').toLowerCase().includes(searchQuery);
                const clientMatch = (app.client || '').toLowerCase().includes(searchQuery);
                const searchMatch = !searchQuery || idMatch || businessMatch || clientMatch;

                return statusMatch && priorityMatch && searchMatch;
            });
            renderApplicationsTable(filteredData);
        };

        function renderApplicationsTable(data) {
            const tbody = document.getElementById('applications-table-body');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="p-12 text-center text-slate-400 italic">No applications found matching criteria</td></tr>';
                return;
            }
            tbody.innerHTML = data.map((app, idx) => {
                const status = (app.status || 'pending').toLowerCase();
                let statusClass = 'bg-slate-100 text-slate-600';
                if (status === 'pending') statusClass = 'bg-blue-50/80 text-blue-600';
                else if (status === 'in progress' || status === 'under review' || status === 'review') statusClass = 'bg-amber-50/80 text-amber-600';
                else if (status === 'completed' || status === 'approved') statusClass = 'bg-emerald-50/80 text-emerald-600';
                else if (status === 'rejected') statusClass = 'bg-red-50/80 text-red-600';
                const currentAssigned = localStorage.getItem('assigned_staff_' + app.id) || app.staff || '';
                const displayClass = currentAssigned ? 'text-emerald-600' : 'text-slate-400 italic';
                const displayId = app.originalIndex !== undefined ? app.originalIndex + 1 : idx + 1;
                return `
                <tr class="hover:bg-white/40 transition-colors group">
                    <td class="px-6 py-4 font-bold text-blue-600 text-xs">${displayId}</td>
                    <td class="px-6 py-4 font-bold text-slate-800 text-sm">${app.business || 'N/A'}</td>
                    <td class="px-6 py-4 text-slate-600 text-sm">${app.client || 'N/A'}</td>
                    <td class="px-6 py-4" id="staff-cell-${app.id}">
                        <span onclick="enableStaffEdit('${app.id}', '${currentAssigned}')" class="${displayClass} font-bold text-xs hover:underline cursor-pointer">${currentAssigned || 'Unassigned'}</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1.5 rounded-full text-[11px] font-bold uppercase ${statusClass}">${app.status || 'Pending'}</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${app.priority === 'High' || app.priority === 'Urgent' ? 'bg-red-50 text-red-500' : 'bg-slate-100 text-slate-500'}">${app.priority || 'Normal'}</span>
                    </td>
                    <td class="px-6 py-4 font-bold text-slate-800 text-[11px] uppercase">${app.kyc || 'N/A'}</td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="enableStaffEdit('${app.id}', '${currentAssigned}')" class="px-4 py-1.5 border border-blue-200 rounded-xl text-blue-600 text-[11px] font-bold hover:bg-blue-50 transition-all">Reassign</button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function fetchApplications() {
            await loadStaffNames();
            try {
                const res = await fetch('/api/applications');
                allApplications = await res.json();
                filterApplications();
            } catch(e) { console.error(e); }
        }

        function renderStaffCell(appId, staffName) {
            const cell = document.getElementById(`staff-cell-${appId}`);
            if (!cell) return;
            const displayClass = staffName ? 'text-emerald-600' : 'text-slate-400 italic';
            cell.innerHTML = `<span onclick="enableStaffEdit('${appId}', '${staffName}')" class="${displayClass} font-bold text-xs hover:underline cursor-pointer">${staffName || 'Unassigned'}</span>`;
        }

        function closeActiveEditor() {
            if (activeEditorAppId) {
                const prevId = activeEditorAppId;
                const prevStaff = localStorage.getItem('assigned_staff_' + prevId) || '';
                if (activeClickOutsideHandler) {
                    document.removeEventListener('mousedown', activeClickOutsideHandler);
                    activeClickOutsideHandler = null;
                }
                if (activeScrollHandler) {
                    window.removeEventListener('scroll', activeScrollHandler, true);
                    activeScrollHandler = null;
                }
                const portal = document.getElementById(`staff-list-${prevId}`);
                if (portal) portal.remove();
                activeEditorAppId = null;
                renderStaffCell(prevId, prevStaff);
            }
        }

        function enableStaffEdit(appId, currentStaff) {
            if (activeEditorAppId === appId) return;
            closeActiveEditor();

            const cell = document.getElementById(`staff-cell-${appId}`);
            if (!cell) return;

            let highlightIndex = -1;
            let filteredNames = [];

            cell.innerHTML = `
                <div id="staff-editor-${appId}" style="min-width:190px">
                    <div class="flex items-center gap-1.5 border-2 border-blue-500 rounded-xl bg-white shadow-lg px-2.5 py-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input type="text" id="staff-input-${appId}" value="" class="w-full bg-transparent outline-none text-xs font-semibold text-slate-700 placeholder-slate-300 min-w-0" autocomplete="off" placeholder="Search staff...">
                    </div>
                </div>
            `;
            
            const portal = document.createElement('div');
            portal.id = `staff-list-${appId}`;
            portal.className = "fixed z-[9999] bg-white border border-slate-200 rounded-2xl shadow-2xl hidden overflow-hidden";
            portal.style.minWidth = "200px";
            portal.innerHTML = `
                <div class="px-3 py-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest border-b border-slate-100 flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Staff Directory
                </div>
                <div id="staff-list-items-${appId}" class="max-h-44 overflow-y-auto py-1"></div>
                <div class="px-3 py-1.5 border-t border-slate-100 flex items-center gap-2 bg-slate-50">
                    <span class="text-[9px] text-slate-400 font-medium">↑↓ Navigate &nbsp;·&nbsp; ↵ Select &nbsp;·&nbsp; Esc Cancel</span>
                </div>
            `;
            document.body.appendChild(portal);

            const input = document.getElementById(`staff-input-${appId}`);
            const list = document.getElementById(`staff-list-${appId}`);
            const listItemsEl = document.getElementById(`staff-list-items-${appId}`);
            activeEditorAppId = appId;

            function setHighlight(idx) {
                listItemsEl.querySelectorAll('.staff-item').forEach(el => {
                    el.classList.remove('bg-emerald-500', 'text-white', 'staff-item-highlighted');
                    el.classList.add('text-slate-700');
                    el.querySelector('.avatar-circle').classList.replace('text-emerald-600', 'text-slate-500');
                });
                highlightIndex = idx;
                if (idx >= 0 && idx < filteredNames.length) {
                    const items = listItemsEl.querySelectorAll('.staff-item');
                    if (items[idx]) {
                        items[idx].classList.add('bg-emerald-500', 'text-white', 'staff-item-highlighted');
                        items[idx].classList.remove('text-slate-700');
                        items[idx].querySelector('.avatar-circle').classList.replace('text-slate-500', 'text-emerald-600');
                        items[idx].scrollIntoView({ block: 'nearest' });
                    }
                }
            }

            function positionPortal() {
                const editorRect = document.getElementById(`staff-editor-${appId}`).getBoundingClientRect();
                portal.style.top = (editorRect.bottom + 6) + 'px';
                portal.style.left = editorRect.left + 'px';
            }

            function renderSuggestions(query) {
                filteredNames = staffNames.filter(n => n.toLowerCase().includes(query.toLowerCase()));
                highlightIndex = -1;
                if (filteredNames.length === 0) {
                    listItemsEl.innerHTML = `<div class="px-3 py-4 text-xs text-slate-400 italic text-center">No staff members found</div>`;
                } else {
                    listItemsEl.innerHTML = filteredNames.map((name, i) => {
                        const initial = name.charAt(0).toUpperCase();
                        return `<div class="staff-item flex items-center gap-2 px-3 py-2.5 text-xs font-semibold text-slate-700 cursor-pointer transition-colors select-none" data-name="${name}" data-index="${i}">
                            <div class="avatar-circle w-5 h-5 rounded-full bg-slate-100 flex items-center justify-center text-[9px] font-bold text-slate-500 flex-shrink-0">${initial}</div>
                            <span>${name}</span>
                        </div>`;
                    }).join('');

                    listItemsEl.querySelectorAll('.staff-item').forEach(item => {
                        item.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            saveStaffAssignment(appId, item.getAttribute('data-name'));
                        });
                        item.addEventListener('mouseenter', () => {
                            setHighlight(parseInt(item.getAttribute('data-index')));
                        });
                    });
                }
                positionPortal();
                list.classList.remove('hidden');
            }

            input.addEventListener('focus', () => renderSuggestions(input.value));
            input.addEventListener('input', () => renderSuggestions(input.value));

            input.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (list.classList.contains('hidden')) renderSuggestions(input.value);
                    setHighlight(Math.min(highlightIndex + 1, filteredNames.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setHighlight(Math.max(highlightIndex - 1, 0));
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (highlightIndex >= 0 && highlightIndex < filteredNames.length) {
                        saveStaffAssignment(appId, filteredNames[highlightIndex]);
                    } else {
                        const exactMatch = staffNames.find(n => n.toLowerCase() === input.value.trim().toLowerCase());
                        if (exactMatch) {
                            saveStaffAssignment(appId, exactMatch);
                        } else {
                            alert("Please select a valid staff member from the dropdown list.");
                        }
                    }
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeActiveEditor();
                }
            });

            const outsideHandler = (e) => {
                const editor = document.getElementById(`staff-editor-${appId}`);
                const portalEl = document.getElementById(`staff-list-${appId}`);
                if ((editor && editor.contains(e.target)) || (portalEl && portalEl.contains(e.target))) return;
                closeActiveEditor();
            };
            activeClickOutsideHandler = outsideHandler;
            setTimeout(() => document.addEventListener('mousedown', outsideHandler), 150);

            activeScrollHandler = positionPortal;
            window.addEventListener('scroll', activeScrollHandler, true);

            input.focus();
            renderSuggestions('');
        }

        async function saveStaffAssignment(appId, name) {
            // Enforce: only allow names from the staff directory
            if (!staffNames.includes(name)) {
                alert("Cannot assign: " + name + " is not a valid staff member.");
                return;
            }

            // Tear down the editor state cleanly
            if (activeClickOutsideHandler) {
                document.removeEventListener('mousedown', activeClickOutsideHandler);
                activeClickOutsideHandler = null;
            }
            activeEditorAppId = null;

            // Persist locally — store BOTH name and email (email is the unique key for reliable matching)
            localStorage.setItem('assigned_staff_' + appId, name);

            // Look up the staff member's email from local directory
            try {
                const localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
                const staffMember = localAccounts.find(s => `${s.firstName} ${s.lastName}`.toLowerCase() === name.toLowerCase());
                if (staffMember && staffMember.email) {
                    localStorage.setItem('assigned_staff_email_' + appId, staffMember.email.toLowerCase());
                } else {
                    // Remove stale email entry if re-assigned to someone else
                    localStorage.removeItem('assigned_staff_email_' + appId);
                }
            } catch (e) { console.warn('Could not look up staff email', e); }

            renderStaffCell(appId, name);

            // Sync to backend silently in background
            try {
                await fetch(`/api/services/${appId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staff: name })
                });
            } catch (e) {
                console.warn("Backend sync failed, saved locally.", e);
            }
        }

        fetchApplications();
    </script>
</body>
</html>
