<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Applications | Globalisor Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script>
        // Authentication Check
        if (!localStorage.getItem('admin_auth')) {
            window.location.href = '/admin';
        }
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { 
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' },
                        primary: '#0f172a', accent: '#3b82f6' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Outfit', sans-serif;
            background: #ffffff;
            
            min-height: 100vh;
            overflow-x: hidden; 
        }
        .top-nav { height: 60px; background: #ffffff; backdrop-filter: blur(20px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1.5rem; z-index: 9999; gap: 0.5rem; justify-content: space-between; }
        .main-container { padding: 2rem; max-width: 1600px; margin-left: 240px !important; margin-right: auto; }
        .module-nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; width: 100% !important; box-sizing: border-box !important; }
        .module-nav-btn:hover { color: #0f172a; background: #ffffff; }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .top-nav > div:nth-child(2), #module-switcher {
            position: fixed !important;
            top: 60px !important;
            left: 0 !important;
            width: 240px !important;
            height: calc(100vh - 60px) !important;
            background: #ffffff !important;
            backdrop-filter: blur(20px) !important;
            border-right: 1px solid #e2e8f0 !important;
            border-top: none !important;
            border-left: none !important;
            border-bottom: none !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 1.5rem 1rem !important;
            gap: 0.5rem !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
            z-index: 9998 !important;
            box-shadow: none !important;
        }

        .submenu-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            transition: all 0.3s ease;
        }
        .submenu-container.hidden {
            display: none !important;
        }
        .submenu-arrow {
            transition: transform 0.2s ease;
        }
    </style>
    <script type="module" src="admin-sidebar.js"></script>
</head>
<body>

        <div class="flex items-center gap-4">
            <div class="flex flex-col leading-none cursor-pointer" onclick="window.location.href='dashboard.html'">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Admin</span>

        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">

            <button onclick="window.location.href='applications.html'" class="module-nav-btn" id="btn-applications"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> Applications</button>
            <button onclick="window.location.href='kyc.html'" class="module-nav-btn" id="btn-kyc"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg> KYC Review</button>
            <button onclick="window.location.href='compliance.html'" class="module-nav-btn" id="btn-compliance"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="m16 16 3-8 3 8c-.87.65-2.24.83-3 .83s-2.13-.18-3-.83Z"/><path d="m2 16 3-8 3 8c-.87.65-2.24.83-3 .83s-2.13-.18-3-.83Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h18"/></svg> Compliance</button>
            
            <button onclick="window.location.href='reports.html'" class="module-nav-btn" id="btn-reports"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg> Reports</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="btn-messages"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Messages</button>
            <button onclick="window.location.href='content.html'" class="module-nav-btn" id="btn-content"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> Content</button>

            <!-- Services Accordion Group -->
            <div class="w-full flex flex-col gap-0.5">
                <button onclick="toggleSubmenu('services-submenu')" class="module-nav-btn" id="btn-services">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                    <span class="flex-1 text-left">Services</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 submenu-arrow transition-transform duration-200 shrink-0"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div id="services-submenu" class="submenu-container hidden pl-6 flex flex-col gap-0.5 mt-0.5">
                    <button onclick="window.location.href='blogs.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-blogs"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 shrink-0"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Blogs</button>
                    <button onclick="window.location.href='countries.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-countries"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 shrink-0"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg> Countries</button>
                    <button onclick="window.location.href='users.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-users"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 shrink-0"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg> Users</button>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 relative">
            <!-- Notifications loaded dynamically by admin-sidebar.js -->

            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800">Admin Team</div>
                    <button onclick="localStorage.removeItem('admin_auth'); localStorage.removeItem('token'); window.location.href='/admin'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="space-y-6" id="applications-view">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-3xl font-bold font-outfit text-slate-900">All Applications</h2>
                    <p class="text-slate-500 text-sm">Manage and review all incoming service requests.</p>
                </div>
            </div>
            
            <div class="bg-white/60 backdrop-blur-md border border-white/80 p-4 rounded-2xl shadow-sm flex flex-wrap items-center gap-4 text-xs font-semibold text-slate-500">
                <div class="relative flex-1 min-w-[240px]">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input id="app-search-input" oninput="filterApplications()" type="text" placeholder="Search by ID, business, client..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none">
                </div>
                <div class="flex items-center gap-2">
                    <span>Date Range:</span>
                    <select class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none">
                        <option>Select</option>
                        <option>Last 7 Days</option>
                        <option>Last 30 Days</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <span>Custom:</span>
                    <div class="flex items-center px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl">
                        <input type="date" class="bg-transparent border-none outline-none text-slate-600 text-sm cursor-pointer">
                    </div>
                    <span>to</span>
                    <div class="flex items-center px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl">
                        <input type="date" class="bg-transparent border-none outline-none text-slate-600 text-sm cursor-pointer">
                    </div>
                </div>
                <select id="filter-status" onchange="filterApplications()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none">
                    <option value="All">All Status</option>
                    <option value="Pending">Status: Pending</option>
                    <option value="In Progress">Status: In Progress</option>
                    <option value="Under Review">Status: Under Review</option>
                    <option value="Submitted to ACRA">Status: Submitted to ACRA</option>
                    <option value="Approved">Status: Approved</option>
                    <option value="Rejected">Status: Rejected</option>
                </select>
                <select id="filter-priority" onchange="filterApplications()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none">
                    <option value="All">All Priority</option>
                    <option value="Low">Priority: Low</option>
                    <option value="Normal">Priority: Normal</option>
                    <option value="High">Priority: High</option>
                    <option value="Urgent">Priority: Urgent</option>
                </select>
            </div>

            <div class="bg-white/60 backdrop-blur-md border border-white/80 rounded-2xl shadow-sm overflow-visible">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50 border-b border-slate-100">
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">ID</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Business</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Client</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Staff</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Status</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Priority</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">KYC</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Name Check</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applications-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="9" class="p-12 text-center text-slate-400">Loading applications...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="h-64 w-full"></div> <!-- Extra space for dropdown -->
        </div>
    </main>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
        
        let staffNames = [];
        let activeClickOutsideHandler = null;
        let activeScrollHandler = null;
        let activeEditorAppId = null;
        let allApplications = [];

        async function loadStaffNames() {
            let remoteStaff = [];
            try {
                const authObj = JSON.parse(localStorage.getItem('admin_auth') || '{}');
                const token = authObj.token;
                const res = await fetch('/api/admin/staff', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) remoteStaff = await res.json();
            } catch (e) { console.error("Failed to fetch remote staff names", e); }
            
            let localAccounts = [];
            try {
                localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
            } catch (e) { console.error("Failed to load local staff accounts", e); }
            
            const namesSet = new Set();
            remoteStaff.forEach(s => { if (s.firstName && s.lastName) namesSet.add(`${s.firstName} ${s.lastName}`); });
            localAccounts.forEach(s => { if (s.firstName && s.lastName) namesSet.add(`${s.firstName} ${s.lastName}`); });
            staffNames = Array.from(namesSet);
        }

        window.filterApplications = function() {
            const statusFilter = document.getElementById('filter-status').value;
            const priorityFilter = document.getElementById('filter-priority').value;
            const searchQuery = (document.getElementById('app-search-input')?.value || '').toLowerCase();
            
            const filteredData = allApplications.map((app, originalIndex) => ({...app, originalIndex})).filter(app => {
                const s = app.status || 'Pending';
                const p = app.priority || 'Normal';
                const statusMatch = statusFilter === 'All' || s.toLowerCase() === statusFilter.toLowerCase();
                const priorityMatch = priorityFilter === 'All' || p.toLowerCase() === priorityFilter.toLowerCase();
                
                const idMatch = String(app.originalIndex + 1).includes(searchQuery);
                const businessMatch = (app.business || '').toLowerCase().includes(searchQuery);
                const clientMatch = (app.client || '').toLowerCase().includes(searchQuery);
                const searchMatch = !searchQuery || idMatch || businessMatch || clientMatch;

                return statusMatch && priorityMatch && searchMatch;
            });
            renderApplicationsTable(filteredData);
        };

        function getNameCheckBadges(appData) {
            if (!appData || !appData.nameChecks) return '<span class="text-slate-300 text-[10px] italic">Not checked</span>';
            const checks = appData.nameChecks;
            const icons = { available: '🟢', taken: '🔴', similar: '🟡', invalid: '🔴' };
            const names = ['names[0]', 'names[1]', 'names[2]', 'names[3]'];
            const badges = names.map((key, i) => {
                const c = checks[key];
                if (!c || !c.status) return '';
                const icon = icons[c.status] || '⚪';
                const label = c.name ? c.name.substring(0, 18) + (c.name.length > 18 ? '…' : '') : `Option ${i+1}`;
                const statusColors = {
                    available: 'background:#f0fdf4;color:#166534;border:1px solid #86efac',
                    taken: 'background:#fef2f2;color:#991b1b;border:1px solid #fca5a5',
                    similar: 'background:#fffbeb;color:#92400e;border:1px solid #fde68a',
                    invalid: 'background:#fef2f2;color:#991b1b;border:1px solid #fca5a5'
                };
                const style = statusColors[c.status] || 'background:#f1f5f9;color:#64748b';
                return `<span title="${c.name || ''}: ${c.status}" style="display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:100px;font-size:10px;font-weight:700;${style};margin:1px;white-space:nowrap">${icon} ${label}</span>`;
            }).filter(Boolean);
            if (badges.length === 0) return '<span class="text-slate-300 text-[10px] italic">Not checked</span>';
            return `<div style="display:flex;flex-direction:column;gap:2px;">${badges.join('')}</div>`;
        }

        function renderApplicationsTable(data) {
            const tbody = document.getElementById('applications-table-body');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="p-12 text-center text-slate-400 italic">No applications found matching criteria</td></tr>';
                return;
            }
            tbody.innerHTML = data.map((app, idx) => {
                const status = (app.status || 'pending').toLowerCase();
                let statusClass = 'bg-slate-100 text-slate-600';
                if (status === 'pending') statusClass = 'bg-blue-50/80 text-blue-600';
                else if (status === 'in progress' || status === 'under review' || status === 'review') statusClass = 'bg-amber-50/80 text-amber-600';
                else if (status === 'completed' || status === 'approved') statusClass = 'bg-emerald-50/80 text-emerald-600';
                else if (status === 'rejected') statusClass = 'bg-red-50/80 text-red-600';
                let currentAssigned = localStorage.getItem('assigned_staff_' + app.id);
                if (currentAssigned === null) {
                    const rawStaff = app.staff || '';
                    if (!rawStaff || rawStaff.toLowerCase() === 'sarah lim' || rawStaff.toLowerCase() === 'unassigned') {
                        currentAssigned = 'Unassigned';
                    } else {
                        currentAssigned = rawStaff;
                    }
                }
                const isUnassigned = !currentAssigned || currentAssigned.toLowerCase() === 'unassigned';
                const displayClass = isUnassigned ? 'text-slate-400 italic' : 'text-emerald-600';
                const displayName = isUnassigned ? 'Unassigned' : currentAssigned;
                const displayId = window.appSeqMap?.[app.id] || (app.originalIndex !== undefined ? app.originalIndex + 1 : idx + 1);
                const nameCheckBadges = getNameCheckBadges(app.data);
                return `
                <tr class="hover:bg-white/40 transition-colors group">
                    <td class="px-6 py-4 font-bold text-blue-600 text-xs">${displayId}</td>
                    <td class="px-6 py-4 font-bold text-slate-800 text-sm">${app.business || 'N/A'}</td>
                    <td class="px-6 py-4 text-slate-600 text-sm">${app.client || 'N/A'}</td>
                    <td class="px-6 py-4" id="staff-cell-${app.id}">
                        <span class="${displayClass} font-bold text-xs">${displayName}</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1.5 rounded-full text-[11px] font-bold uppercase ${statusClass}">${app.status || 'Pending'}</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${app.priority === 'High' || app.priority === 'Urgent' ? 'bg-red-50 text-red-500' : 'bg-slate-100 text-slate-500'}">${app.priority || 'Normal'}</span>
                    </td>
                    <td class="px-6 py-4 font-bold text-slate-800 text-[11px] uppercase">${app.kyc || 'N/A'}</td>
                    <td class="px-6 py-4">${nameCheckBadges}</td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="openReassignModal('${app.id}', '${displayName}')" class="px-4 py-1.5 border border-blue-200 rounded-xl text-blue-600 text-[11px] font-bold hover:bg-blue-50 transition-all">Reassign</button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function fetchApplications() {
            await loadStaffNames();
            try {
                const res = await fetch('/api/applications');
                allApplications = await res.json();
                if (allApplications && Array.isArray(allApplications)) {
                    // Sort chronologically to assign sequence IDs starting at 101
                    const sortedChronologically = [...allApplications].sort((a, b) => (a.id || '').localeCompare(b.id || ''));
                    window.appSeqMap = {};
                    sortedChronologically.forEach((app, idx) => {
                        window.appSeqMap[app.id] = 101 + idx;
                    });
                    localStorage.setItem('globalisor_app_seq_map', JSON.stringify(window.appSeqMap));
                    allApplications.sort((a, b) => (b.id || '').localeCompare(a.id || ''));
                }
                filterApplications();
            } catch(e) { console.error(e); }
        }

        function renderStaffCell(appId, staffName) {
            const cell = document.getElementById(`staff-cell-${appId}`);
            if (!cell) return;
            const isUnassigned = !staffName || staffName.toLowerCase() === 'unassigned';
            const displayClass = isUnassigned ? 'text-slate-400 italic' : 'text-emerald-600';
            const displayName = isUnassigned ? 'Unassigned' : staffName;
            cell.innerHTML = `<span class="${displayClass} font-bold text-xs">${displayName}</span>`;
        }

        window.openReassignModal = function(appId, currentStaff) {
            const existing = document.getElementById('reassign-modal');
            if (existing) existing.remove();

            const modalHtml = `
                <div id="reassign-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[10000] opacity-0 transition-opacity duration-300 pointer-events-auto">
                    <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col max-h-[85vh] pointer-events-auto">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h3 class="text-xl font-bold text-slate-900">Assign Staff</h3>
                                <p class="text-xs text-slate-500 mt-1">Select a staff member for this application</p>
                            </div>
                            <button onclick="closeReassignModal()" class="text-slate-400 hover:text-slate-600 transition-colors p-1 bg-slate-50 hover:bg-slate-100 rounded-xl">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                        
                        <div class="relative mb-4 flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35"/></svg>
                            <input type="text" id="reassign-search" placeholder="Search staff members..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20 text-sm font-medium">
                        </div>

                        <div class="overflow-y-auto flex-1 pr-1 space-y-2 mb-6" id="reassign-staff-list"></div>

                        <div class="flex gap-3 flex-shrink-0">
                            <button onclick="closeReassignModal()" class="flex-1 py-3 border border-slate-200 rounded-2xl text-slate-600 font-bold text-sm hover:bg-slate-50 transition-all">Cancel</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHtml);
            const modalEl = document.getElementById('reassign-modal');
            const modalContent = modalEl.querySelector('.bg-white');

            setTimeout(() => {
                modalEl.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);

            const searchInput = document.getElementById('reassign-search');
            const listContainer = document.getElementById('reassign-staff-list');

            let highlightedIndex = 0;
            let options = [];

            const renderList = (query = '') => {
                const filtered = staffNames.filter(name => name.toLowerCase().includes(query.toLowerCase()));
                options = ['Unassigned', ...filtered];

                if (highlightedIndex >= options.length) {
                    highlightedIndex = Math.max(0, options.length - 1);
                }

                let itemsHtml = '';
                options.forEach((name, idx) => {
                    const isSelected = (!name || name === 'Unassigned')
                        ? (!currentStaff || currentStaff.toLowerCase() === 'unassigned')
                        : (currentStaff && currentStaff.toLowerCase() === name.toLowerCase());
                    
                    const isHighlighted = idx === highlightedIndex;
                    const initial = name === 'Unassigned' ? 'U' : (name.charAt(0).toUpperCase() + (name.split(' ')[1] ? name.split(' ')[1].charAt(0).toUpperCase() : ''));
                    const isUnassigned = name === 'Unassigned';

                    let bgClass = 'border-transparent hover:bg-slate-50';
                    if (isHighlighted) {
                        bgClass = 'bg-sky-100 border-sky-400 shadow-sm';
                    } else if (isSelected) {
                        bgClass = 'border-blue-500 bg-blue-50/30';
                    }

                    itemsHtml += `
                        <div onclick="selectReassignStaff('${appId}', '${name}')" class="flex items-center justify-between p-3 rounded-2xl cursor-pointer transition-all border ${bgClass}" data-index="${idx}">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full ${isUnassigned ? 'bg-slate-100 text-slate-500' : 'bg-blue-50 text-blue-600'} flex items-center justify-center font-bold text-xs">${initial}</div>
                                <div>
                                    <div class="text-sm font-bold text-slate-900">${name}</div>
                                    <div class="text-[10px] text-slate-400 font-semibold uppercase">${isUnassigned ? 'No staff assigned' : 'Globalisor Staff'}</div>
                                </div>
                            </div>
                            ${isSelected ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>' : ''}
                        </div>
                    `;
                });

                listContainer.innerHTML = itemsHtml;
            };

            const handleKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    highlightedIndex = (highlightedIndex + 1) % options.length;
                    renderList(searchInput.value);
                    const activeEl = listContainer.querySelector(`[data-index="${highlightedIndex}"]`);
                    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    highlightedIndex = (highlightedIndex - 1 + options.length) % options.length;
                    renderList(searchInput.value);
                    const activeEl = listContainer.querySelector(`[data-index="${highlightedIndex}"]`);
                    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (options[highlightedIndex]) {
                        window.selectReassignStaff(appId, options[highlightedIndex]);
                    }
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    window.closeReassignModal();
                }
            };

            searchInput.addEventListener('keydown', handleKeyDown);
            const observer = new MutationObserver(() => {
                if (!document.getElementById('reassign-modal')) {
                    searchInput.removeEventListener('keydown', handleKeyDown);
                    observer.disconnect();
                }
            });
            observer.observe(document.body, { childList: true });

            searchInput.addEventListener('input', (e) => {
                highlightedIndex = 0;
                renderList(e.target.value);
            });
            renderList('');
            setTimeout(() => searchInput.focus(), 100);
        }

        window.closeReassignModal = function() {
            const modalEl = document.getElementById('reassign-modal');
            if (!modalEl) return;
            const modalContent = modalEl.querySelector('.bg-white');
            modalEl.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => modalEl.remove(), 300);
        };

        window.selectReassignStaff = async function(appId, name) {
            window.closeReassignModal();
            await saveStaffAssignment(appId, name);
        };

        async function saveStaffAssignment(appId, name) {
            const isUnassigned = !name || name.toLowerCase() === 'unassigned';
            if (!isUnassigned && !staffNames.includes(name)) {
                alert("Cannot assign: " + name + " is not a valid staff member.");
                return;
            }

            // Store name
            localStorage.setItem('assigned_staff_' + appId, isUnassigned ? 'Unassigned' : name);

            // Also store email as unique identifier for reliable cross-matching
            try {
                if (isUnassigned) {
                    localStorage.removeItem('assigned_staff_email_' + appId);
                } else {
                    const localAccounts = JSON.parse(localStorage.getItem('local_staff_accounts') || '[]');
                    const staffMember = localAccounts.find(s => `${s.firstName} ${s.lastName}`.toLowerCase() === name.toLowerCase());
                    if (staffMember && staffMember.email) {
                        localStorage.setItem('assigned_staff_email_' + appId, staffMember.email.toLowerCase());
                    } else {
                        localStorage.removeItem('assigned_staff_email_' + appId);
                    }
                }
            } catch (e) { console.warn('Could not look up staff email', e); }

            renderStaffCell(appId, isUnassigned ? 'Unassigned' : name);

            // Sync to backend silently in background
            try {
                await fetch(`/api/services/${appId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staff: isUnassigned ? 'Unassigned' : name })
                });
            } catch (e) {
                console.warn("Backend sync failed, saved locally.", e);
            }
        }

        window.toggleSubmenu = function(id) {
            const submenu = document.getElementById(id);
            const btn = document.getElementById('btn-services');
            if (submenu) {
                const isOpen = !submenu.classList.contains('hidden');
                if (isOpen) {
                    submenu.classList.add('hidden');
                    btn.classList.remove('submenu-open');
                } else {
                    submenu.classList.remove('hidden');
                    btn.classList.add('submenu-open');
                }
            }
        }

        let notifications = [];
        let socket = null;

        async function fetchNotifications() {}
        function renderNotificationsUI() {}
        window.markAllAsRead = async function(event) {}
        window.handleNotifClick = async function(notifId, type, relatedId) {}
        function showToastNotification(n) {}
        window.toggleNotifications = function(e) {}

        document.addEventListener('click', () => {
            const d = document.getElementById('notifications-dropdown');
            if (d) d.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
        });

        function connectWebSocket() {
            const authObj = JSON.parse(localStorage.getItem('admin_auth') || '{}');
            if (!authObj.id) return;
            let wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            let wsHost = window.location.host;
            if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && window.location.hostname !== '[::1]') {
                wsHost = 'globalisor-77d7da9fe8c7.herokuapp.com';
                wsProtocol = 'wss:';
            }
            socket = new WebSocket(`${wsProtocol}//${wsHost}/api/ws/chat?userId=${authObj.id}&role=admin`);

            socket.onmessage = function(event) {
                // local page-specific messages, notifications handled by sidebar
            };

            socket.onclose = function() {
                setTimeout(connectWebSocket, 5000);
            };
        }

        // Auto open submenu on load
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            if (path.includes('blogs.html') || path.includes('countries.html') || path.includes('users.html')) {
                const submenu = document.getElementById('services-submenu');
                const btn = document.getElementById('btn-services');
                if (submenu) submenu.classList.remove('hidden');
                if (btn) btn.classList.add('submenu-open');
            }
            connectWebSocket();
            fetchNotifications();
        });

        fetchApplications();

        // 15s polling and storage event listeners
        window.addEventListener('storage', (e) => {
            if (e.key === 'globalisor_app_seq_map') {
                try {
                    window.appSeqMap = JSON.parse(e.newValue);
                    filterApplications();
                } catch (err) { console.error(err); }
            } else if (e.key && e.key.startsWith('assigned_staff_')) {
                fetchApplications();
            }
        });

        setInterval(() => {
            fetchApplications();
        }, 15000);

        setInterval(() => {
            fetchNotifications();
        }, 5000);
    </script>
</body>
</html>
