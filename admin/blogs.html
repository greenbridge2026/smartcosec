<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | Globalisor Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script>
        if (!localStorage.getItem('admin_auth')) window.location.href = '/auth.html';
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%); background-attachment: fixed; min-height: 100vh; overflow-x: hidden; }
        .top-nav { height: 60px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1.5rem; z-index: 9999; gap: 0.5rem; justify-content: space-between; }
        .main-container { padding: 2rem; max-width: 1600px; margin-left: 240px !important; margin-right: auto; }
        .module-nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; width: 100% !important; box-sizing: border-box !important; }
        .module-nav-btn:hover { color: #0f172a; background: rgba(255,255,255,0.6); }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .top-nav > div:nth-child(2), #module-switcher {
            position: fixed !important;
            top: 60px !important;
            left: 0 !important;
            width: 240px !important;
            height: calc(100vh - 60px) !important;
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(20px) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-top: none !important;
            border-left: none !important;
            border-bottom: none !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 1.5rem 1rem !important;
            gap: 0.5rem !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
            z-index: 9998 !important;
            box-shadow: none !important;
        }

        .submenu-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            transition: all 0.3s ease;
        }
        .submenu-container.hidden {
            display: none !important;
        }
        .submenu-arrow {
            transition: transform 0.2s ease;
        }
        .submenu-open .submenu-arrow {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="flex items-center gap-4">
            <div class="flex flex-col leading-none cursor-pointer" onclick="window.location.href='dashboard.html'">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Admin</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Dashboard</span>
            </div>
        </div>
        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="window.location.href='dashboard.html'" class="module-nav-btn" id="btn-clients"><i data-lucide="users" class="w-4 h-4"></i> Clients</button>
            <button onclick="window.location.href='applications.html'" class="module-nav-btn" id="btn-applications"><i data-lucide="file-text" class="w-4 h-4"></i> Applications</button>
            <button onclick="window.location.href='kyc.html'" class="module-nav-btn" id="btn-kyc"><i data-lucide="shield-check" class="w-4 h-4"></i> KYC Review</button>
            <button onclick="window.location.href='compliance.html'" class="module-nav-btn" id="btn-compliance"><i data-lucide="balance-scale" class="w-4 h-4"></i> Compliance</button>
            
            <button onclick="window.location.href='reports.html'" class="module-nav-btn" id="btn-reports"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reports</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="btn-messages"><i data-lucide="message-square" class="w-4 h-4"></i> Messages</button>
            <button onclick="window.location.href='content.html'" class="module-nav-btn" id="btn-content"><i data-lucide="book-open" class="w-4 h-4"></i> Content</button>

            <!-- Services Accordion Group -->
            <div class="w-full flex flex-col gap-0.5">
                <button onclick="toggleSubmenu('services-submenu')" class="module-nav-btn" id="btn-services">
                    <i data-lucide="briefcase" class="w-4 h-4"></i>
                    <span class="flex-1 text-left">Services</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 submenu-arrow transition-transform"></i>
                </button>
                <div id="services-submenu" class="submenu-container hidden pl-6 flex flex-col gap-0.5 mt-0.5">
                    <button onclick="window.location.href='blogs.html'" class="module-nav-btn active py-1.5 text-[0.75rem]" id="btn-blogs"><i data-lucide="layout" class="w-3.5 h-3.5"></i> Blogs</button>
                    <button onclick="window.location.href='countries.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-countries"><i data-lucide="globe" class="w-3.5 h-3.5"></i> Countries</button>
                    <button onclick="window.location.href='packages.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-packages"><i data-lucide="package" class="w-3.5 h-3.5"></i> Packages</button>
                    <button onclick="window.location.href='users.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-users"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Users</button>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 relative">
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800">Admin Team</div>
                    <button onclick="localStorage.removeItem('admin_auth'); localStorage.removeItem('token'); window.location.href='/auth.html'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold font-outfit text-slate-900">Blog Management</h2>
            <button onclick="openBlogModal()" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-slate-900/20 hover:scale-105 transition-all">New Post</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="blogs-grid">
            <div class="col-span-full p-12 text-center text-slate-400">Loading blogs...</div>
        </div>
    </main>

    <!-- Add/Edit Blog Modal -->
    <div id="blog-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center opacity-0 transition-all duration-300 pointer-events-none">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto" onclick="closeBlogModal()"></div>
        <div class="bg-white/95 backdrop-blur-xl border border-white/60 rounded-3xl p-8 w-full max-w-2xl shadow-2xl relative z-10 transform scale-90 transition-transform pointer-events-auto overflow-y-auto max-h-[90vh]">
            <h3 id="modal-title" class="text-2xl font-bold font-outfit text-slate-900 mb-2">Create New Post</h3>
            <p class="text-slate-500 text-xs mb-6">Enter the details below to publish an update or blog post.</p>
            
            <form id="blog-form" class="space-y-4">
                <input type="hidden" id="modal-blog-index">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Title</label>
                        <input type="text" id="modal-blog-title" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. Navigating Corporate Taxes">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Category</label>
                        <select id="modal-blog-category" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold">
                            <option value="General">General</option>
                            <option value="Compliance">Compliance</option>
                            <option value="Corporate Tax">Corporate Tax</option>
                            <option value="Business Strategy">Business Strategy</option>
                            <option value="Accounting">Accounting</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Author</label>
                        <input type="text" id="modal-blog-author" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. Admin Team" value="Admin Team">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Status</label>
                        <select id="modal-blog-status" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold">
                            <option value="published">PUBLISHED</option>
                            <option value="draft">DRAFT</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-500 mb-1">Cover Image</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- File Upload Picker -->
                        <div class="flex flex-col justify-center items-center p-4 border border-dashed border-slate-200 rounded-xl bg-white/40 hover:bg-white/60 transition-colors relative cursor-pointer group">
                            <input type="file" id="modal-blog-file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                            <i data-lucide="upload" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition-colors mb-1"></i>
                            <span class="text-xs font-semibold text-slate-500 text-center" id="upload-label">Upload Image File</span>
                            <span class="text-[9px] text-slate-400 text-center" id="upload-filename">Max size 2MB</span>
                        </div>
                        
                        <!-- URL Input and Preview -->
                        <div class="flex flex-col justify-between space-y-2">
                            <input type="url" id="modal-blog-image" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" placeholder="Or enter direct image URL...">
                            <!-- Mini Image Preview -->
                            <div class="h-16 w-full rounded-xl bg-slate-100/50 border border-slate-200 overflow-hidden flex items-center justify-center relative group/preview">
                                <img id="image-preview" src="" class="hidden w-full h-full object-cover">
                                <span id="preview-placeholder" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Preview</span>
                                <button type="button" id="clear-image-btn" class="hidden absolute top-1 right-1 bg-red-500 hover:bg-red-600 text-white rounded-full p-1 shadow-sm transition-all hover:scale-110">
                                    <i data-lucide="x" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Short Excerpt / Description</label>
                    <textarea id="modal-blog-excerpt" rows="2" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold resize-none" required placeholder="Brief summary displaying on cards..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Content (Markdown or HTML supported)</label>
                    <textarea id="modal-blog-content" rows="6" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-mono font-semibold" required placeholder="Write your post details here..."></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" id="modal-delete-btn" class="hidden py-3 px-4 border border-red-200 text-red-500 hover:bg-red-50 font-bold rounded-xl text-xs transition-all flex items-center gap-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete</button>
                    <button type="button" onclick="closeBlogModal()" class="flex-1 py-3 border border-slate-200 text-slate-500 font-bold rounded-xl text-xs transition-all hover:bg-slate-50">Cancel</button>
                    <button type="submit" id="submit-btn" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition-all shadow-md">Publish Post</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        window.toggleSubmenu = function(id) {
            const submenu = document.getElementById(id);
            const btn = document.getElementById('btn-services');
            if (submenu) {
                const isOpen = !submenu.classList.contains('hidden');
                if (isOpen) {
                    submenu.classList.add('hidden');
                    btn.classList.remove('submenu-open');
                } else {
                    submenu.classList.remove('hidden');
                    btn.classList.add('submenu-open');
                }
            }
        }

        // Auto open submenu on load
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            if (path.includes('blogs.html') || path.includes('countries.html') || path.includes('packages.html') || path.includes('users.html')) {
                const submenu = document.getElementById('services-submenu');
                const btn = document.getElementById('btn-services');
                if (submenu) submenu.classList.remove('hidden');
                if (btn) btn.classList.add('submenu-open', 'active');
            }
        });

        if (typeof lucide !== 'undefined') lucide.createIcons();

        const DEFAULT_BLOGS = [
            {
                id: "default-incorporation",
                title: "Navigating Singapore Startup Incorporation",
                category: "Compliance",
                excerpt: "A complete step-by-step walkthrough on incorporation requirements, nominee directors, and local secretarial guidelines.",
                description: "A complete step-by-step walkthrough on incorporation requirements, nominee directors, and local secretarial guidelines.",
                content: "<p>Incorporating a startup in Singapore is a popular choice for founders globally due to the country's business-friendly policies, attractive tax structures, and robust intellectual property protections.</p><p>In this guide, we cover structural setups, ACRA requirements, nominee directors, and statutory registration processes to get you running in hours.</p>",
                coverImage: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40",
                author: "Admin Team",
                date: "28 May 2026",
                status: "published",
                published: true
            },
            {
                id: "default-tax",
                title: "Understanding Corporate Tax Benefits & Rates",
                category: "Corporate Tax",
                excerpt: "Learn how the single-tier territorial tax system and startup exemptions can optimize your company's effective tax liability.",
                description: "Learn how the single-tier territorial tax system and startup exemptions can optimize your company's effective tax liability.",
                content: "<p>Singapore corporate tax rates are capped flat at 17%. Thanks to tax exemptions for new startups and partial tax exemptions, the effective tax rate is often significantly lower.</p>",
                coverImage: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c",
                author: "Tax Advisory",
                date: "24 May 2026",
                status: "published",
                published: true
            }
        ];

        let blogs = [];

        function loadBlogs() {
            const cached = localStorage.getItem('admin_blogs');
            if (cached === null) {
                blogs = DEFAULT_BLOGS;
                localStorage.setItem('admin_blogs', JSON.stringify(blogs));
            } else {
                try {
                    blogs = JSON.parse(cached);
                    if (!Array.isArray(blogs)) {
                        blogs = DEFAULT_BLOGS;
                    } else {
                        let updated = false;
                        blogs = blogs.map((b, idx) => {
                            if (!b.id) {
                                b.id = "blog-" + Date.now() + "-" + idx;
                                updated = true;
                            }
                            return b;
                        });
                        if (updated) {
                            localStorage.setItem('admin_blogs', JSON.stringify(blogs));
                        }
                    }
                } catch(e) {
                    blogs = DEFAULT_BLOGS;
                }
            }
            renderBlogsGrid();
        }

        async function fetchBlogs() {
            try {
                const res = await fetch('/api/blogs');
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    blogs = data.map(b => ({
                        id: b.id || b.slug || "blog-" + Math.random().toString(36).substr(2, 9),
                        title: b.title,
                        category: b.category,
                        excerpt: b.excerpt || b.description || '',
                        description: b.description || b.excerpt || '',
                        content: b.content || '',
                        coverImage: b.coverImage || b.coverImage_url || '',
                        author: b.author || 'Admin Team',
                        date: b.date || new Date().toLocaleDateString('en-SG', { day: '2-digit', month: 'short', year: 'numeric' }),
                        status: b.status || (b.published ? 'published' : 'draft'),
                        published: b.published !== undefined ? b.published : (b.status === 'published')
                    }));
                    localStorage.setItem('admin_blogs', JSON.stringify(blogs));
                } else {
                    loadBlogs();
                }
            } catch (e) {
                console.warn("REST API blogs endpoint offline, using localStorage cache:", e);
                loadBlogs();
            }
            renderBlogsGrid();
        }

        function renderBlogsGrid() {
            const grid = document.getElementById('blogs-grid');
            if (!grid) return;
            grid.innerHTML = blogs.map((b, idx) => `
                <div class="bg-white/60 backdrop-blur-md border border-white/80 p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all group flex flex-col justify-between">
                    <div>
                        <div class="h-44 bg-slate-100 rounded-xl overflow-hidden mb-4 relative">
                            ${b.coverImage ? `<img src="${b.coverImage}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">` : `<div class="w-full h-full flex items-center justify-center text-slate-300 bg-slate-100"><i data-lucide="image" class="w-10 h-10"></i></div>`}
                            <div class="absolute top-4 left-4">
                                <span class="px-2.5 py-1 rounded-full bg-blue-600 text-white text-[9px] font-bold uppercase tracking-wider">${b.category}</span>
                            </div>
                            <div class="absolute top-4 right-4">
                                <span class="px-2.5 py-1 rounded-full text-[9px] font-bold uppercase tracking-wider ${b.status === 'published' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-amber-50 text-amber-600 border border-amber-200'}">${b.status}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-[10px] text-slate-400 font-medium">${b.date}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-lg mb-2 group-hover:text-blue-600 transition-colors">${b.title}</h3>
                        <p class="text-sm text-slate-500 line-clamp-3 mb-6">${b.excerpt}</p>
                    </div>
                    <div class="flex flex-col gap-2 pt-4 border-t border-slate-100 mt-auto">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${b.author}</span>
                            <div class="flex gap-1.5">
                                <button onclick="editBlog(${idx})" class="px-2.5 py-1 bg-slate-100/80 hover:bg-slate-200/85 text-slate-700 text-[10px] font-bold rounded-lg transition-all hover:scale-105 flex items-center gap-1 cursor-pointer">
                                    <i data-lucide="edit-3" class="w-3.5 h-3.5 text-slate-500"></i> Edit
                                </button>
                                <button onclick="deleteBlog(${idx})" class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 text-[10px] font-bold rounded-lg transition-all hover:scale-105 flex items-center gap-1 cursor-pointer">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5 text-red-500"></i> Delete
                                </button>
                            </div>
                        </div>
                        ${b.status === 'published'
                            ? `<button onclick="publishBlog(${idx})" class="w-full py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-[10px] font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                                <i data-lucide="eye-off" class="w-3.5 h-3.5"></i> Unpublish from Landing Page
                               </button>`
                            : `<button onclick="publishBlog(${idx})" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold rounded-xl transition-all shadow-md flex items-center justify-center gap-1.5 cursor-pointer">
                                <i data-lucide="send" class="w-3.5 h-3.5"></i> Publish to Landing Page
                               </button>`
                        }
                    </div>
                </div>
            `).join('') || '<div class="col-span-full p-8 text-center text-slate-400">No blog posts found</div>';
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        const fileInput = document.getElementById('modal-blog-file');
        const urlInput = document.getElementById('modal-blog-image');
        const previewImg = document.getElementById('image-preview');
        const previewPlaceholder = document.getElementById('preview-placeholder');
        const uploadLabel = document.getElementById('upload-label');
        const uploadFilename = document.getElementById('upload-filename');

        const clearImageBtn = document.getElementById('clear-image-btn');

        function updatePreview(src) {
            if (src && src.trim() !== '') {
                previewImg.src = src;
                previewImg.classList.remove('hidden');
                previewPlaceholder.classList.add('hidden');
                if (clearImageBtn) clearImageBtn.classList.remove('hidden');
            } else {
                previewImg.src = '';
                previewImg.classList.add('hidden');
                previewPlaceholder.classList.remove('hidden');
                if (clearImageBtn) clearImageBtn.classList.add('hidden');
            }
        }

        if (clearImageBtn) {
            clearImageBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (urlInput) urlInput.value = '';
                if (fileInput) fileInput.value = '';
                updatePreview('');
                if (uploadLabel) uploadLabel.innerText = "Upload Image File";
                if (uploadFilename) uploadFilename.innerText = "Max size 2MB";
            });
        }

        if (fileInput) {
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        alert("File size exceeds 2MB limit.");
                        fileInput.value = '';
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const base64Url = evt.target.result;
                        urlInput.value = base64Url;
                        updatePreview(base64Url);
                        uploadLabel.innerText = "File Selected";
                        uploadFilename.innerText = file.name.length > 20 ? file.name.substring(0, 17) + "..." : file.name;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        if (urlInput) {
            urlInput.addEventListener('input', () => {
                updatePreview(urlInput.value.trim());
                if (fileInput) fileInput.value = '';
                if (uploadLabel) uploadLabel.innerText = "Upload Image File";
                if (uploadFilename) uploadFilename.innerText = "Max size 2MB";
            });
        }

        const modalDeleteBtn = document.getElementById('modal-delete-btn');
        if (modalDeleteBtn) {
            modalDeleteBtn.addEventListener('click', async () => {
                const idx = parseInt(document.getElementById('modal-blog-index').value);
                if (idx > -1) {
                    const blogToDelete = blogs[idx];
                    if (confirm("Are you sure you want to delete this blog post?")) {
                        blogs.splice(idx, 1);
                        localStorage.setItem('admin_blogs', JSON.stringify(blogs));
                        closeBlogModal();
                        renderBlogsGrid();

                        if (blogToDelete && blogToDelete.id) {
                            try {
                                await fetch(`/api/blogs/${blogToDelete.id}`, {
                                    method: 'DELETE'
                                });
                            } catch (err) {
                                console.warn("Could not sync blog deletion to backend database:", err);
                            }
                        }
                    }
                }
            });
        }

        window.openBlogModal = function(editIdx = -1) {
            const modal = document.getElementById('blog-modal');
            const titleEl = document.getElementById('modal-title');
            const submitBtn = document.getElementById('submit-btn');
            
            document.getElementById('blog-form').reset();
            
            if (editIdx > -1) {
                const b = blogs[editIdx];
                document.getElementById('modal-blog-index').value = editIdx;
                document.getElementById('modal-blog-title').value = b.title;
                document.getElementById('modal-blog-category').value = b.category;
                document.getElementById('modal-blog-author').value = b.author;
                document.getElementById('modal-blog-status').value = b.status;
                const imgVal = b.coverImage || '';
                document.getElementById('modal-blog-image').value = imgVal;
                updatePreview(imgVal);
                document.getElementById('modal-blog-excerpt').value = b.excerpt;
                document.getElementById('modal-blog-content').value = b.content;
                
                titleEl.innerText = "Edit Blog Post";
                submitBtn.innerText = "Save Changes";
                if (modalDeleteBtn) modalDeleteBtn.classList.remove('hidden');
            } else {
                document.getElementById('modal-blog-index').value = -1;
                document.getElementById('modal-blog-author').value = "Admin Team";
                titleEl.innerText = "Create New Post";
                submitBtn.innerText = "Publish Post";
                updatePreview('');
                if (modalDeleteBtn) modalDeleteBtn.classList.add('hidden');
            }
            
            if (fileInput) fileInput.value = '';
            if (uploadLabel) uploadLabel.innerText = "Upload Image File";
            if (uploadFilename) uploadFilename.innerText = "Max size 2MB";
            
            modal.classList.remove('hidden');
            modal.offsetHeight; // force reflow
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.remove('scale-90');
            modal.classList.add('opacity-100', 'pointer-events-auto');
        }

        window.closeBlogModal = function() {
            const modal = document.getElementById('blog-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.add('scale-90');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        window.editBlog = function(idx) {
            openBlogModal(idx);
        }

        window.publishBlog = async function(idx) {
            const blog = blogs[idx];
            const isPublished = blog.status === 'published';
            const newStatus = isPublished ? 'draft' : 'published';
            const action = isPublished ? 'unpublish' : 'publish';
            
            if (!confirm(`Are you sure you want to ${action} "${blog.title}"? ${isPublished ? 'It will no longer appear on the landing page.' : 'It will immediately appear on the landing page.'}`)) return;
            
            blogs[idx].status = newStatus;
            blogs[idx].published = (newStatus === 'published');
            localStorage.setItem('admin_blogs', JSON.stringify(blogs));
            renderBlogsGrid();

            // Show toast feedback
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 right-6 z-[99999] px-5 py-3 rounded-2xl text-sm font-bold shadow-xl transition-all';
            toast.style.cssText = `background: ${newStatus === 'published' ? '#059669' : '#64748b'}; color: white;`;
            toast.innerHTML = `${newStatus === 'published' ? '✅ Published!' : '⬇️ Unpublished'} &mdash; "${blog.title}" is now <strong>${newStatus}</strong>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);

            // Sync to backend if available
            try {
                await fetch(`/api/blogs/${blogs[idx].id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(blogs[idx])
                });
            } catch (err) {
                console.warn('Could not sync publish status to backend:', err);
            }
        }

        window.deleteBlog = async function(idx) {
            const blogToDelete = blogs[idx];
            if (confirm("Are you sure you want to delete this blog post?")) {
                blogs.splice(idx, 1);
                localStorage.setItem('admin_blogs', JSON.stringify(blogs));
                renderBlogsGrid();

                if (blogToDelete && blogToDelete.id) {
                    try {
                        await fetch(`/api/blogs/${blogToDelete.id}`, {
                            method: 'DELETE'
                        });
                    } catch (err) {
                        console.warn("Could not sync blog deletion to backend database:", err);
                    }
                }
            }
        }

        document.getElementById('blog-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idx = parseInt(document.getElementById('modal-blog-index').value);
            const title = document.getElementById('modal-blog-title').value.trim();
            const category = document.getElementById('modal-blog-category').value;
            const author = document.getElementById('modal-blog-author').value.trim();
            const status = document.getElementById('modal-blog-status').value;
            const coverImage = document.getElementById('modal-blog-image').value.trim() || 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40';
            const excerpt = document.getElementById('modal-blog-excerpt').value.trim();
            const content = document.getElementById('modal-blog-content').value.trim();
            
            const blogData = {
                id: idx > -1 ? (blogs[idx].id || "blog-" + Date.now()) : "blog-" + Date.now(),
                title,
                category,
                author,
                status,
                published: status === 'published',
                coverImage,
                excerpt,
                description: excerpt,
                content,
                date: idx > -1 ? blogs[idx].date : new Date().toLocaleDateString('en-SG', { day: '2-digit', month: 'short', year: 'numeric' })
            };
            
            if (idx > -1) {
                blogs[idx] = blogData;
            } else {
                blogs.unshift(blogData);
            }
            
            localStorage.setItem('admin_blogs', JSON.stringify(blogs));
            closeBlogModal();
            renderBlogsGrid();

            // Sync with backend database
            const method = idx > -1 ? 'PUT' : 'POST';
            const url = idx > -1 ? `/api/blogs/${blogData.id}` : '/api/blogs';
            try {
                const apiRes = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(blogData)
                });
                if (!apiRes.ok && method === 'POST') {
                    // Try alternative admin endpoint
                    await fetch('/api/admin/blogs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(blogData)
                    });
                }
            } catch (err) {
                console.warn("Could not sync blog to backend database, saved to local cache:", err);
            }
        });

        fetchBlogs();
    </script>
</body>
</html>
