<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Management | Globalisor Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script type="module" src="admin-sidebar.js"></script>
    <script>
        if (!localStorage.getItem('admin_auth')) window.location.href = '/auth.html';
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%); background-attachment: fixed; min-height: 100vh; overflow-x: hidden; }
        .top-nav { height: 60px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1.5rem; z-index: 9999; gap: 0.5rem; justify-content: space-between; }
        .main-container { padding: 2rem; max-width: 1600px; margin-left: 240px !important; margin-right: auto; }
        .module-nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; width: 100% !important; box-sizing: border-box !important; }
        .module-nav-btn:hover { color: #0f172a; background: rgba(255,255,255,0.6); }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .top-nav > div:nth-child(2), #module-switcher {
            position: fixed !important;
            top: 60px !important;
            left: 0 !important;
            width: 240px !important;
            height: calc(100vh - 60px) !important;
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(20px) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-top: none !important;
            border-left: none !important;
            border-bottom: none !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 1.5rem 1rem !important;
            gap: 0.5rem !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
            z-index: 9998 !important;
            box-shadow: none !important;
        }
        
        .submenu-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            transition: all 0.3s ease;
        }
        .submenu-container.hidden {
            display: none !important;
        }
        .submenu-arrow {
            transition: transform 0.2s ease;
        }
        .submenu-open .submenu-arrow {
            transform: rotate(180deg);
        }
        
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th { padding: 1rem 1.5rem; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #f1f5f9; background: rgba(248, 250, 252, 0.5); }
        .admin-table td { padding: 1rem 1.5rem; font-size: 0.85rem; color: #1e293b; border-bottom: 1px solid #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04); }
        .row-toggle-btn { color: #2563eb !important; }
        .row-toggle-btn:hover { color: #1d4ed8 !important; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="flex items-center gap-4">
            <div class="flex flex-col leading-none cursor-pointer" onclick="window.location.href='dashboard.html'">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Admin</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Portal</span>
            </div>
        </div>
        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="window.location.href='dashboard.html'" class="module-nav-btn" id="btn-clients"><i data-lucide="users" class="w-4 h-4"></i> Clients</button>
            <button onclick="window.location.href='applications.html'" class="module-nav-btn" id="btn-applications"><i data-lucide="file-text" class="w-4 h-4"></i> Applications</button>
            <button onclick="window.location.href='kyc.html'" class="module-nav-btn" id="btn-kyc"><i data-lucide="shield-check" class="w-4 h-4"></i> KYC Review</button>
            <button onclick="window.location.href='compliance.html'" class="module-nav-btn" id="btn-compliance"><i data-lucide="balance-scale" class="w-4 h-4"></i> Compliance</button>
            
            <button onclick="window.location.href='reports.html'" class="module-nav-btn" id="btn-reports"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reports</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="btn-messages"><i data-lucide="message-square" class="w-4 h-4"></i> Messages</button>
            <button onclick="window.location.href='content.html'" class="module-nav-btn" id="btn-content"><i data-lucide="book-open" class="w-4 h-4"></i> Content</button>

            <!-- Services Accordion Group -->
            <div class="w-full flex flex-col gap-0.5">
                <button onclick="toggleSubmenu('services-submenu')" class="module-nav-btn" id="btn-services">
                    <i data-lucide="briefcase" class="w-4 h-4"></i>
                    <span class="flex-1 text-left">Services</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 submenu-arrow transition-transform"></i>
                </button>
                <div id="services-submenu" class="submenu-container hidden pl-6 flex flex-col gap-0.5 mt-0.5">
                    <button onclick="window.location.href='blogs.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-blogs"><i data-lucide="layout" class="w-3.5 h-3.5"></i> Blogs</button>
                    <button onclick="window.location.href='countries.html'" class="module-nav-btn active py-1.5 text-[0.75rem]" id="btn-countries"><i data-lucide="globe" class="w-3.5 h-3.5"></i> Countries</button>
                    <button onclick="window.location.href='users.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-users"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Users</button>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 relative">
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800">Admin Team</div>
                    <button onclick="localStorage.removeItem('admin_auth'); localStorage.removeItem('token'); window.location.href='/auth.html'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="space-y-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-3xl font-bold font-outfit text-slate-900">Country Hubs</h2>
                </div>
                <button onclick="openCountryModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs flex items-center gap-2 transition-all shadow-md shadow-blue-500/10">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Country
                </button>
            </div>

            <div class="glass-card overflow-hidden">
                <table class="admin-table">
                    <thead>
                        <tr class="text-left">
                            <th class="w-24">No</th>
                            <th>Jurisdiction</th>
                            <th>Corporate Tax</th>
                            <th>Status</th>
                            <th>Landing Page</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="country-table-body">
                        <!-- Dynamic countries will be rendered here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Country Drawer -->
    <div id="add-country-modal" class="hidden fixed inset-0 z-[9999] flex justify-end opacity-0 transition-all duration-300 pointer-events-none">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto" onclick="closeCountryModal()"></div>
        <div class="bg-white/95 backdrop-blur-xl border-l border-slate-200 w-full max-w-md shadow-2xl relative z-10 transform translate-x-full transition-transform duration-300 pointer-events-auto flex flex-col h-full p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-xl font-bold font-outfit text-slate-900">Add New Country</h3>
                    <p class="text-slate-500 text-xs mt-0.5">Enter the jurisdiction details to add to the hub.</p>
                </div>
                <button type="button" onclick="closeCountryModal()" class="text-slate-400 hover:text-slate-600 transition-colors p-1.5 hover:bg-slate-100 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="add-country-form" class="space-y-4 flex-1 flex flex-col justify-between">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Country Name</label>
                        <input type="text" id="modal-country-name" list="countries-list" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. Singapore">
                        <datalist id="countries-list">
                            <option value="Singapore">
                            <option value="Hong Kong">
                            <option value="United States">
                            <option value="Dubai">
                            <option value="United Arab Emirates">
                            <option value="Australia">
                            <option value="United Kingdom">
                            <option value="Indonesia">
                            <option value="Malaysia">
                            <option value="India">
                            <option value="Vietnam">
                            <option value="Thailand">
                            <option value="Philippines">
                            <option value="Japan">
                            <option value="Germany">
                            <option value="France">
                            <option value="Canada">
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Country Code</label>
                        <input type="text" id="modal-country-code" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. SG">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">UEN / Registration Format</label>
                        <input type="text" id="modal-country-uen" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. 9-character alphanumeric">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Corporate Tax Rate</label>
                        <input type="text" id="modal-country-tax" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. 17% (flat rate)">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Compliance Score</label>
                        <input type="text" id="modal-country-compliance" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. 99.5%">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Status</label>
                        <select id="modal-country-status" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                    
                    <!-- Accordion Section for Services -->
                    <div class="border border-slate-200 rounded-2xl overflow-hidden bg-slate-50/50">
                        <button type="button" onclick="toggleAccordion('add-services-accordion')" class="w-full flex items-center justify-between p-4 text-left font-bold text-xs text-slate-700 bg-white/40 hover:bg-white/70 transition-all outline-none">
                            <span class="flex items-center gap-2">
                                <i data-lucide="briefcase" class="w-4 h-4 text-blue-600"></i>
                                <span>Services Offered</span>
                            </span>
                            <span class="flex items-center gap-2">
                                <span id="add-services-summary" class="text-[10px] text-slate-400 font-normal">0 Selected</span>
                                <i data-lucide="chevron-down" id="add-services-chevron" class="w-3.5 h-3.5 transition-transform duration-200"></i>
                            </span>
                        </button>
                        <div id="add-services-accordion" class="max-h-0 overflow-hidden transition-all duration-300 ease-in-out border-t border-transparent">
                            <div class="p-4 grid grid-cols-1 gap-3 text-xs bg-white/20">
                                <label class="flex items-center gap-2 cursor-pointer font-semibold text-slate-700 hover:text-slate-900 transition-colors">
                                    <input type="checkbox" name="services" value="Company Incorporation" onchange="updateServicesSummary('add')" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500/20 w-4 h-4">
                                    <span>Company Incorporation</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer font-semibold text-slate-700 hover:text-slate-900 transition-colors">
                                    <input type="checkbox" name="services" value="Corporate Secretary" onchange="updateServicesSummary('add')" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500/20 w-4 h-4">
                                    <span>Corporate Secretary</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer font-semibold text-slate-700 hover:text-slate-900 transition-colors">
                                    <input type="checkbox" name="services" value="Nominee Director" onchange="updateServicesSummary('add')" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500/20 w-4 h-4">
                                    <span>Nominee Director</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer font-semibold text-slate-700 hover:text-slate-900 transition-colors">
                                    <input type="checkbox" name="services" value="Office Address" onchange="updateServicesSummary('add')" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500/20 w-4 h-4">
                                    <span>Office Address</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer font-semibold text-slate-700 hover:text-slate-900 transition-colors">
                                    <input type="checkbox" name="services" value="Tax & Compliance" onchange="updateServicesSummary('add')" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500/20 w-4 h-4">
                                    <span>Tax & Compliance</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer font-semibold text-slate-700 hover:text-slate-900 transition-colors">
                                    <input type="checkbox" name="services" value="Bank Account Opening" onchange="updateServicesSummary('add')" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500/20 w-4 h-4">
                                    <span>Bank Account Opening</span>
                                </label>
                                <div id="add-custom-services-checkboxes-container" class="flex flex-col gap-3"></div>
                                <div class="flex gap-2 mt-2 pt-2 border-t border-slate-200/50 items-center">
                                    <input type="text" id="add-custom-service-input" placeholder="Add custom service..." class="flex-1 px-3 py-1.5 bg-white/60 border border-slate-200 rounded-xl text-[10px] outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold">
                                    <button type="button" onclick="handleAddCustomService('add')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-[10px] transition-all shadow-md shrink-0">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Accordion Section for Pricing -->
                    <div class="border border-slate-200 rounded-2xl overflow-hidden bg-slate-50/50 mt-4">
                        <button type="button" onclick="toggleAccordion('add-pricing-accordion')" class="w-full flex items-center justify-between p-4 text-left font-bold text-xs text-slate-700 bg-white/40 hover:bg-white/70 transition-all outline-none">
                            <span class="flex items-center gap-2">
                                <i data-lucide="dollar-sign" class="w-4 h-4 text-emerald-600"></i>
                                <span>Service Pricing (<span id="add-currency-display">SGD</span> / USD)</span>
                            </span>
                            <i data-lucide="chevron-down" id="add-pricing-chevron" class="w-3.5 h-3.5 transition-transform duration-200"></i>
                        </button>
                        <div id="add-pricing-accordion" class="max-h-0 overflow-hidden transition-all duration-300 ease-in-out border-t border-transparent">
                            <div class="p-4 space-y-3 text-xs bg-white/20">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Base Package Price</label>
                                    <input type="number" id="modal-country-price-base" class="w-full px-3 py-1.5 bg-white/60 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20" value="1200" required>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Corporate Secretary Price (Annual)</label>
                                    <input type="number" id="modal-country-price-secretary" class="w-full px-3 py-1.5 bg-white/60 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20" value="900" required>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Nominee Director Price (Annual)</label>
                                    <input type="number" id="modal-country-price-director" class="w-full px-3 py-1.5 bg-white/60 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20" value="3000" required>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Registered Address Price (Annual)</label>
                                    <input type="number" id="modal-country-price-address" class="w-full px-3 py-1.5 bg-white/60 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20" value="600" required>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Tax & Compliance Price (Annual)</label>
                                    <input type="number" id="modal-country-price-tax" class="w-full px-3 py-1.5 bg-white/60 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20" value="1500" required>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Bank Account Opening Price (One-time)</label>
                                    <input type="number" id="modal-country-price-bank" class="w-full px-3 py-1.5 bg-white/60 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20" value="500" required>
                                </div>
                                <!-- Custom Pricing Container inside Add Drawer -->
                                <div id="add-custom-services-pricing-container" class="space-y-3 border-t border-slate-200/50 pt-3 mt-3 hidden"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-3 pt-6 mt-6 border-t border-slate-100">
                    <button type="button" onclick="closeCountryModal()" class="flex-1 py-3.5 border border-slate-200 text-slate-500 font-bold rounded-xl text-xs transition-all hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition-all shadow-md">Add Country</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Country Drawer -->
    <div id="edit-country-modal" class="hidden fixed inset-0 z-[9999] flex justify-end opacity-0 transition-all duration-300 pointer-events-none">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto" onclick="closeEditCountryModal()"></div>
        <div class="bg-white/95 backdrop-blur-xl border-l border-slate-200 w-full max-w-md shadow-2xl relative z-10 transform translate-x-full transition-transform duration-300 pointer-events-auto flex flex-col h-full p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-xl font-bold font-outfit text-slate-900">Edit Country</h3>
                    <p class="text-slate-500 text-xs mt-0.5">Modify the jurisdiction details and mapped services.</p>
                </div>
                <button type="button" onclick="closeEditCountryModal()" class="text-slate-400 hover:text-slate-600 transition-colors p-1.5 hover:bg-slate-100 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="edit-country-form" class="space-y-4 flex-1 flex flex-col justify-between">
                <div class="space-y-4">
                    <input type="hidden" id="edit-country-idx">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Country Name</label>
                        <input type="text" id="edit-country-name" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Country Code</label>
                        <input type="text" id="edit-country-code" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">UEN / Registration Format</label>
                        <input type="text" id="edit-country-uen" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Corporate Tax Rate</label>
                        <input type="text" id="edit-country-tax" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required>
                    </div>
                    <div>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();

        const CURRENCY_MAP = {
            'SG': 'SGD',
            'HK': 'HKD',
            'USA': 'USD',
            'UAE': 'AED',
            'AUS': 'AUD',
            'UK': 'GBP',
            'ID': 'IDR',
            'MY': 'MYR',
            'IN': 'INR',
            'VN': 'VND',
            'TH': 'THB',
            'PH': 'PHP',
            'JP': 'JPY',
            'DE': 'EUR',
            'FR': 'EUR',
            'CAN': 'CAD'
        };

        window.toggleSubmenu = function(id) {
            const submenu = document.getElementById(id);
            const btn = document.getElementById('btn-services');
            if (submenu) {
                const isOpen = !submenu.classList.contains('hidden');
                if (isOpen) {
                    submenu.classList.add('hidden');
                    btn.classList.remove('submenu-open');
                } else {
                    submenu.classList.remove('hidden');
                    btn.classList.add('submenu-open');
                }
            }
        }

        function initializePage() {
            const submenu = document.getElementById('services-submenu');
            const btn = document.getElementById('btn-services');
            if (submenu) submenu.classList.remove('hidden');
            if (btn) btn.classList.add('submenu-open', 'active');
            loadCountries();

            // Auto-fill logic based on country name input
            const COUNTRY_LOOKUP = {
                "singapore": { code: "SG", uen: "9-character alphanumeric", tax: "17% (flat rate)", compliance: "99.5%" },
                "hong kong": { code: "HK", uen: "8-digit registration no.", tax: "16.5% (two-tier)", compliance: "98.8%" },
                "united states": { code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%" },
                "united states of america": { code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%" },
                "usa": { code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%" },
                "dubai": { code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%" },
                "united arab emirates": { code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%" },
                "uae": { code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%" },
                "australia": { code: "AUS", uen: "9-digit ACN number", tax: "25% - 30%", compliance: "96.8%" },
                "united kingdom": { code: "UK", uen: "8-digit CRN number", tax: "19% - 25%", compliance: "98.5%" },
                "uk": { code: "UK", uen: "8-digit CRN number", tax: "19% - 25%", compliance: "98.5%" },
                "indonesia": { code: "ID", uen: "15-digit NPWP number", tax: "22% (standard flat)", compliance: "95.0%" },
                "malaysia": { code: "MY", uen: "12-digit registration no.", tax: "24% (standard rate)", compliance: "96.2%" },
                "india": { code: "IN", uen: "10-character alphanumeric PAN/TAN", tax: "25% - 30%", compliance: "94.8%" },
                "vietnam": { code: "VN", uen: "10-digit enterprise code", tax: "20% (flat rate)", compliance: "93.5%" },
                "thailand": { code: "TH", uen: "13-digit registration no.", tax: "20% (standard rate)", compliance: "94.2%" },
                "philippines": { code: "PH", uen: "9-to-12 digit TIN number", tax: "25% (standard flat)", compliance: "92.8%" },
                "japan": { code: "JP", uen: "13-digit corporate number", tax: "30.6% (effective rate)", compliance: "98.9%" },
                "germany": { code: "DE", uen: "9-digit Handelsregisternummer", tax: "15.8% (plus trade tax)", compliance: "99.2%" },
                "france": { code: "FR", uen: "9-digit SIREN number", tax: "25% (standard rate)", compliance: "98.1%" },
                "canada": { code: "CAN", uen: "9-digit business registration no.", tax: "15% - 26.5%", compliance: "97.8%" }
            };

            const nameInput = document.getElementById('modal-country-name');
            if (nameInput) {
                const autofill = () => {
                    const val = nameInput.value.toLowerCase().trim();
                    if (COUNTRY_LOOKUP[val]) {
                        const info = COUNTRY_LOOKUP[val];
                        document.getElementById('modal-country-code').value = info.code;
                        document.getElementById('modal-country-uen').value = info.uen;
                        document.getElementById('modal-country-tax').value = info.tax;
                        document.getElementById('modal-country-compliance').value = info.compliance;
                        // Update Add modal currency display
                        const addCurrencyDisplay = document.getElementById('add-currency-display');
                        if (addCurrencyDisplay) {
                            addCurrencyDisplay.textContent = CURRENCY_MAP[info.code] || info.code;
                        }
                    }
                };
                nameInput.addEventListener('input', autofill);
                nameInput.addEventListener('change', autofill);
                nameInput.addEventListener('keyup', autofill);
                nameInput.addEventListener('blur', autofill);
            }

            // Update Add modal currency display when country code is manually changed
            const codeInput = document.getElementById('modal-country-code');
            if (codeInput) {
                const updateAddCurrency = () => {
                    const code = codeInput.value.trim().toUpperCase();
                    const addCurrencyDisplay = document.getElementById('add-currency-display');
                    if (addCurrencyDisplay) {
                        addCurrencyDisplay.textContent = CURRENCY_MAP[code] || (code || 'SGD');
                    }
                };
                codeInput.addEventListener('input', updateAddCurrency);
                codeInput.addEventListener('change', updateAddCurrency);
                codeInput.addEventListener('blur', updateAddCurrency);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            initializePage();
        }

        let countries = [];
        const DEFAULT_COUNTRIES = [
            { id: "CNTRY-singapore", name: "Singapore", code: "SG", uen: "9-character alphanumeric", tax: "17% (flat rate)", compliance: "99.5%", status: "ACTIVE", basePrice: 1315, priceSecretary: 900, priceDirector: 3000, priceAddress: 600, priceTax: 1500, priceBank: 500, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-hong-kong", name: "Hong Kong", code: "HK", uen: "8-digit registration no.", tax: "16.5% (two-tier)", compliance: "98.8%", status: "ACTIVE", basePrice: 1650, priceSecretary: 800, priceDirector: 2500, priceAddress: 500, priceTax: 1200, priceBank: 400, services: ["Company Incorporation", "Corporate Secretary", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-united-states", name: "United States", code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%", status: "ACTIVE", basePrice: 1200, priceSecretary: 1000, priceDirector: 3000, priceAddress: 700, priceTax: 1500, priceBank: 500, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-dubai", name: "Dubai", code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%", status: "ACTIVE", basePrice: 2500, priceSecretary: 1200, priceDirector: 4000, priceAddress: 900, priceTax: 1800, priceBank: 600, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-australia", name: "Australia", code: "AUS", uen: "9-digit ACN number", tax: "25% - 30%", compliance: "96.8%", status: "ACTIVE", basePrice: 1400, priceSecretary: 950, priceDirector: 3100, priceAddress: 650, priceTax: 1600, priceBank: 550, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] },
            { id: "CNTRY-united-kingdom", name: "United Kingdom", code: "UK", uen: "8-digit CRN number", tax: "19% - 25%", compliance: "98.5%", status: "ACTIVE", basePrice: 1300, priceSecretary: 850, priceDirector: 2800, priceAddress: 550, priceTax: 1400, priceBank: 450, services: ["Company Incorporation", "Corporate Secretary", "Nominee Director", "Office Address", "Tax & Compliance"] }
        ];

        async function loadCountries() {
            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('admin_auth') || '{}').token;
                const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
                const res = await fetch('/api/countries', { headers });
                if (res.ok) {
                    countries = await res.json();
                } else {
                    throw new Error("HTTP error " + res.status);
                }
            } catch (e) {
                console.warn('API error, falling back to static/localStorage:', e);
                const cached = localStorage.getItem('admin_countries');
                
                const getMappedDefaultCountries = () => DEFAULT_COUNTRIES.map(c => {
                    const newC = { ...c, published: true };
                    newC.publishedData = {
                        name: c.name,
                        code: c.code,
                        uen: c.uen,
                        tax: c.tax,
                        compliance: c.compliance,
                        services: c.services ? [...c.services] : [],
                        basePrice: c.basePrice,
                        priceSecretary: c.priceSecretary,
                        priceDirector: c.priceDirector,
                        priceAddress: c.priceAddress,
                        priceTax: c.priceTax,
                        priceBank: c.priceBank,
                        customPrices: c.customPrices ? {...c.customPrices} : {}
                    };
                    return newC;
                });

                if (cached === null) {
                    countries = getMappedDefaultCountries();
                    localStorage.setItem('admin_countries', JSON.stringify(countries));
                } else {
                    try {
                        countries = JSON.parse(cached);
                        const isInvalid = !Array.isArray(countries) || countries.length === 0 || countries.some(c => !c.id || c.basePrice === undefined || c.services === undefined);
                        if (isInvalid) {
                            throw new Error("Outdated cache format");
                        }
                    } catch(err) {
                        countries = getMappedDefaultCountries();
                        localStorage.setItem('admin_countries', JSON.stringify(countries));
                    }
                }
            }
            renderCountryTable();

            // Handle edit parameter from URL (enables edit country drawer when redirected from packages.html)
            const urlParams = new URLSearchParams(window.location.search);
            const editParam = urlParams.get('edit');
            if (editParam) {
                const idx = countries.findIndex(c => c.id === editParam || c.code === editParam || c.name.toLowerCase() === editParam.toLowerCase());
                if (idx !== -1) {
                    setTimeout(() => editCountry(idx), 50);
                }
            }
        }

        function getServicePill(service) {
            let cls = 'bg-slate-50 text-slate-700 border-slate-200';
            if (service.includes('Incorporation')) cls = 'bg-blue-50 text-blue-700 border-blue-200';
            else if (service.includes('Secretary')) cls = 'bg-indigo-50 text-indigo-700 border-indigo-200';
            else if (service.includes('Director')) cls = 'bg-purple-50 text-purple-700 border-purple-200';
            else if (service.includes('Address')) cls = 'bg-amber-50 text-amber-700 border-amber-200';
            else if (service.includes('Tax') || service.includes('Compliance')) cls = 'bg-rose-50 text-rose-700 border-rose-200';
            else if (service.includes('Bank') || service.includes('Opening')) cls = 'bg-emerald-50 text-emerald-700 border-emerald-200';
            return `<span class="px-2 py-0.5 rounded text-[10px] font-semibold border ${cls} whitespace-nowrap inline-block mr-1 mb-1">${service}</span>`;
        }

        function hasUnpublishedChanges(c) {
            if (!c.published || !c.publishedData) return false;
            const fields = ['name', 'code', 'uen', 'tax', 'compliance', 'basePrice', 'priceSecretary', 'priceDirector', 'priceAddress', 'priceTax', 'priceBank'];
            for (let f of fields) {
                const draftVal = c[f] !== undefined && c[f] !== null ? c[f] : '';
                const pubVal = c.publishedData[f] !== undefined && c.publishedData[f] !== null ? c.publishedData[f] : '';
                if (draftVal.toString() !== pubVal.toString()) return true;
            }
            // Check services
            const draftSvc = (c.services || []).slice().sort().join(',');
            const pubSvc = (c.publishedData.services || []).slice().sort().join(',');
            if (draftSvc !== pubSvc) return true;
            
            // Check customPrices
            const draftPrices = JSON.stringify(c.customPrices || {});
            const pubPrices = JSON.stringify(c.publishedData.customPrices || {});
            if (draftPrices !== pubPrices) return true;
            
            return false;
        }

        function renderCountryTable() {
            const tbody = document.getElementById('country-table-body');
            if (!tbody) return;
            tbody.innerHTML = countries.map((c, idx) => {
                const servicesList = c.services || [];
                const servicesHtml = servicesList.map(s => getServicePill(s)).join('') || '<span class="text-slate-400 text-xs">None</span>';
                
                let publishButtonHtml = '';
                if (c.published) {
                    if (hasUnpublishedChanges(c)) {
                        publishButtonHtml = `
                            <button onclick="publishCountry(${idx})" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white text-[10px] font-bold rounded-lg transition-all shadow-sm flex items-center gap-1 font-outfit">
                                ⚡ Republish Changes
                            </button>
                            <span class="text-amber-600 font-bold text-[9px] block mt-1 leading-none">Unpublished draft changes</span>
                            <button onclick="unpublishCountry(${idx})" class="text-slate-500 hover:text-red-500 font-bold text-[9px] mt-1.5 block hover:underline text-left leading-none font-outfit">Unpublish</button>
                        `;
                    } else {
                        publishButtonHtml = `
                            <button onclick="unpublishCountry(${idx})" class="px-3 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-[10px] font-bold rounded-lg transition-all flex items-center gap-1 font-outfit">
                                &#10003; Published &mdash; Unpublish
                            </button>
                        `;
                    }
                } else {
                    publishButtonHtml = `
                        <button onclick="publishCountry(${idx})" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold rounded-lg transition-all shadow-sm flex items-center gap-1 font-outfit">
                            &#9654; Publish to Site
                        </button>
                    `;
                }

                return `
                <tr class="hover:bg-white/30 transition-colors">
                    <td class="font-bold text-blue-600">
                        <div class="flex items-center gap-2">
                            <button onclick="toggleRowDetails(${idx})" class="p-1 hover:bg-slate-200/50 rounded-lg transition-colors flex items-center justify-center outline-none row-toggle-btn">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="transition-transform duration-200" id="chevron-row-${idx}">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </button>
                            <span>${idx + 1}</span>
                        </div>
                    </td>
                    <td class="font-bold text-slate-800">${c.name} (${c.code})</td>
                    <td>${c.tax}</td>
                    <td><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${c.status === 'ACTIVE' ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}">${c.status}</span></td>
                    <td>
                        ${publishButtonHtml}
                    </td>
                    <td>
                        <div class="flex items-center gap-2">
                            <button onclick="editCountry(${idx})" class="text-blue-600 hover:text-blue-800 hover:underline font-bold text-xs font-outfit">Edit</button>
                            <button onclick="window.location.href='packages.html?country=' + encodeURIComponent(c.id)" class="text-indigo-600 hover:text-indigo-800 hover:underline font-bold text-xs font-outfit">Packages</button>
                            <button onclick="deleteCountry(${idx})" class="text-red-500 hover:text-red-700 hover:underline font-bold text-xs font-outfit">Delete</button>
                        </div>

        const STANDARD_SERVICES = [
            "Company Incorporation",
            "Corporate Secretary",
            "Nominee Director",
            "Office Address",
            "Tax & Compliance",
            "Bank Account Opening"
        ];

        function isStandardService(name) {
            return STANDARD_SERVICES.includes(name);
        }

        function getSafeId(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
        }

        window.handleAddCustomService = function(type) {
            const inputEl = document.getElementById(`${type}-custom-service-input`);
            if (!inputEl) return;
            const name = inputEl.value.trim();
            if (!name) return;
            
            // Check if already exists in checkboxes
            const nameAttr = type === 'add' ? 'services' : 'edit-services';
            const allCheckboxes = Array.from(document.querySelectorAll(`#${type}-country-form input[name="${nameAttr}"]`));
            if (allCheckboxes.some(cb => cb.value.toLowerCase() === name.toLowerCase())) {
                alert("Service already exists!");
                return;
            }

            renderCustomCheckbox(type, name, true, 0);
            inputEl.value = '';
            
            // Sync pricing fields and update summary
            syncCustomPricingFields(type);
            updateServicesSummary(type);
        }

        function renderCustomCheckbox(type, name, checked, price) {
            const container = document.getElementById(`${type}-custom-services-checkboxes-container`);
            if (!container) return;

            const nameAttr = type === 'add' ? 'services' : 'edit-services';
            const div = document.createElement('div');
            div.className = 'flex items-center justify-between gap-2 mt-2';
            div.id = `custom-checkbox-row-${type}-${getSafeId(name)}`;
            div.innerHTML = `
                <label class="flex items-center gap-2 cursor-pointer font-semibold text-slate-700 hover:text-slate-900 transition-colors">
                    <input type="checkbox" name="${nameAttr}" value="${name}" ${checked ? 'checked' : ''} onchange="handleCheckboxChange('${type}', '${name}')" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500/20 w-4 h-4">
                    <span>${name}</span>

                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>

        window.handleCheckboxChange = function(type, name) {

        window.removeCustomCheckbox = function(type, name) {
            if (confirm(`Remove custom service "${name}"?`)) {
                const row = document.getElementById(`custom-checkbox-row-${type}-${getSafeId(name)}`);
                if (row) row.remove();
                syncCustomPricingFields(type);
                updateServicesSummary(type);
            }

        function syncCustomPricingFields(type) {
            const nameAttr = type === 'add' ? 'services' : 'edit-services';
            const checkedCheckboxes = Array.from(document.querySelectorAll(`#${type}-country-form input[name="${nameAttr}"]:checked`));
            const customServicesChecked = checkedCheckboxes
                .map(cb => cb.value)
                .filter(val => !isStandardService(val));

            const container = document.getElementById(`${type}-custom-services-pricing-container`);
            if (!container) return;

            // Save currently typed values first
            const existingValues = {};
            container.querySelectorAll('input').forEach(input => {
                existingValues[input.getAttribute('data-service')] = input.value;
            });

            // Re-render the container
            if (customServicesChecked.length === 0) {
                container.innerHTML = '';
                container.classList.add('hidden');
            } else {
                container.classList.remove('hidden');
                container.innerHTML = customServicesChecked.map(srv => {
                    const safeId = getSafeId(srv);
                    const savedVal = existingValues[srv] !== undefined ? existingValues[srv] : '0';
                    return `
                        <div id="custom-price-field-${type}-${safeId}">
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">${srv} Price (USD)</label>
                            <input type="number" id="${type}-price-custom-${safeId}" data-service="${srv}" class="w-full px-3 py-1.5 bg-white/60 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20" value="${savedVal}" required>
                        </div>
                    `;
                }).join('');
            }
            
            // Adjust accordion height if open
            const accordion = document.getElementById(`${type}-pricing-accordion`);
            if (accordion && accordion.style.maxHeight && accordion.style.maxHeight !== '0px') {
                accordion.style.maxHeight = accordion.scrollHeight + 'px';
            }
        }

            const c = countries[idx];
            if (c.published && !c.publishedData) {
                c.publishedData = {

                    uen: c.uen,
                    tax: c.tax,
                    compliance: c.compliance,
                    services: c.services ? [...c.services] : [],
                    basePrice: c.basePrice,
                    priceSecretary: c.priceSecretary,
                    priceDirector: c.priceDirector,
                    priceAddress: c.priceAddress,

                    priceBank: c.priceBank,
                    customPrices: c.customPrices ? {...c.customPrices} : {}
                };
            }
            document.getElementById('edit-country-idx').value = idx;

            document.getElementById('edit-country-code').value = c.code;
            document.getElementById('edit-country-uen').value = c.uen;

            document.getElementById('edit-country-compliance').value = c.compliance;
            document.getElementById('edit-country-status').value = c.status;

            // Update pricing header with country-specific currency
            const editCurrencyDisplay = document.getElementById('edit-currency-display');
            if (editCurrencyDisplay) {
                editCurrencyDisplay.textContent = CURRENCY_MAP[c.code] || c.code || 'SGD';
            }
            
            const checkboxes = document.querySelectorAll('#edit-country-form input[name="edit-services"]');
            const cServices = c.services || [];
            checkboxes.forEach(cb => {
                cb.checked = cServices.includes(cb.value);
            });

            // Populate pricing
            document.getElementById('edit-country-price-base').value = c.basePrice !== undefined && c.basePrice !== null ? c.basePrice : 1200;
            document.getElementById('edit-country-price-secretary').value = c.priceSecretary !== undefined && c.priceSecretary !== null ? c.priceSecretary : 900;
            document.getElementById('edit-country-price-director').value = c.priceDirector !== undefined && c.priceDirector !== null ? c.priceDirector : 3000;
            document.getElementById('edit-country-price-address').value = c.priceAddress !== undefined && c.priceAddress !== null ? c.priceAddress : 600;
            document.getElementById('edit-country-price-tax').value = c.priceTax !== undefined && c.priceTax !== null ? c.priceTax : 1500;
            document.getElementById('edit-country-price-bank').value = c.priceBank !== undefined && c.priceBank !== null ? c.priceBank : 500;
            
            // Clear custom elements
            document.getElementById('edit-custom-services-checkboxes-container').innerHTML = '';
            document.getElementById('edit-custom-services-pricing-container').innerHTML = '';
            
            const customPrices = c.customPrices || {};
            // Gather all custom services (both active and those that have a configured price)
            const allCustomServices = new Set([
                ...cServices.filter(s => !isStandardService(s)),
                ...Object.keys(customPrices).filter(s => !isStandardService(s))
            ]);
            
            allCustomServices.forEach(srv => {
                const checked = cServices.includes(srv);
                const price = customPrices[srv] !== undefined ? customPrices[srv] : 0;
                renderCustomCheckbox('edit', srv, checked, price);
            });
            
            // Sync pricing fields to generate inputs for checked custom services
            syncCustomPricingFields('edit');
            
            // Populate values for those custom pricing inputs
            allCustomServices.forEach(srv => {
                const checked = cServices.includes(srv);
                if (checked) {
                    const price = customPrices[srv] !== undefined ? customPrices[srv] : 0;
                    const safeId = getSafeId(srv);
                    const inputEl = document.getElementById(`edit-price-custom-${safeId}`);
                    if (inputEl) inputEl.value = price;
                }
            });
            
            openEditCountryModal();
        }

        async function saveCountryState(idx, actionText, isLive) {
            const c = countries[idx];
            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('admin_auth') || '{}').token;
                const headers = { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                };
                const res = await fetch(`/api/countries/${c.id}`, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify(c)
                });
                if (!res.ok) throw new Error("HTTP error " + res.status);
                countries[idx] = await res.json();
            } catch (e) {
                console.error("API error while saving country state:", e);
                localStorage.setItem('admin_countries', JSON.stringify(countries));
            }
            renderCountryTable();

            // Toast notification
            const toast = document.createElement('div');
            toast.style.cssText = `position:fixed;bottom:1.5rem;right:1.5rem;z-index:99999;padding:0.75rem 1.25rem;border-radius:1rem;font-size:0.85rem;font-weight:700;color:white;background:${isLive ? '#059669' : '#64748b'};box-shadow:0 8px 24px rgba(0,0,0,0.15);`;
            toast.innerText = `${actionText === 'republished' ? '⚡ Republished!' : (isLive ? '✅ Published!' : '⬇️ Unpublished')} — ${c.name} is now ${isLive ? 'live with latest updates' : 'hidden from the landing page'}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

                    const headers = { 
                        'Authorization': 'Bearer ' + token
                    };
                    const res = await fetch(`/api/countries/${c.id}`, {
                        method: 'DELETE',
                        headers: headers
                    });
                    if (!res.ok) throw new Error("HTTP error " + res.status);
                    countries.splice(idx, 1);
                } catch (e) {
                    console.error("API error while deleting country:", e);
                    // Fallback
                    countries.splice(idx, 1);
                    localStorage.setItem('admin_countries', JSON.stringify(countries));
                }
                renderCountryTable();
            }
        }

                }
            });

            const newCountry = { name, code, uen, tax, compliance, status, published: false, services, basePrice, priceSecretary, priceDirector, priceAddress, priceTax, priceBank, customPrices: addCustomPrices };

            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('admin_auth') || '{}').token;
                const headers = { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                };
                const res = await fetch('/api/countries', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(newCountry)
                });
                if (!res.ok) throw new Error("HTTP error " + res.status);
                
                const saved = await res.json();
                countries.push(saved);
            } catch (e) {
                console.error("API error while saving country:", e);
                // Fallback
                newCountry.id = "CNTRY-" + Date.now();
                countries.push(newCountry);
                localStorage.setItem('admin_countries', JSON.stringify(countries));
            }
            
            document.getElementById('add-country-form').reset();
            // Clear checkboxes
            document.querySelectorAll('#add-country-form input[name="services"]').forEach(cb => cb.checked = false);
            closeCountryModal();
            renderCountryTable();
        });
    </script>
</body>
</html>
