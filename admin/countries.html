<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Management | Globalisor Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <script>
        if (!localStorage.getItem('admin_auth')) window.location.href = '/auth.html';
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: radial-gradient(circle at 50% 10%, rgba(253, 242, 248, 0.9) 0%, rgba(191, 219, 254, 0.7) 40%, rgba(125, 211, 252, 0.8) 100%); background-attachment: fixed; min-height: 100vh; overflow-x: hidden; }
        .top-nav { height: 60px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); position: sticky; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 1.5rem; z-index: 9999; gap: 0.5rem; justify-content: space-between; }
        .main-container { padding: 2rem; max-width: 1600px; margin-left: 240px !important; margin-right: auto; }
        .module-nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: #64748b; transition: all 0.2s; cursor: pointer !important; border: none; background: transparent; white-space: nowrap; width: 100% !important; box-sizing: border-box !important; }
        .module-nav-btn:hover { color: #0f172a; background: rgba(255,255,255,0.6); }
        .module-nav-btn.active { color: #0f172a; background: white !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .top-nav > div:nth-child(2), #module-switcher {
            position: fixed !important;
            top: 60px !important;
            left: 0 !important;
            width: 240px !important;
            height: calc(100vh - 60px) !important;
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(20px) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-top: none !important;
            border-left: none !important;
            border-bottom: none !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 1.5rem 1rem !important;
            gap: 0.5rem !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
            z-index: 9998 !important;
            box-shadow: none !important;
        }
        
        .submenu-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            transition: all 0.3s ease;
        }
        .submenu-container.hidden {
            display: none !important;
        }
        .submenu-arrow {
            transition: transform 0.2s ease;
        }
        .submenu-open .submenu-arrow {
            transform: rotate(180deg);
        }
        
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th { padding: 1rem 1.5rem; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #f1f5f9; background: rgba(248, 250, 252, 0.5); }
        .admin-table td { padding: 1rem 1.5rem; font-size: 0.85rem; color: #1e293b; border-bottom: 1px solid #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04); }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="flex items-center gap-4">
            <div class="flex flex-col leading-none cursor-pointer" onclick="window.location.href='dashboard.html'">
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Admin</span>
                <span class="font-outfit font-bold text-slate-900 text-sm uppercase tracking-wider">Dashboard</span>
            </div>
        </div>
        <div id="module-switcher" class="flex items-center gap-1 bg-white/60 p-1 rounded-xl border border-white/80">
            <button onclick="window.location.href='dashboard.html'" class="module-nav-btn" id="btn-clients"><i data-lucide="users" class="w-4 h-4"></i> Clients</button>
            <button onclick="window.location.href='applications.html'" class="module-nav-btn" id="btn-applications"><i data-lucide="file-text" class="w-4 h-4"></i> Applications</button>
            <button onclick="window.location.href='kyc.html'" class="module-nav-btn" id="btn-kyc"><i data-lucide="shield-check" class="w-4 h-4"></i> KYC Review</button>
            <button onclick="window.location.href='compliance.html'" class="module-nav-btn" id="btn-compliance"><i data-lucide="balance-scale" class="w-4 h-4"></i> Compliance</button>
            
            <button onclick="window.location.href='reports.html'" class="module-nav-btn" id="btn-reports"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reports</button>
            <button onclick="window.location.href='messages.html'" class="module-nav-btn" id="btn-messages"><i data-lucide="message-square" class="w-4 h-4"></i> Messages</button>
            <button onclick="window.location.href='content.html'" class="module-nav-btn" id="btn-content"><i data-lucide="book-open" class="w-4 h-4"></i> Content</button>

            <!-- Services Accordion Group -->
            <div class="w-full flex flex-col gap-0.5">
                <button onclick="toggleSubmenu('services-submenu')" class="module-nav-btn" id="btn-services">
                    <i data-lucide="briefcase" class="w-4 h-4"></i>
                    <span class="flex-1 text-left">Services</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 submenu-arrow transition-transform"></i>
                </button>
                <div id="services-submenu" class="submenu-container hidden pl-6 flex flex-col gap-0.5 mt-0.5">
                    <button onclick="window.location.href='blogs.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-blogs"><i data-lucide="layout" class="w-3.5 h-3.5"></i> Blogs</button>
                    <button onclick="window.location.href='countries.html'" class="module-nav-btn active py-1.5 text-[0.75rem]" id="btn-countries"><i data-lucide="globe" class="w-3.5 h-3.5"></i> Countries</button>
                    <button onclick="window.location.href='packages.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-packages"><i data-lucide="package" class="w-3.5 h-3.5"></i> Packages</button>
                    <button onclick="window.location.href='users.html'" class="module-nav-btn py-1.5 text-[0.75rem]" id="btn-users"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Users</button>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 relative">
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold text-xs">A</div>
                <div class="flex flex-col">
                    <div class="text-xs font-semibold text-slate-800">Admin Team</div>
                    <button onclick="localStorage.removeItem('admin_auth'); localStorage.removeItem('token'); window.location.href='/auth.html'" class="text-[10px] text-red-500 font-bold hover:underline text-left leading-none">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="space-y-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-3xl font-bold font-outfit text-slate-900">Country Hubs</h2>
                </div>
                <button onclick="openCountryModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs flex items-center gap-2 transition-all shadow-md shadow-blue-500/10">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Country
                </button>
            </div>

            <div class="glass-card overflow-hidden">
                <table class="admin-table">
                    <thead>
                        <tr class="text-left">
                            <th class="w-16">No</th>
                            <th>Jurisdiction</th>
                            <th>UEN Format</th>
                            <th>Corporate Tax</th>
                            <th>Compliance Score</th>
                            <th>Status</th>
                            <th>Landing Page</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="country-table-body">
                        <!-- Dynamic countries will be rendered here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Country Modal -->
    <div id="add-country-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center opacity-0 transition-all duration-300 pointer-events-none">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto" onclick="closeCountryModal()"></div>
        <div class="bg-white/95 backdrop-blur-xl border border-white/60 rounded-3xl p-8 w-full max-w-md shadow-2xl relative z-10 transform scale-90 transition-transform pointer-events-auto">
            <h3 class="text-xl font-bold font-outfit text-slate-900 mb-2">Add New Country</h3>
            <p class="text-slate-500 text-xs mb-6">Enter the jurisdiction details to add to the hub.</p>
            
            <form id="add-country-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Country Name</label>
                    <input type="text" id="modal-country-name" list="countries-list" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. Singapore">
                    <datalist id="countries-list">
                        <option value="Singapore">
                        <option value="Hong Kong">
                        <option value="United States">
                        <option value="Dubai">
                        <option value="United Arab Emirates">
                        <option value="Australia">
                        <option value="United Kingdom">
                        <option value="Indonesia">
                        <option value="Malaysia">
                        <option value="India">
                        <option value="Vietnam">
                        <option value="Thailand">
                        <option value="Philippines">
                        <option value="Japan">
                        <option value="Germany">
                        <option value="France">
                        <option value="Canada">
                    </datalist>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Country Code</label>
                    <input type="text" id="modal-country-code" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. SG">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">UEN / Registration Format</label>
                    <input type="text" id="modal-country-uen" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. 9-character alphanumeric">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Corporate Tax Rate</label>
                    <input type="text" id="modal-country-tax" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. 17% (flat rate)">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Compliance Score</label>
                    <input type="text" id="modal-country-compliance" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold" required placeholder="e.g. 99.5%">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Status</label>
                    <select id="modal-country-status" class="w-full px-3 py-2 bg-white/60 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-semibold">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>
                
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeCountryModal()" class="flex-1 py-3 border border-slate-200 text-slate-500 font-bold rounded-xl text-xs transition-all hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition-all shadow-md">Add Country</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();

        window.toggleSubmenu = function(id) {
            const submenu = document.getElementById(id);
            const btn = document.getElementById('btn-services');
            if (submenu) {
                const isOpen = !submenu.classList.contains('hidden');
                if (isOpen) {
                    submenu.classList.add('hidden');
                    btn.classList.remove('submenu-open');
                } else {
                    submenu.classList.remove('hidden');
                    btn.classList.add('submenu-open');
                }
            }
        }

        function initializePage() {
            const submenu = document.getElementById('services-submenu');
            const btn = document.getElementById('btn-services');
            if (submenu) submenu.classList.remove('hidden');
            if (btn) btn.classList.add('submenu-open', 'active');
            loadCountries();

            // Auto-fill logic based on country name input
            const COUNTRY_LOOKUP = {
                "singapore": { code: "SG", uen: "9-character alphanumeric", tax: "17% (flat rate)", compliance: "99.5%" },
                "hong kong": { code: "HK", uen: "8-digit registration no.", tax: "16.5% (two-tier)", compliance: "98.8%" },
                "united states": { code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%" },
                "united states of america": { code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%" },
                "usa": { code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%" },
                "dubai": { code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%" },
                "united arab emirates": { code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%" },
                "uae": { code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%" },
                "australia": { code: "AUS", uen: "9-digit ACN number", tax: "25% - 30%", compliance: "96.8%" },
                "united kingdom": { code: "UK", uen: "8-digit CRN number", tax: "19% - 25%", compliance: "98.5%" },
                "uk": { code: "UK", uen: "8-digit CRN number", tax: "19% - 25%", compliance: "98.5%" },
                "indonesia": { code: "ID", uen: "15-digit NPWP number", tax: "22% (standard flat)", compliance: "95.0%" },
                "malaysia": { code: "MY", uen: "12-digit registration no.", tax: "24% (standard rate)", compliance: "96.2%" },
                "india": { code: "IN", uen: "10-character alphanumeric PAN/TAN", tax: "25% - 30%", compliance: "94.8%" },
                "vietnam": { code: "VN", uen: "10-digit enterprise code", tax: "20% (flat rate)", compliance: "93.5%" },
                "thailand": { code: "TH", uen: "13-digit registration no.", tax: "20% (standard rate)", compliance: "94.2%" },
                "philippines": { code: "PH", uen: "9-to-12 digit TIN number", tax: "25% (standard flat)", compliance: "92.8%" },
                "japan": { code: "JP", uen: "13-digit corporate number", tax: "30.6% (effective rate)", compliance: "98.9%" },
                "germany": { code: "DE", uen: "9-digit Handelsregisternummer", tax: "15.8% (plus trade tax)", compliance: "99.2%" },
                "france": { code: "FR", uen: "9-digit SIREN number", tax: "25% (standard rate)", compliance: "98.1%" },
                "canada": { code: "CAN", uen: "9-digit business registration no.", tax: "15% - 26.5%", compliance: "97.8%" }
            };

            const nameInput = document.getElementById('modal-country-name');
            if (nameInput) {
                const autofill = () => {
                    const val = nameInput.value.toLowerCase().trim();
                    if (COUNTRY_LOOKUP[val]) {
                        const info = COUNTRY_LOOKUP[val];
                        document.getElementById('modal-country-code').value = info.code;
                        document.getElementById('modal-country-uen').value = info.uen;
                        document.getElementById('modal-country-tax').value = info.tax;
                        document.getElementById('modal-country-compliance').value = info.compliance;
                    }
                };
                nameInput.addEventListener('input', autofill);
                nameInput.addEventListener('change', autofill);
                nameInput.addEventListener('keyup', autofill);
                nameInput.addEventListener('blur', autofill);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            initializePage();
        }

        let countries = [];
        const DEFAULT_COUNTRIES = [
            { name: "Singapore", code: "SG", uen: "9-character alphanumeric", tax: "17% (flat rate)", compliance: "99.5%", status: "ACTIVE" },
            { name: "Hong Kong", code: "HK", uen: "8-digit registration no.", tax: "16.5% (two-tier)", compliance: "98.8%", status: "ACTIVE" },
            { name: "United States", code: "USA", uen: "9-digit EIN number", tax: "21% (federal flat)", compliance: "97.2%", status: "ACTIVE" },
            { name: "Dubai", code: "UAE", uen: "Varies by Free Zone", tax: "9% (above 375k AED)", compliance: "99.1%", status: "ACTIVE" },
            { name: "Australia", code: "AUS", uen: "9-digit ACN number", tax: "25% - 30%", compliance: "96.8%", status: "ACTIVE" },
            { name: "United Kingdom", code: "UK", uen: "8-digit CRN number", tax: "19% - 25%", compliance: "98.5%", status: "ACTIVE" }
        ];

        async function loadCountries() {
            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('admin_auth') || '{}').token;
                const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
                const res = await fetch('/api/countries', { headers });
                if (res.ok) {
                    countries = await res.json();
                } else {
                    throw new Error("HTTP error " + res.status);
                }
            } catch (e) {
                console.warn('API error, falling back to static/localStorage:', e);
                const cached = localStorage.getItem('admin_countries');
                if (cached === null) {
                    countries = DEFAULT_COUNTRIES.map(c => ({ ...c, published: true }));
                    localStorage.setItem('admin_countries', JSON.stringify(countries));
                } else {
                    try {
                        countries = JSON.parse(cached);
                        if (!Array.isArray(countries)) countries = DEFAULT_COUNTRIES.map(c => ({ ...c, published: true }));
                    } catch(err) {
                        countries = DEFAULT_COUNTRIES.map(c => ({ ...c, published: true }));
                    }
                }
            }
            renderCountryTable();
        }

        function renderCountryTable() {
            const tbody = document.getElementById('country-table-body');
            if (!tbody) return;
            tbody.innerHTML = countries.map((c, idx) => `
                <tr class="hover:bg-white/40 transition-colors">
                    <td class="font-bold text-blue-600">${idx + 1}</td>
                    <td class="font-bold text-slate-800">${c.name} (${c.code})</td>
                    <td>${c.uen}</td>
                    <td>${c.tax}</td>
                    <td class="font-semibold ${parseFloat(c.compliance) >= 98 ? 'text-emerald-600' : 'text-blue-600'}">${c.compliance}</td>
                    <td><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${c.status === 'ACTIVE' ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}">${c.status}</span></td>
                    <td>
                        ${c.published
                            ? `<button onclick="publishCountry(${idx})" class="px-3 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-[10px] font-bold rounded-lg transition-all flex items-center gap-1">
                                &#10003; Published &mdash; Unpublish
                               </button>`
                            : `<button onclick="publishCountry(${idx})" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold rounded-lg transition-all shadow-sm flex items-center gap-1">
                                &#9654; Publish to Site
                               </button>`
                        }
                    </td>
                    <td>
                        <button onclick="deleteCountry(${idx})" class="text-red-500 hover:text-red-700 hover:underline font-bold text-xs">Delete</button>
                    </td>
                </tr>
            `).join('') || `<tr><td colspan="8" class="p-8 text-center text-slate-400">No country hubs registered.</td></tr>`;
        }

        window.publishCountry = async function(idx) {
            const c = countries[idx];
            const willPublish = !c.published;
            const action = willPublish ? 'publish' : 'unpublish';
            if (!confirm(`Are you sure you want to ${action} "${c.name}"? ${willPublish ? 'It will appear on the landing page.' : 'It will be removed from the landing page.'}`)) return;

            // Optimistic update
            c.published = willPublish;

            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('admin_auth') || '{}').token;
                const headers = { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                };
                const res = await fetch(`/api/countries/${c.id}`, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify(c)
                });
                if (!res.ok) throw new Error("HTTP error " + res.status);
                countries[idx] = await res.json();
            } catch (e) {
                console.error("API error while publishing country:", e);
                // Fallback to local storage
                localStorage.setItem('admin_countries', JSON.stringify(countries));
            }
            renderCountryTable();

            // Toast notification
            const toast = document.createElement('div');
            toast.style.cssText = `position:fixed;bottom:1.5rem;right:1.5rem;z-index:99999;padding:0.75rem 1.25rem;border-radius:1rem;font-size:0.85rem;font-weight:700;color:white;background:${willPublish ? '#059669' : '#64748b'};box-shadow:0 8px 24px rgba(0,0,0,0.15);`;
            toast.innerText = `${willPublish ? '✅ Published!' : '⬇️ Unpublished'} — ${c.name} is now ${willPublish ? 'live on the landing page' : 'hidden from the landing page'}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        window.deleteCountry = async function(idx) {
            if (confirm("Are you sure you want to delete this country?")) {
                const c = countries[idx];
                try {
                    const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('admin_auth') || '{}').token;
                    const headers = { 
                        'Authorization': 'Bearer ' + token
                    };
                    const res = await fetch(`/api/countries/${c.id}`, {
                        method: 'DELETE',
                        headers: headers
                    });
                    if (!res.ok) throw new Error("HTTP error " + res.status);
                    countries.splice(idx, 1);
                } catch (e) {
                    console.error("API error while deleting country:", e);
                    // Fallback
                    countries.splice(idx, 1);
                    localStorage.setItem('admin_countries', JSON.stringify(countries));
                }
                renderCountryTable();
            }
        }

        window.openCountryModal = function() {
            const modal = document.getElementById('add-country-modal');
            modal.classList.remove('hidden');
            modal.offsetHeight; // force reflow
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.remove('scale-90');
            modal.classList.add('opacity-100', 'pointer-events-auto');
        }

        window.closeCountryModal = function() {
            const modal = document.getElementById('add-country-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.add('scale-90');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.getElementById('add-country-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('modal-country-name').value.trim();
            const code = document.getElementById('modal-country-code').value.trim();
            const uen = document.getElementById('modal-country-uen').value.trim();
            const tax = document.getElementById('modal-country-tax').value.trim();
            const compliance = document.getElementById('modal-country-compliance').value.trim();
            const status = document.getElementById('modal-country-status').value;

            const newCountry = { name, code, uen, tax, compliance, status, published: false };

            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('admin_auth') || '{}').token;
                const headers = { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                };
                const res = await fetch('/api/countries', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(newCountry)
                });
                if (!res.ok) throw new Error("HTTP error " + res.status);
                
                const saved = await res.json();
                countries.push(saved);
            } catch (e) {
                console.error("API error while saving country:", e);
                // Fallback
                newCountry.id = "CNTRY-" + Date.now();
                countries.push(newCountry);
                localStorage.setItem('admin_countries', JSON.stringify(countries));
            }
            
            document.getElementById('add-country-form').reset();
            closeCountryModal();
            renderCountryTable();
        });
    </script>
</body>
</html>
