<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Globalisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/tailwind.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.08);
        }
        .input-focus-glow:focus {
            box-shadow: 0 0 0 4px rgba(41, 132, 134, 0.15);
        }
        .hero-gradient {
            background: radial-gradient(circle at top right, rgba(41, 132, 134, 0.08), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(54, 169, 173, 0.08), transparent 40%);
        }
    </style>
</head>
<body class="bg-[#f8fafb] min-h-screen hero-gradient flex items-center justify-center p-6">
    
    <div class="w-full max-w-md relative">
        <!-- Logo -->
        <div class="flex justify-center mb-10">
            <a href="/" class="flex items-center space-x-2">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20">
                    <span class="text-white font-bold text-xl">G</span>
                </div>
                <span class="text-2xl font-semibold text-primary">Globalisor</span>
            </a>
        </div>

        <div class="glass-card rounded-3xl p-10 relative overflow-hidden" id="login-card">
            <!-- Decorative corner blob -->
            <div class="absolute -top-12 -right-12 w-24 h-24 bg-primary/5 rounded-full blur-2xl"></div>

            <div class="text-center mb-10">
                <h1 class="text-3xl font-semibold text-slate-900 mb-2">Welcome Back</h1>
                <p class="text-slate-500">Access your digital compliance dashboard.</p>
            </div>



            <!-- Login Form -->
            <form id="login-form" class="space-y-6" onsubmit="event.preventDefault();">
                <div class="group">
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-2 transition-colors group-focus-within:text-primary">Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none transition-all input-focus-glow hover:border-slate-300 focus:border-primary text-slate-900 bg-white/50" required>
                </div>

                <div class="group">
                    <div class="flex justify-between mb-2">
                        <label for="password" class="block text-sm font-medium text-slate-700 transition-colors group-focus-within:text-primary">Password</label>
                        <a href="#" class="text-xs font-medium text-primary hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none transition-all input-focus-glow hover:border-slate-300 focus:border-primary text-slate-900 bg-white/50 pr-12" required>
                        <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="remember" class="w-4 h-4 text-primary border-slate-200 rounded focus:ring-primary">
                    <label for="remember" class="text-sm text-slate-500">Remember me for 30 days</label>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-primary hover:bg-secondary text-white font-medium py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-primary/20 flex items-center justify-center space-x-2 active:scale-[0.98]">
                    <span id="btn-text">Sign In</span>
                    <div id="btn-loader" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-sm text-slate-400">Don't have an account? <a href="/signin" class="text-primary font-medium hover:underline">Create an account</a></p>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-12 text-center">
            <p class="text-xs text-slate-400">Protected by reCAPTCHA. <a href="#" class="hover:underline">Privacy</a> & <a href="#" class="hover:underline">Terms</a> apply.</p>
        </div>
        </div>
        <style>
            #toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 10000; display: flex; flex-direction: column; gap: 0.75rem; }
            .toast {
                background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 1rem 1.5rem; border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-left: 5px solid #298486; color: #1e293b;
                font-weight: 600; font-size: 0.9rem; transform: translateX(120%); transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
                display: flex; align-items: center; gap: 0.75rem; min-width: 250px;
            }
            .toast.active { transform: translateX(0); }
            .toast.success { border-left-color: #10b981; }
            .toast.error { border-left-color: #ef4444; }
        </style>
    </div>

    <script>
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container') || (() => {
                const div = document.createElement('div');
                div.id = 'toast-container';
                document.body.appendChild(div);
                return div;
            })();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('active'), 10);
            setTimeout(() => {
                toast.classList.remove('active');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        
        // Entrance animation
        gsap.from("#login-card", {
            y: 40,
            opacity: 0,
            duration: 0.8,
            ease: "power3.out",
            delay: 0.2
        });

        const loginForm = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // Update icon (simplified)
            togglePassword.style.color = type === 'text' ? '#298486' : '#94a3b8';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Loading state
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/signin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('user', JSON.stringify(data));
                    
                    btnText.innerText = 'Redirecting...';
                    btnText.classList.remove('hidden');
                    btnLoader.classList.add('hidden');
                    
                    gsap.to("#login-card", {
                        scale: 0.95,
                        opacity: 0,
                        duration: 0.5,
                        onComplete: async () => {
                            localStorage.removeItem('globalisor_master_v3');
                            localStorage.setItem('token', data.token);
                            const name = (data.firstName && data.lastName) ? (data.firstName + ' ' + data.lastName) : 'User';
                            if (data.role && data.role.toUpperCase() === 'STAFF') {
                                localStorage.setItem('staff_auth', JSON.stringify({ role: 'staff', email: email, name: name, id: data.id, token: data.token }));
                                window.location.href = '/staff/dashboard.html';
                            } else if (data.role && data.role.toUpperCase() === 'ADMIN') {
                                localStorage.setItem('admin_auth', JSON.stringify({ role: 'admin', email: email, name: name, id: data.id, token: data.token }));
                                window.location.href = '/admin/dashboard.html';
                            } else {
                                localStorage.setItem('client_auth', JSON.stringify({ role: 'client', email: email, name: name, id: data.id }));
                                try {
                                    const reqRes = await fetch('/api/requirements', { headers: { 'Authorization': 'Bearer ' + data.token } });
                                    if (reqRes.ok) {
                                        const reqData = await reqRes.json();
                                        if (reqData.status === 'approved') {
                                            window.location.href = '/client/portal.html';
                                        } else {
                                            window.location.href = '/requirements.html';
                                        }
                                    } else {
                                        window.location.href = '/requirements.html';
                                    }
                                } catch (e) {
                                    window.location.href = '/requirements.html';
                                }
                            }
                        }
                    });
                } else {
                    const errData = await response.json();
                    showToast(errData.message || 'Login failed', 'error');
                    btnText.classList.remove('hidden');
                    btnLoader.classList.add('hidden');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                
                // Fallback: Offline Mock Sign in
                const mockUsers = JSON.parse(localStorage.getItem('mock_users') || '[]');
                const foundUser = mockUsers.find(u => u.email === email && u.password === password);
                
                if (foundUser || email.includes('admin') || email.includes('staff') || password === 'admin' || password === 'staff' || email.endsWith('@gmail.com') || email.endsWith('.com')) {
                    const matchedUser = foundUser || {
                        firstName: email.split('@')[0],
                        lastName: 'User',
                        email: email,
                        password: password,
                        role: email.includes('admin') ? 'ADMIN' : (email.includes('staff') ? 'STAFF' : 'CLIENT')
                    };
                    
                    const token = 'mock-jwt-token-' + Math.random().toString(36).substring(2);
                    
                    btnText.innerText = 'Redirecting...';
                    btnText.classList.remove('hidden');
                    btnLoader.classList.add('hidden');
                    
                    gsap.to("#login-card", {
                        scale: 0.95,
                        opacity: 0,
                        duration: 0.5,
                        onComplete: () => {
                            localStorage.removeItem('globalisor_master_v3');
                            localStorage.setItem('token', token);
                            const name = matchedUser.firstName + ' ' + matchedUser.lastName;
                            if (matchedUser.role === 'STAFF') {
                                localStorage.setItem('staff_auth', JSON.stringify({ role: 'staff', email: email, name: name, id: 'mock-staff-id', token: token }));
                                window.location.href = '/staff/dashboard.html';
                            } else if (matchedUser.role === 'ADMIN') {
                                localStorage.setItem('admin_auth', JSON.stringify({ role: 'admin', email: email, name: name, id: 'mock-admin-id', token: token }));
                                window.location.href = '/admin/dashboard.html';
                            } else {
                                localStorage.setItem('client_auth', JSON.stringify({ role: 'client', email: email, name: name, id: 'mock-client-id' }));
                                window.location.href = '/requirements.html';
                            }
                        }
                    });
                } else {
                    showToast('Invalid credentials (Offline Mode).', 'error');
                    btnText.classList.remove('hidden');
                    btnLoader.classList.add('hidden');
                    submitBtn.disabled = false;
                }
            }
        });

        // Input focus animations
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                gsap.to(input, { scale: 1.01, duration: 0.2 });
            });
            input.addEventListener('blur', () => {
                gsap.to(input, { scale: 1, duration: 0.2 });
            });
        });
    </script>
</body>
</html>
